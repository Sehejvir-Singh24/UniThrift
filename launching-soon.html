<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="robots" content="noindex, nofollow, noarchive"/>
  <meta name="theme-color" content="#006e2f"/>
  <title>UniThrift is Launching Soon</title>
  <style>
    :root { color-scheme: light; --ink:#0b1c30; --muted:#50617a; --green:#006e2f; --mint:#6bff8f; --surface:#f8f9ff; }
    * { box-sizing:border-box; }
    body { min-height:100dvh; margin:0; display:grid; place-items:center; overflow:hidden; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(circle at 15% 20%,rgba(107,255,143,.28),transparent 30%),radial-gradient(circle at 86% 83%,rgba(144,192,255,.34),transparent 35%),var(--surface); }
    main { width:min(100% - 40px,560px); padding:clamp(32px,7vw,58px) clamp(24px,6vw,52px); text-align:center; background:rgba(255,255,255,.78); border:1px solid rgba(188,203,185,.65); border-radius:32px; box-shadow:0 24px 70px rgba(11,28,48,.12); backdrop-filter:blur(18px); }
    .mark { width:62px; height:62px; margin:0 auto 24px; display:grid; place-items:center; color:white; background:linear-gradient(135deg,#008d43,#005b29); border-radius:20px; box-shadow:0 10px 22px rgba(0,110,47,.25); font-size:27px; font-weight:800; }
    .brand { margin:0; color:var(--green); font-size:15px; font-weight:800; letter-spacing:.03em; }
    h1 { margin:14px 0 0; font-size:clamp(35px,8vw,60px); line-height:1; letter-spacing:-.055em; }
    p { max-width:420px; margin:20px auto 0; color:var(--muted); font-size:16px; line-height:1.65; }
    .status { display:inline-flex; align-items:center; gap:8px; margin-top:28px; padding:10px 14px; color:#005321; background:rgba(107,255,143,.24); border:1px solid rgba(0,110,47,.18); border-radius:999px; font-size:13px; font-weight:750; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 0 5px rgba(0,110,47,.1); }
    footer { margin-top:30px; color:#7b8b80; font-size:12px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">U</div>
    <p class="brand">UniThrift</p>
    <h1>Launching soon.</h1>
    <p>We’re putting the finishing touches on a safer, simpler campus marketplace. Please check back soon.</p>
    <div class="status"><span class="dot"></span> Preparing for launch</div>
    <footer>© 2026 UniThrift</footer>
  </main>
</body>
</html>
