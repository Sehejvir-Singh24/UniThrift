</section>
<!-- Lifestyle Tags -->
<section class="space-y-stack-md">

<div class="flex flex-wrap gap-unit">

        </button>
<button class="lifestyle-chip px-4 py-2 rounded-full font-body-sm text-body-sm bg-primary text-on-primary transition-all flex items-center gap-1 shadow-[0_4px_12px_rgba(34,197,94,0.2)]">
<span class="material-symbols-outlined text-[18px]">pets</span> Pet Friendly
        </button>
<button class="lifestyle-chip px-4 py-2 rounded-full font-body-sm text-body-sm bg-surface-container text-on-surface transition-all flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]">wb_sunny</span> Early Bird
        </button>
<button class="lifestyle-chip px-4 py-2 rounded-full font-body-sm text-body-sm bg-surface-container text-on-surface transition-all flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]">menu_book</span> Studious
        </button>
</div>
</section>
<!-- Roommate Preferences -->
<section class="bg-surface-container-low rounded-[24px] p-6 space-y-stack-md shadow-[0_4px_20px_rgba(0,0,0,0.02)]">
<div class="flex items-center justify-between">
<div class="space-y-1">
<h3 class="font-title-md text-title-md text-on-surface">Looking for Flatmates</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Include others in your search</p>
</div>
<button class="relative w-12 h-6 rounded-full bg-primary transition-colors duration-300" id="flatmate-toggle">
<div class="absolute top-1 left-1 w-4 h-4 rounded-full bg-on-primary transform translate-x-6 transition-transform duration-300" id="flatmate-toggle-thumb"></div>
</button>
</div>
<div class="space-y-stack-md pt-stack-sm" id="flatmate-options">
<div class="space-y-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant">PREFERRED GENDER</label>
<div class="flex bg-surface-container p-1 rounded-xl">
<button class="flex-1 py-2 rounded-lg font-body-sm text-body-sm bg-surface text-on-surface shadow-[0_2px_8px_rgba(0,0,0,0.05)] transition-all">Any</button>
<button class="flex-1 py-2 rounded-lg font-body-sm text-body-sm text-on-surface-variant hover:text-on-surface transition-all">Boys</button>
<button class="flex-1 py-2 rounded-lg font-body-sm text-body-sm text-on-surface-variant hover:text-on-surface transition-all">Girls</button>
</div>
</div>

<!-- Footer -->
<div class="sticky bottom-0 w-full p-container-padding-mobile bg-surface/90 backdrop-blur-[12px] shadow-[0_-4px_24px_rgba(0,0,0,0.04)] pb-safe">
<button onclick="saveRoommateRequirementsAndContinue()" class="w-full bg-primary text-on-primary py-4 rounded-[20px] font-title-md text-title-md shadow-[0_8px_24px_rgba(34,197,94,0.25)] hover:scale-[0.98] transition-transform active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">campaign</span>
      Post Requirement
    </button>
</div>

<script>
  // Budget Slider Logic
  const slider = document.getElementById('budget-slider');
  const fill = document.getElementById('budget-fill');
  const thumb = document.getElementById('budget-thumb');
  const display = document.getElementById('budget-display');

  slider.addEventListener('input', (e) => {
    const val = e.target.value;
    const min = e.target.min;
    const max = e.target.max;
    const percent = ((val - min) / (max - min)) * 100;
    
    fill.style.width = `${percent}%`;
    thumb.style.left = `${percent}%`;
    display.textContent = `₹${parseInt(val).toLocaleString('en-IN')}`;
    
    // Scale effect on thumb
    thumb.style.transform = `translate(-50%, 0) scale(1.1)`;
    setTimeout(() => {
      thumb.style.transform = `translate(-50%, 0) scale(1)`;
    }, 150);
  });

  // Chip Selection Logic
  const setupChips = (selector) => {
    document.querySelectorAll(selector).forEach(chip => {
      chip.addEventListener('click', () => {
        const isActive = chip.classList.contains('bg-primary');
        if (isActive) {
          chip.classList.remove('bg-primary', 'text-on-primary', 'shadow-[0_4px_12px_rgba(34,197,94,0.2)]');
          chip.classList.add('bg-surface-container', 'text-on-surface');
        } else {
          chip.classList.remove('bg-surface-container', 'text-on-surface');
          chip.classList.add('bg-primary', 'text-on-primary', 'shadow-[0_4px_12px_rgba(34,197,94,0.2)]');
          
          // Subtle pop animation
          chip.style.transform = 'scale(0.95)';
          setTimeout(() => chip.style.transform = 'scale(1)', 150);
        }
      });
    });
  };

  setupChips('.area-chip');
  setupChips('.lifestyle-chip');

  // Toggle Logic
  const toggleBtn = document.getElementById('flatmate-toggle');
  const toggleThumb = document.getElementById('flatmate-toggle-thumb');
  const optionsDiv = document.getElementById('flatmate-options');
  let isToggleOn = true;

  toggleBtn.addEventListener('click', () => {
    isToggleOn = !isToggleOn;
    if (isToggleOn) {
      toggleBtn.classList.remove('bg-surface-container-high');
      toggleBtn.classList.add('bg-primary');
      toggleThumb.style.transform = 'translateX(24px)';
      optionsDiv.style.opacity = '1';
      optionsDiv.style.pointerEvents = 'auto';
      optionsDiv.style.height = 'auto';
    } else {
      toggleBtn.classList.remove('bg-primary');
      toggleBtn.classList.add('bg-surface-container-high');
      toggleThumb.style.transform = 'translateX(0)';
      optionsDiv.style.opacity = '0.5';
      optionsDiv.style.pointerEvents = 'none';
    }
  });

  // Segmented Control Logic
  const genderBtns = document.querySelectorAll('#flatmate-options .flex > button');
  genderBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      genderBtns.forEach(b => {
        b.classList.remove('bg-surface', 'shadow-[0_2px_8px_rgba(0,0,0,0.05)]', 'text-on-surface');
        b.classList.add('text-on-surface-variant');
      });
      btn.classList.add('bg-surface', 'shadow-[0_2px_8px_rgba(0,0,0,0.05)]', 'text-on-surface');
      btn.classList.remove('text-on-surface-variant');
    });
  });

  function saveRoommateRequirementsAndContinue() {
      const budget = parseFloat(slider.value);
      
      const areas = [];
      document.querySelectorAll('.area-chip.bg-primary').forEach(chip => {
          areas.push(chip.textContent.trim());
      });
      
      const roomType = document.querySelector('select').value;
      const moveInDateEl = document.querySelector('input[type="date"]');
      const moveInDate = moveInDateEl ? moveInDateEl.value : null;
      const bio = document.querySelector('textarea').value.trim();
      
      const tags = [];
      document.querySelectorAll('.lifestyle-chip.bg-primary').forEach(chip => {
          // Keep only alphanumeric and standard characters
          const txt = chip.textContent.replace(/[^\w\s-]/g, '').replace(/\s+/g, ' ').trim();
          tags.push(txt);
      });
      
      if (areas.length === 0) {
          alert("Please select at least one preferred area.");
          return;
      }
      if (!bio) {
          alert("Please write something about yourself.");
          return;
      }
      
      const title = `Need ${roomType} in ${areas[0]}`;
      
      const roommateDraft = {
          title,
          budget,
          preferred_area: areas.join(', '),
          bio,
          tags,
          room_type: roomType,
          move_in_date: moveInDate || null
      };
      
      sessionStorage.setItem('roommate_draft', JSON.stringify(roommateDraft));
      window.location.href = '/roommates/roommate_preview.html';
  }

  // Load Smart Areas and handle custom inputs
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const profile = await getProfile();
      if (profile && profile.college) {
        const areas = await getCollegeAreas(profile.college);
        if (areas && areas.length > 0) {
          const container = document.getElementById('areas-container');
          container.innerHTML = ''; // clear default
          areas.forEach((area, index) => {
             const btn = document.createElement('button');
             btn.className = `area-chip px-4 py-2 rounded-full font-body-sm text-body-sm transition-all ${index === 0 ? 'bg-primary text-on-primary shadow-[0_4px_12px_rgba(34,197,94,0.2)]' : 'bg-surface-container text-on-surface'}`;
             btn.textContent = area;
             btn.addEventListener('click', () => {
                if (btn.classList.contains('bg-primary')) {
                    btn.classList.remove('bg-primary', 'text-on-primary', 'shadow-[0_4px_12px_rgba(34,197,94,0.2)]');
                    btn.classList.add('bg-surface-container', 'text-on-surface');
                } else {
                    btn.classList.remove('bg-surface-container', 'text-on-surface');
                    btn.classList.add('bg-primary', 'text-on-primary', 'shadow-[0_4px_12px_rgba(34,197,94,0.2)]');
                }
             });
             container.appendChild(btn);
          });
        }
      }
    } catch(e) { console.error("Error loading smart areas:", e); }

    // Custom area input handler
    const areaInput = document.getElementById('custom-area-input');
    if(areaInput) {
      areaInput.addEventListener('keypress', (e) => {
         if (e.key === 'Enter') {
             e.preventDefault();
             const val = areaInput.value.trim();
             if (val) {
                 const container = document.getElementById('areas-container');
                 const btn = document.createElement('button');
                 btn.className = 'area-chip px-4 py-2 rounded-full font-body-sm text-body-sm transition-all bg-primary text-on-primary shadow-[0_4px_12px_rgba(34,197,94,0.2)]';
                 btn.textContent = val;
                 btn.addEventListener('click', () => {
                    if (btn.classList.contains('bg-primary')) {
                        btn.classList.remove('bg-primary', 'text-on-primary', 'shadow-[0_4px_12px_rgba(34,197,94,0.2)]');
                        btn.classList.add('bg-surface-container', 'text-on-surface');
                    } else {
                        btn.classList.remove('bg-surface-container', 'text-on-surface');
                        btn.classList.add('bg-primary', 'text-on-primary', 'shadow-[0_4px_12px_rgba(34,197,94,0.2)]');
                    }
                 });
                 container.appendChild(btn);
                 areaInput.value = '';
             }
         }
      });
    }
  });
</script></main></body></html>
