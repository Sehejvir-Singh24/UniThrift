<nav class="fixed bottom-0 w-full z-50 pb-safe glass shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary-container"><div class="flex justify-around items-center h-16 px-4"><a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary-container transition-colors" data-path="dashboard" href="/index.html"><span class="material-symbols-outlined">dashboard</span><span class="font-label-caps text-label-caps">Home</span></a><a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary-container transition-colors" data-path="marketplace" href="/marketplace/marketplace.html"><span class="material-symbols-outlined">shopping_bag</span><span class="font-label-caps text-label-caps">Market</span></a><a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary-container transition-colors" data-path="flatmates" href="/roommates/flatmates.html"><span class="material-symbols-outlined">group</span><span class="font-label-caps text-label-caps">Mates</span></a><a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary-container transition-colors" data-path="hostel-hub" href="/pghostels/pghostels.html"><span class="material-symbols-outlined">apartment</span><span class="font-label-caps text-label-caps">PG/Hostel</span></a><a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary-container transition-colors" href="/core/activity.html"><span class="material-symbols-outlined">notifications</span><span class="font-label-caps text-label-caps">Activity</span></a></div></nav>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const isAuth = await checkAuth();
    if (!isAuth) {
      window.location.href = '/auth/login.html';
      return;
    }
    
    // Header setup
    const profile = await getProfile();
    if (profile) {
      document.getElementById('header-auth-area').innerHTML = `
        <a href="/core/profile.html" class="block w-8 h-8 rounded-full overflow-hidden ring-2 ring-primary-container/20 hover:scale-105 transition-transform cursor-pointer">
          <img alt="Profile" class="w-full h-full object-cover" src="${profile.avatar_url || 'https://lh3.googleusercontent.com/aida-public/AB6AXuDP-dstOC5bgHNI3kEMkDDK4pN1_X0ipnzd1h5RGxwu7hftKs8Kh5iHhMrKREQrYRocawgw4ncImHVSVM9nNl55CV_SKMEvsWI_9y6iW078Y7gw8libWMPW2_i5tRLJEGolQG5FA04ciktp2pKFsrktqmnmwPDWXKxRxDiT2yLONHYwcfhstR74y7ZDaCN6qn2jddOMv5koe_xRFxvwKO1HISMW-uIgzD-ohsoRNtsY2H-23fOyKF3BK2RG3S6zd5O3EOcj6luIuoEA'}"/>
        </a>`;
    }

    loadMatches();
  });

  async function loadMatches() {
    const container = document.getElementById('matches-container');
    try {
      const matches = await getMyRoommateMatches();
      if (!matches || matches.length === 0) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-16 text-center gap-4">
            <div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
              <span class="material-symbols-outlined text-[32px]">heart_broken</span>
            </div>
            <h3 class="font-title-md text-on-surface">No Matches Yet</h3>
            <p class="font-body-sm text-on-surface-variant">Keep swiping to find your perfect roommate.</p>
            <a href="/roommates/flatmates.html" class="mt-4 px-6 py-2 bg-primary text-on-primary rounded-full font-title-md text-sm shadow-md">Go Swipe</a>
          </div>`;
        return;
      }

      container.innerHTML = matches.map(match => {
        const p = match.profiles || {};
        const name = p.full_name || 'Anonymous';
        const avatar = p.avatar_url || 'https://lh3.googleusercontent.com/aida-public/AB6AXuCO80v9oBxazBMg4_hybg4dNFOJpVb62CeRrKE7f7GVkyegLDnliILUgYKKo__P7-6eK3S8JJ7hgvjouOiLV-Za-vEsbGYEsKt_BZE7WyZKaDsGZH_MiiA_qFAxjXEGoLEiLK2DJYKTT77SRV0N3zMuN4gbbO7LrAKxcBYXBHcA_3-wi7ghZeza4NFVOW_mXl3tJfLB5T8Yml1sK1Ek-JcYEEYSPDXs8bFE28rnxRw_dq70HNOQL3QFhOyR0jwdIxG1cNgHC5WqmFLz';
        const phone = p.phone_number || '';
        
        return `
          <div class="bg-surface-container-lowest border border-surface-variant rounded-xl p-4 shadow-sm flex flex-col gap-3">
            <div class="flex items-center gap-4">
              <img src="${avatar}" class="w-16 h-16 rounded-full object-cover" />
              <div class="flex flex-col">
                <h3 class="font-title-md text-on-surface">${name}</h3>
                <p class="font-body-sm text-on-surface-variant flex items-center gap-1">
                    <span class="material-symbols-outlined text-[16px]">school</span>
                    ${p.year_of_study || ''} • ${p.college || ''}
                </p>
              </div>
            </div>
            ${phone ? `
              <a href="https://wa.me/91${phone}" target="_blank" class="w-full mt-2 py-3 bg-[#25D366] text-white rounded-lg flex items-center justify-center gap-2 font-title-md text-sm shadow-sm hover:scale-[1.02] active:scale-95 transition-all">
                <span class="material-symbols-outlined text-[20px]">forum</span> Chat on WhatsApp
              </a>
            ` : `
              <div class="w-full mt-2 py-3 bg-surface-container text-on-surface-variant rounded-lg flex items-center justify-center font-body-sm text-sm">
                No phone number provided
              </div>
            `}
          </div>
        `;
      }).join('');
    } catch (e) {
      container.innerHTML = `<div class="text-error text-center p-4">Error loading matches: ${e.message}</div>`;
    }
  }
</script>
