<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const profile = await getProfile();
    if (!profile) return;
    const products = await getSellingHistory(profile.id);
    const grid = document.getElementById('marketplace-grid');
    const placeholder = document.getElementById('marketplace-placeholder');

    if (products.length === 0) {
      placeholder.innerHTML = `
        <div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
          <span class="material-symbols-outlined text-[32px]">storefront</span>
        </div>
        <p class="font-body-sm text-body-sm text-on-surface-variant">You haven't sold any items yet.</p>
      `;
    } else {
      placeholder.remove();
      products.forEach(p => {
        grid.insertAdjacentHTML('beforeend', renderProductCard(p));
      });
    }
  });
</script>
