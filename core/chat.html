<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chat - UniThrift</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-primary": "#ffffff", "on-surface-variant": "#3d4a3d", "surface-bright": "#f8f9ff", "on-primary-fixed": "#002109", "surface-dim": "#cbdbf5", "primary-fixed-dim": "#4ae176", "inverse-on-surface": "#eaf1ff", "outline": "#6d7b6c", "surface": "#f8f9ff", "on-secondary-fixed-variant": "#3f465c", "surface-container-low": "#eff4ff", "secondary-fixed-dim": "#bec6e0", "on-secondary-container": "#5c647a", "tertiary-fixed-dim": "#bdcac1", "secondary-fixed": "#dae2fd", "error": "#ba1a1a", "tertiary-container": "#a2afa7", "inverse-on-surface": "#eaf1ff", "outline-variant": "#bccbb9", "on-tertiary-fixed": "#131e19", "secondary-container": "#dae2fd", "on-tertiary-fixed-variant": "#3e4943", "surface-container-lowest": "#ffffff", "on-error": "#ffffff", "on-tertiary": "#ffffff", "tertiary-fixed": "#d9e6dd", "surface-tint": "#006e2f", "tertiary": "#55615a", "surface-container-highest": "#d3e4fe", "on-secondary": "#ffffff", "primary-container": "#22c55e", "background": "#f8f9ff", "primary-fixed": "#6bff8f", "primary": "#006e2f", "on-primary-fixed-variant": "#005321", "on-secondary-fixed": "#131b2e", "surface-container": "#e5eeff", "error-container": "#ffdad6", "surface-container-high": "#dce9ff", "on-tertiary-container": "#37433c", "surface-variant": "#d3e4fe", "on-error-container": "#93000a", "on-primary-container": "#004b1e", "secondary": "#565e74", "inverse-primary": "#4ae176", "on-background": "#0b1c30", "on-surface": "#0b1c30" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "stack-sm": "8px", "stack-md": "16px", "stack-lg": "32px", "unit": "4px", "container-padding-mobile": "20px", "container-padding-desktop": "48px", "gutter": "16px" }, "fontFamily": { "body-lg": ["Geist"], "headline-lg-mobile": ["Geist"], "title-md": ["Geist"], "headline-lg": ["Geist"], "label-caps": ["Geist"], "body-sm": ["Geist"], "display-lg": ["Geist"] }, "fontSize": { "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.04em", "fontWeight": "700" }] } } }
  </script>
  <style>
    @layer base {
      body { -webkit-tap-highlight-color: transparent; }
      .pt-safe { padding-top: env(safe-area-inset-top); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    }
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/scripts/supabase.js"></script>
  <script>
    requireAuth();
  </script>
</head>
<body class="bg-background font-body-lg text-on-background h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="fixed top-0 w-full z-50 glass pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
    <div class="h-16 px-4 flex items-center justify-between">
      <div class="flex items-center gap-2 flex-1">
        <button class="w-10 h-10 flex items-center justify-center -ml-2 text-on-surface" onclick="history.back()">
          <span class="material-symbols-outlined">arrow_back_ios_new</span>
        </button>
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-surface-container overflow-hidden shrink-0">
            <img id="chat-avatar" src="" class="w-full h-full object-cover hidden">
            <div id="chat-avatar-placeholder" class="w-full h-full flex items-center justify-center text-on-surface-variant"><span class="material-symbols-outlined">person</span></div>
          </div>
          <div class="flex flex-col">
            <h1 id="chat-name" class="font-title-md text-[16px] text-on-surface line-clamp-1">Loading...</h1>
            <p id="chat-item-title" class="font-body-sm text-[12px] text-on-surface-variant line-clamp-1">...</p>
          </div>
        </div>
      </div>
      <button onclick="togglePlanner()" class="md:hidden w-10 h-10 flex items-center justify-center rounded-full bg-surface-container text-on-surface ml-2">
        <span class="material-symbols-outlined">calendar_month</span>
      </button>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="flex-1 flex pt-[calc(env(safe-area-inset-top)+64px)] h-full">
    
    <!-- Chat Area -->
    <main class="flex-1 flex flex-col relative h-full bg-surface-container-lowest">
      <!-- Messages List -->
      <div id="messages-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 pb-20">
        <!-- Messages will be injected here -->
        <div class="flex justify-center my-4">
          <div class="bg-surface-container px-3 py-1 rounded-full text-[12px] font-label-caps text-on-surface-variant">Loading messages...</div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="absolute bottom-0 left-0 right-0 glass pb-safe border-t border-outline-variant/30">
        <div class="flex items-center p-3 gap-2 max-w-5xl mx-auto">
          <button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container transition-colors shrink-0">
            <span class="material-symbols-outlined">add_photo_alternate</span>
          </button>
          <input type="text" id="message-input" class="flex-1 bg-surface-container/50 border border-outline-variant/50 rounded-full px-4 py-2.5 outline-none font-body-lg text-on-background placeholder:text-on-surface-variant focus:bg-surface-container-lowest transition-colors" placeholder="Type a message...">
          <button id="send-btn" onclick="handleSendMessage()" class="w-10 h-10 flex items-center justify-center rounded-full bg-primary text-on-primary shadow-sm hover:scale-105 transition-transform shrink-0">
            <span class="material-symbols-outlined text-[20px]" style="margin-left:2px">send</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Sidebar / Meetup Planner -->
    <aside id="planner-sidebar" class="w-full md:w-80 lg:w-96 bg-background border-l border-outline-variant/30 flex flex-col absolute inset-0 z-40 transform translate-x-full md:translate-x-0 md:relative transition-transform duration-300">
      
      <!-- Planner Mobile Header -->
      <div class="md:hidden h-16 border-b border-outline-variant/30 flex items-center px-4 pt-safe glass sticky top-0 z-10">
        <button onclick="togglePlanner()" class="w-10 h-10 flex items-center justify-center -ml-2 text-on-surface">
          <span class="material-symbols-outlined">close</span>
        </button>
        <h2 class="font-title-md text-[18px] text-on-surface flex-1">Meetup Planner</h2>
      </div>

      <div class="flex-1 overflow-y-auto p-5 pb-safe flex flex-col gap-6">
        
        <!-- Transaction Summary -->
        <div class="bg-surface-container-lowest border border-outline-variant/30 rounded-2xl p-5 shadow-sm">
          <h3 class="font-label-caps text-label-caps text-on-surface-variant mb-4">Transaction Summary</h3>
          <div class="flex items-center gap-3 mb-4">
            <div class="w-12 h-12 rounded-lg bg-surface-container overflow-hidden shrink-0">
              <img id="planner-img" src="" class="w-full h-full object-cover hidden">
            </div>
            <div class="flex flex-col">
              <span id="planner-title" class="font-title-md text-[14px] text-on-background line-clamp-2">--</span>
              <span id="planner-price" class="font-title-md text-[14px] text-primary mt-0.5">₹--</span>
            </div>
          </div>
          <div class="h-px w-full bg-outline-variant/30 mb-3"></div>
          <div class="flex justify-between items-center mb-1">
            <span class="font-body-sm text-body-sm text-on-surface-variant">Deposit Paid</span>
            <span id="planner-deposit" class="font-body-sm text-body-sm text-on-background font-medium">₹--</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="font-body-lg text-[14px] text-on-surface-variant">Remaining at Meetup</span>
            <span id="planner-remaining" class="font-title-md text-[18px] text-primary">₹--</span>
          </div>
        </div>

        <!-- Meetup Status Module -->
        <div class="bg-surface-container-lowest border border-outline-variant/30 rounded-2xl p-5 shadow-sm flex flex-col">
          <div class="flex items-center gap-2 mb-4">
            <span class="material-symbols-outlined text-primary">pin_drop</span>
            <h3 class="font-title-md text-[16px] text-on-background">Meetup Details</h3>
          </div>
          
          <div id="meetup-state-container" class="flex flex-col gap-4">
            <!-- Dynamic State Injected Here -->
            <div class="animate-pulse bg-surface-container h-32 rounded-xl"></div>
          </div>
        </div>

        <!-- Review Module (Hidden until complete) -->
        <div id="review-container" class="hidden bg-surface-container-lowest border border-outline-variant/30 rounded-2xl p-5 shadow-sm flex-col gap-3">
          <div class="flex items-center gap-2 mb-2">
            <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">star</span>
            <h3 class="font-title-md text-[16px] text-on-background">Rate Experience</h3>
          </div>
          <p class="font-body-sm text-[12px] text-on-surface-variant">The transaction is complete. How was your experience?</p>
          <button onclick="openReviewModal()" class="w-full bg-surface-container text-on-surface-variant font-title-md text-[14px] py-3 rounded-xl hover:bg-surface-variant transition-colors mt-2">
            Leave a Review
          </button>
        </div>

      </div>
    </aside>

  </div>

  <!-- Review Modal Overlay -->
  <div class="fixed inset-0 z-50 hidden flex-col justify-end md:justify-center items-center" id="review-modal">
    <div class="absolute inset-0 bg-on-background/30 backdrop-blur-sm transition-opacity" onclick="document.getElementById('review-modal').classList.add('hidden')"></div>
    <div class="relative w-full md:max-w-sm md:rounded-[32px] bg-surface rounded-t-[32px] px-6 pt-2 pb-safe shadow-[0_-8px_40px_rgba(0,0,0,0.12)]">
      <div class="w-12 h-1.5 bg-surface-variant rounded-full mx-auto my-4 md:hidden"></div>
      <div class="flex justify-between items-center mb-6 mt-4 md:mt-6">
        <h3 class="font-title-md text-[20px] text-on-background">Submit Review</h3>
        <button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container text-on-surface" onclick="document.getElementById('review-modal').classList.add('hidden')">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="flex flex-col gap-4">
        <div class="flex justify-center gap-2 mb-2" id="star-rating">
          <span class="material-symbols-outlined text-[32px] text-surface-variant cursor-pointer hover:scale-110 transition-transform" data-rating="1">star</span>
          <span class="material-symbols-outlined text-[32px] text-surface-variant cursor-pointer hover:scale-110 transition-transform" data-rating="2">star</span>
          <span class="material-symbols-outlined text-[32px] text-surface-variant cursor-pointer hover:scale-110 transition-transform" data-rating="3">star</span>
          <span class="material-symbols-outlined text-[32px] text-surface-variant cursor-pointer hover:scale-110 transition-transform" data-rating="4">star</span>
          <span class="material-symbols-outlined text-[32px] text-surface-variant cursor-pointer hover:scale-110 transition-transform" data-rating="5">star</span>
        </div>
        <textarea id="review-comment" class="w-full bg-surface-container rounded-xl p-4 font-body-sm text-on-background outline-none resize-none placeholder:text-on-surface-variant/50" placeholder="Great communication, punctual." rows="3"></textarea>
        <button id="submit-review-btn" onclick="handleReviewSubmit()" class="w-full bg-primary text-on-primary py-3.5 rounded-xl font-title-md text-[16px] transition-transform active:scale-[0.98] mb-6 mt-2">
          Submit
        </button>
      </div>
    </div>
  </div>

  <script>
    let currentReservation = null;
    let currentUserRole = null; // 'buyer' or 'seller'
    let currentUserId = null;
    let selectedRating = 0;
    let chatInterval = null;

    function togglePlanner() {
      const planner = document.getElementById('planner-sidebar');
      if (planner.classList.contains('translate-x-full')) {
        planner.classList.remove('translate-x-full');
      } else {
        planner.classList.add('translate-x-full');
      }
    }

    // Handle Star Selection
    document.querySelectorAll('#star-rating span').forEach(star => {
      star.addEventListener('click', (e) => {
        selectedRating = parseInt(e.target.dataset.rating);
        document.querySelectorAll('#star-rating span').forEach((s, i) => {
          if (i < selectedRating) {
            s.style.fontVariationSettings = "'FILL' 1";
            s.classList.replace('text-surface-variant', 'text-[#FFB400]'); // Gold star
          } else {
            s.style.fontVariationSettings = "'FILL' 0";
            s.classList.replace('text-[#FFB400]', 'text-surface-variant');
          }
        });
      });
    });

    function openReviewModal() {
      document.getElementById('review-modal').classList.remove('hidden');
    }

    async function handleReviewSubmit() {
      if (selectedRating === 0) {
        alert("Please select a rating.");
        return;
      }
      const comment = document.getElementById('review-comment').value;
      const revieweeId = currentUserRole === 'buyer' ? currentReservation.seller_id : currentReservation.buyer_id;
      
      const btn = document.getElementById('submit-review-btn');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      try {
        await submitReview(currentReservation.id, revieweeId, selectedRating, comment);
        alert("Review submitted!");
        document.getElementById('review-modal').classList.add('hidden');
        document.getElementById('review-container').innerHTML = `
          <div class="flex items-center gap-2 text-primary">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            <span class="font-title-md text-[14px]">Review Submitted</span>
          </div>
        `;
      } catch(e) {
        alert("Failed to submit review: " + e.message);
        btn.disabled = false;
        btn.textContent = 'Submit';
      }
    }

    async function handleSendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentReservation) return;

      input.value = '';
      try {
        await sendMessage(currentReservation.id, text);
        loadMessages(); // reload immediately
      } catch(e) {
        console.error(e);
        alert("Failed to send message");
      }
    }

    // Send on Enter
    document.getElementById('message-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSendMessage();
    });

    async function handleProposeMeetup() {
      const location = document.getElementById('meetup-location').value;
      const time = document.getElementById('meetup-time').value;
      if (!location || !time) {
        alert("Please select location and time.");
        return;
      }
      
      const btn = document.getElementById('propose-btn');
      btn.disabled = true;
      
      try {
        // Format time properly to ISO for postgres
        // Using local time assumption for simplicity in demo
        const isoTime = new Date(time).toISOString();
        await proposeMeetup(currentReservation.id, location, isoTime);
        loadMeetupState();
      } catch(e) {
        alert("Failed to propose meetup");
        btn.disabled = false;
      }
    }

    async function handleConfirmMeetup() {
      try {
        await confirmMeetup(currentReservation.id);
        loadMeetupState();
      } catch(e) {
        alert("Failed to confirm meetup");
      }
    }

    async function handleCompleteTransaction() {
      if (!confirm("Are you sure you have completed the meetup and the remaining balance was settled?")) return;
      try {
        await confirmTransaction(currentReservation.id, currentUserRole);
        // Refresh reservation state
        await init();
      } catch(e) {
        alert("Failed to complete transaction");
      }
    }

    function renderMessages(messages) {
      const container = document.getElementById('messages-container');
      const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;
      
      container.innerHTML = '';
      if (messages.length === 0) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center my-auto opacity-50">
            <span class="material-symbols-outlined text-[48px] mb-2">forum</span>
            <span class="font-body-sm">No messages yet. Say hi!</span>
          </div>
        `;
        return;
      }

      messages.forEach(m => {
        const isMine = m.sender_id === currentUserId;
        const timeStr = new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        const div = document.createElement('div');
        div.className = `flex flex-col max-w-[75%] ${isMine ? 'self-end items-end' : 'self-start items-start'} mb-1`;
        
        div.innerHTML = `
          <div class="px-4 py-2.5 rounded-2xl ${isMine ? 'bg-primary text-on-primary rounded-tr-sm' : 'bg-surface-container text-on-surface rounded-tl-sm'} font-body-lg text-[14px]">
            ${m.text}
          </div>
          <span class="font-body-sm text-[10px] text-on-surface-variant/70 mt-1 mx-1">${timeStr}</span>
        `;
        container.appendChild(div);
      });

      if (isAtBottom) {
        container.scrollTop = container.scrollHeight;
      }
    }

    async function loadMessages() {
      if (!currentReservation) return;
      const msgs = await getChatMessages(currentReservation.id);
      renderMessages(msgs);
    }

    async function loadMeetupState() {
      const container = document.getElementById('meetup-state-container');
      const meetup = await getMeetupForReservation(currentReservation.id);
      
      if (currentReservation.status === 'Completed') {
        container.innerHTML = `
          <div class="bg-primary/10 rounded-xl p-4 flex flex-col items-center text-center">
            <span class="material-symbols-outlined text-primary text-[32px] mb-2" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            <span class="font-title-md text-[16px] text-primary">Transaction Completed</span>
            <span class="font-body-sm text-[12px] text-on-surface-variant mt-1">Both parties confirmed the meetup.</span>
          </div>
        `;
        document.getElementById('review-container').classList.remove('hidden');
        document.getElementById('review-container').classList.add('flex');
        return;
      }

      if (!meetup) {
        // No meetup proposed yet
        container.innerHTML = `
          <div class="flex flex-col gap-3">
            <div>
              <label class="font-label-caps text-[10px] text-on-surface-variant mb-1 ml-1 block">Campus Location</label>
              <select id="meetup-location" class="w-full bg-surface-container rounded-xl p-3 outline-none font-body-sm text-on-background">
                <option value="Main Library">Main Library</option>
                <option value="Student Cafeteria">Student Cafeteria</option>
                <option value="Main Gate">Main Gate</option>
                <option value="Hostel Block A">Hostel Block A</option>
                <option value="Sports Complex">Sports Complex</option>
              </select>
            </div>
            <div>
              <label class="font-label-caps text-[10px] text-on-surface-variant mb-1 ml-1 block">Date & Time</label>
              <input type="datetime-local" id="meetup-time" class="w-full bg-surface-container rounded-xl p-3 outline-none font-body-sm text-on-background">
            </div>
            <button id="propose-btn" onclick="handleProposeMeetup()" class="w-full bg-surface-container text-on-surface-variant font-title-md text-[14px] py-3 rounded-xl hover:bg-surface-variant transition-colors mt-1">
              Propose Meetup
            </button>
          </div>
        `;
        return;
      }

      // Meetup exists
      const timeStr = new Date(meetup.meet_time).toLocaleString([], {weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'});
      const isMyProposal = meetup.proposed_by === currentUserId;

      if (meetup.status === 'Proposed') {
        if (isMyProposal) {
          container.innerHTML = `
            <div class="bg-surface-container rounded-xl p-4 flex flex-col gap-2">
              <span class="font-label-caps text-[10px] text-on-surface-variant">Proposed Meetup</span>
              <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[16px] text-secondary">location_on</span>
                <span class="font-body-sm text-on-background font-medium">${meetup.location}</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[16px] text-secondary">schedule</span>
                <span class="font-body-sm text-on-background font-medium">${timeStr}</span>
              </div>
            </div>
            <div class="flex items-center gap-2 mt-2 text-secondary justify-center">
              <span class="material-symbols-outlined text-[16px] animate-spin">progress_activity</span>
              <span class="font-body-sm text-[12px]">Waiting for confirmation...</span>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="bg-surface-container rounded-xl p-4 flex flex-col gap-2 border border-primary/30">
              <span class="font-label-caps text-[10px] text-primary">Partner Proposed</span>
              <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[16px] text-secondary">location_on</span>
                <span class="font-body-sm text-on-background font-medium">${meetup.location}</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[16px] text-secondary">schedule</span>
                <span class="font-body-sm text-on-background font-medium">${timeStr}</span>
              </div>
            </div>
            <button onclick="handleConfirmMeetup()" class="w-full bg-primary text-on-primary font-title-md text-[14px] py-3 rounded-xl hover:opacity-90 transition-opacity mt-2 shadow-sm">
              Accept Meetup
            </button>
          `;
        }
      } else if (meetup.status === 'Confirmed') {
        const myConfirmed = currentUserRole === 'buyer' ? currentReservation.buyer_confirmed : currentReservation.seller_confirmed;
        const otherConfirmed = currentUserRole === 'buyer' ? currentReservation.seller_confirmed : currentReservation.buyer_confirmed;

        let completionUI = '';
        if (myConfirmed) {
          completionUI = `
            <div class="bg-surface-variant text-on-surface-variant rounded-xl p-3 flex items-center justify-center gap-2 mt-2">
              <span class="material-symbols-outlined text-[18px]">how_to_reg</span>
              <span class="font-body-sm text-[12px]">Waiting for partner to confirm completion...</span>
            </div>
          `;
        } else {
          completionUI = `
            <button onclick="handleCompleteTransaction()" class="w-full bg-primary text-on-primary font-title-md text-[14px] py-3 rounded-xl hover:opacity-90 transition-opacity mt-2 shadow-sm flex items-center justify-center gap-2">
              <span class="material-symbols-outlined text-[18px]">done_all</span>
              <span>Mark Completed</span>
            </button>
            <p class="font-body-sm text-[10px] text-on-surface-variant text-center mt-2 px-4">Only mark completed after the remaining ₹${currentReservation.remaining_amount} has been paid in person.</p>
          `;
        }

        container.innerHTML = `
          <div class="bg-primary/5 border border-primary/20 rounded-xl p-4 flex flex-col gap-2">
            <div class="flex items-center justify-between">
              <span class="font-label-caps text-[10px] text-primary">Confirmed Meetup</span>
              <span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            </div>
            <div class="flex items-center gap-2 mt-1">
              <span class="material-symbols-outlined text-[16px] text-on-background">location_on</span>
              <span class="font-body-sm text-on-background font-semibold">${meetup.location}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-[16px] text-on-background">schedule</span>
              <span class="font-body-sm text-on-background font-semibold">${timeStr}</span>
            </div>
          </div>
          ${completionUI}
        `;
      }
    }

    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      if (!id) {
        alert("Reservation ID missing");
        window.location.href = '/core/dashboard.html';
        return;
      }

      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;
      currentUserId = session.user.id;

      currentReservation = await getReservationById(id);
      if (!currentReservation) {
        alert("Reservation not found");
        window.location.href = '/core/dashboard.html';
        return;
      }

      if (currentUserId === currentReservation.buyer_id) {
        currentUserRole = 'buyer';
      } else if (currentUserId === currentReservation.seller_id) {
        currentUserRole = 'seller';
      } else {
        alert("Unauthorized access");
        window.location.href = '/core/dashboard.html';
        return;
      }

      // Populate Header
      const otherUser = currentUserRole === 'buyer' ? currentReservation.seller : currentReservation.buyer;
      document.getElementById('chat-name').textContent = otherUser.full_name;
      document.getElementById('chat-item-title').textContent = currentReservation.products.title;
      if (otherUser.avatar_url) {
        document.getElementById('chat-avatar').src = otherUser.avatar_url;
        document.getElementById('chat-avatar').classList.remove('hidden');
        document.getElementById('chat-avatar-placeholder').classList.add('hidden');
      }

      // Populate Planner Summary
      document.getElementById('planner-title').textContent = currentReservation.products.title;
      document.getElementById('planner-price').textContent = `₹${currentReservation.products.price}`;
      document.getElementById('planner-deposit').textContent = `₹${currentReservation.deposit_amount}`;
      document.getElementById('planner-remaining').textContent = `₹${currentReservation.remaining_amount}`;
      if (currentReservation.products.image_url) {
        document.getElementById('planner-img').src = currentReservation.products.image_url;
        document.getElementById('planner-img').classList.remove('hidden');
      }

      // Disable inputs if completed
      if (currentReservation.status === 'Completed') {
        const input = document.getElementById('message-input');
        input.disabled = true;
        input.placeholder = "Transaction completed. Chat closed.";
        document.getElementById('send-btn').disabled = true;
        document.getElementById('send-btn').classList.replace('bg-primary', 'bg-surface-variant');
      }

      await loadMeetupState();
      await loadMessages();

      if (chatInterval) clearInterval(chatInterval);
      if (currentReservation.status !== 'Completed') {
        chatInterval = setInterval(loadMessages, 3000);
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
