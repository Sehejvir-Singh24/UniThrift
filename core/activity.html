<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Activity & Chats - UniThrift</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css" rel="stylesheet" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#006e2f",
            "on-primary": "#ffffff",
            "primary-container": "#22c55e",
            "on-primary-container": "#004b1e",
            "surface": "#f8f9ff",
            "on-surface": "#0b1c30",
            "surface-variant": "#d3e4fe",
            "on-surface-variant": "#3d4a3d",
            "background": "#f8f9ff",
            "on-background": "#0b1c30",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#eff4ff",
            "surface-container": "#e5eeff",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a",
            "secondary-container": "#dae2fd",
            "on-secondary-container": "#5c647a"
          },
          fontFamily: {
            "body-sm": ["Geist", "sans-serif"],
            "body-lg": ["Geist", "sans-serif"],
            "title-md": ["Geist", "sans-serif"],
            "label-caps": ["Geist", "sans-serif"],
            "headline-lg-mobile": ["Geist", "sans-serif"]
          },
          spacing: {
            "stack-sm": "8px",
            "stack-md": "16px",
            "container-padding-mobile": "20px"
          }
        }
      }
    }
  </script>
  <style>
    @layer base {
      body { -webkit-tap-highlight-color: transparent; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      .pt-safe { padding-top: env(safe-area-inset-top); }
    }
    .glass {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/scripts/supabase.js"></script>
  <script>requireAuth();</script>
</head>
<body class="bg-background font-body-lg text-on-background">
  <header class="fixed top-0 w-full z-50 glass pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
    <div class="h-16 px-container-padding-mobile md:px-6 md:max-w-5xl md:mx-auto flex items-center justify-between">
      <div class="flex items-center gap-stack-sm">
        <span class="font-title-md text-title-md text-on-surface">Activity Hub</span>
      </div>
      <a href="/core/profile.html" class="block w-8 h-8 rounded-full overflow-hidden ring-2 ring-primary-container/20 hover:scale-105 transition-transform cursor-pointer">
        <img id="header-avatar" alt="Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDP-dstOC5bgHNI3kEMkDDK4pN1_X0ipnzd1h5RGxwu7hftKs8Kh5iHhMrKREQrYRocawgw4ncImHVSVM9nNl55CV_SKMEvsWI_9y6iW078Y7gw8libWMPW2_i5tRLJEGolQG5FA04ciktp2pKFsrktqmnmwPDWXKxRxDiT2yLONHYwcfhstR74y7ZDaCN6qn2jddOMv5koe_xRFxvwKO1HISMW-uIgzD-ohsoRNtsY2H-23fOyKF3BK2RG3S6zd5O3EOcj6luIuoEA"/>
      </a>
    </div>
  </header>

  <main class="pt-20 pb-[120px] md:pb-8 bg-background min-h-screen">
    <div class="flex flex-col w-full px-container-padding-mobile md:px-6 md:max-w-5xl md:mx-auto gap-stack-md">
      
      <!-- Tab Toggle -->
      <div class="flex bg-surface-container-low p-1 rounded-2xl w-full max-w-md mx-auto relative shadow-[0_2px_8px_rgba(0,0,0,0.02)]">
        <div id="tab-pill" class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-surface-container-lowest rounded-[12px] shadow-sm transition-transform duration-300"></div>
        <button onclick="switchTab(0)" id="tab-all-btn" class="flex-1 text-center py-2.5 z-10 font-body-sm text-body-sm font-semibold transition-colors text-on-surface text-primary" type="button">
          All Activity
        </button>
        <button onclick="switchTab(1)" id="tab-alerts-btn" class="flex-1 text-center py-2.5 z-10 font-body-sm text-body-sm font-semibold transition-colors text-on-surface/60" type="button">
          Active Chats
        </button>
      </div>

      <!-- Activity Feed -->
      <div class="flex flex-col gap-4 mt-2" id="activity-feed">
        <!-- Loading State -->
        <div class="flex flex-col items-center justify-center py-12 text-center gap-3">
          <div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant animate-pulse"></div>
          <p class="font-body-sm text-body-sm text-on-surface-variant">Loading your activity...</p>
        </div>
      </div>

    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 w-full z-50 pb-safe glass shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary-container">
    <div class="flex justify-around items-center h-16 px-2 md:px-4">
      <a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary-container transition-colors" href="/index.html">
        <span class="material-symbols-outlined text-[24px]">dashboard</span>
        <span class="font-label-caps text-[10px] md:text-label-caps">Home</span>
      </a>
      <a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary-container transition-colors" href="/marketplace/marketplace.html">
        <span class="material-symbols-outlined text-[24px]">shopping_bag</span>
        <span class="font-label-caps text-[10px] md:text-label-caps">Market</span>
      </a>
      <a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary-container transition-colors" href="/roommates/flatmates.html">
        <span class="material-symbols-outlined text-[24px]">group</span>
        <span class="font-label-caps text-[10px] md:text-label-caps">Mates</span>
      </a>
      <a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary-container transition-colors" href="/pghostels/pghostels.html">
        <span class="material-symbols-outlined text-[24px]">apartment</span>
        <span class="font-label-caps text-[10px] md:text-label-caps">PG/Hostel</span>
      </a>
      <a aria-current="page" class="flex flex-col items-center gap-1 transition-colors text-primary-container" href="/core/activity.html">
        <span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
        <span class="font-label-caps text-[10px] md:text-label-caps">Activity</span>
      </a>
    </div>
  </nav>

  <script>
    let activeTab = 0; // 0 = All, 1 = Active Chats
    let allActivity = [];

    document.addEventListener('DOMContentLoaded', async () => {
      // Header avatar
      const profile = await getProfile();
      if (profile && profile.avatar_url) {
        document.getElementById('header-avatar').src = profile.avatar_url;
      }
      
      await loadActivityFeed();
    });

    async function loadActivityFeed() {
      // 1. Fetch Offers
      const receivedOffers = await getReceivedOffers() || [];
      const sentOffers = await getSentOffers() || [];
      
      // 2. Fetch Reservations
      const buyerReservations = await getReservationsAsBuyer() || [];
      const sellerReservations = await getReservationsAsSeller() || [];

      // Combine into unified feed objects
      allActivity = [];

      // Map Offers
      receivedOffers.forEach(offer => {
        allActivity.push({
          type: 'offer_received',
          data: offer,
          date: new Date(offer.created_at),
          title: 'New Offer Received',
          description: `${offer.profiles?.full_name || 'Someone'} offered ₹${offer.offer_amount} for ${offer.products?.title}`,
          icon: 'local_offer',
          url: `/marketplace/offer_received.html?id=${offer.id}`,
          isActionable: offer.status === 'Pending'
        });
      });

      sentOffers.forEach(offer => {
        allActivity.push({
          type: 'offer_sent',
          data: offer,
          date: new Date(offer.created_at), 
          title: \`Offer \${offer.status}\`,
          description: \`Your offer of ₹\${offer.offer_amount} for \${offer.products?.title} is \${offer.status}\`,
          icon: offer.status === 'Accepted' ? 'check_circle' : (offer.status === 'Rejected' ? 'cancel' : 'schedule'),
          url: offer.status === 'Countered' ? \`/marketplace/counter_offer.html?id=\${offer.id}\` : \`/marketplace/item.html?id=\${offer.product_id}\`,
          isActionable: offer.status === 'Countered'
        });
      });

      // Map Reservations
      buyerReservations.forEach(res => {
        allActivity.push({
          type: 'reservation_buyer',
          data: res,
          date: new Date(res.created_at),
          title: 'Deposit Paid & Reserved',
          description: \`You paid ₹\${res.deposit_amount} deposit for \${res.products?.title}. Let's chat!\`,
          icon: 'handshake',
          url: \`/core/chat.html?id=\${res.id}\`,
          isActionable: res.status !== 'Completed' && res.status !== 'Cancelled'
        });
      });

      sellerReservations.forEach(res => {
        allActivity.push({
          type: 'reservation_seller',
          data: res,
          date: new Date(res.created_at),
          title: 'Item Reserved!',
          description: \`A buyer paid a ₹\${res.deposit_amount} deposit for \${res.products?.title}.\`,
          icon: 'chat_bubble',
          url: \`/core/chat.html?id=\${res.id}\`,
          isActionable: res.status !== 'Completed' && res.status !== 'Cancelled'
        });
      });

      // Sort chronological descending
      allActivity.sort((a, b) => b.date - a.date);
      
      renderFeed();
    }

    function switchTab(index) {
      activeTab = index;
      const pill = document.getElementById('tab-pill');
      const allBtn = document.getElementById('tab-all-btn');
      const chatsBtn = document.getElementById('tab-alerts-btn');

      if (index === 0) {
        pill.style.transform = 'translateX(0)';
        allBtn.classList.add('text-primary');
        allBtn.classList.remove('text-on-surface/60');
        chatsBtn.classList.remove('text-primary');
        chatsBtn.classList.add('text-on-surface/60');
      } else {
        pill.style.transform = 'translateX(100%)';
        chatsBtn.classList.add('text-primary');
        chatsBtn.classList.remove('text-on-surface/60');
        allBtn.classList.remove('text-primary');
        allBtn.classList.add('text-on-surface/60');
      }

      renderFeed();
    }

    function renderFeed() {
      const container = document.getElementById('activity-feed');
      
      // Filter logic
      let displayActivity = allActivity;
      if (activeTab === 1) { // Chats only
        displayActivity = allActivity.filter(a => a.type.startsWith('reservation_') && a.isActionable);
      }

      if (displayActivity.length === 0) {
        container.innerHTML = \`
          <div class="flex flex-col items-center justify-center py-16 text-center gap-3">
            <div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
              <span class="material-symbols-outlined text-[32px]">\${activeTab === 1 ? 'chat_bubble' : 'notifications'}</span>
            </div>
            <p class="font-body-sm text-body-sm text-on-surface-variant">
              \${activeTab === 1 ? "You have no active meetup chats." : "You have no recent activity."}
            </p>
          </div>
        \`;
        return;
      }

      container.innerHTML = '';

      displayActivity.forEach(activity => {
        // Status Badge Logic
        let actionRequiredHTML = '';
        if (activity.isActionable && activity.type === 'offer_received') {
          actionRequiredHTML = \`<div class="w-2 h-2 rounded-full bg-error absolute top-4 right-4 shadow-sm animate-pulse"></div>\`;
        } else if (activity.isActionable && activity.type.startsWith('reservation')) {
           actionRequiredHTML = \`<div class="font-label-caps text-[10px] text-primary-container bg-primary-container/10 px-2 py-0.5 rounded-full absolute top-3 right-3">Active Chat</div>\`;
        }

        const dateStr = activity.date.toLocaleDateString([], { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });

        const cardHtml = \`
          <div onclick="window.location.href='\${activity.url}'" class="relative cursor-pointer bg-surface-container-lowest rounded-2xl p-4 flex gap-4 shadow-[0_2px_8px_rgba(0,0,0,0.02)] border border-outline-variant/10 hover:shadow-md transition-all active:scale-[0.99]">
            \${actionRequiredHTML}
            <div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center shrink-0">
              <span class="material-symbols-outlined text-[24px] text-primary">\${activity.icon}</span>
            </div>
            <div class="flex-1 flex flex-col justify-center min-w-0 pr-6">
              <h4 class="font-body-sm text-body-sm text-on-surface font-semibold truncate">\${activity.title}</h4>
              <p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5 line-clamp-2">\${activity.description}</p>
              <span class="font-label-caps text-[10px] text-on-surface-variant/60 mt-1">\${dateStr}</span>
            </div>
          </div>
        \`;
        container.insertAdjacentHTML('beforeend', cardHtml);
      });
    }
  </script>
</body>
</html>
