<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dashboard - UniThrift</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-primary": "#ffffff", "on-surface-variant": "#3d4a3d", "surface-bright": "#f8f9ff", "on-primary-fixed": "#002109", "surface-dim": "#cbdbf5", "primary-fixed-dim": "#4ae176", "inverse-on-surface": "#eaf1ff", "outline": "#6d7b6c", "surface": "#f8f9ff", "on-secondary-fixed-variant": "#3f465c", "surface-container-low": "#eff4ff", "secondary-fixed-dim": "#bec6e0", "on-secondary-container": "#5c647a", "tertiary-fixed-dim": "#bdcac1", "secondary-fixed": "#dae2fd", "error": "#ba1a1a", "tertiary-container": "#a2afa7", "inverse-on-surface": "#eaf1ff", "outline-variant": "#bccbb9", "on-tertiary-fixed": "#131e19", "secondary-container": "#dae2fd", "on-tertiary-fixed-variant": "#3e4943", "surface-container-lowest": "#ffffff", "on-error": "#ffffff", "on-tertiary": "#ffffff", "tertiary-fixed": "#d9e6dd", "surface-tint": "#006e2f", "tertiary": "#55615a", "surface-container-highest": "#d3e4fe", "on-secondary": "#ffffff", "primary-container": "#22c55e", "background": "#f8f9ff", "primary-fixed": "#6bff8f", "primary": "#006e2f", "on-primary-fixed-variant": "#005321", "on-secondary-fixed": "#131b2e", "surface-container": "#e5eeff", "error-container": "#ffdad6", "surface-container-high": "#dce9ff", "on-tertiary-container": "#37433c", "surface-variant": "#d3e4fe", "on-error-container": "#93000a", "on-primary-container": "#004b1e", "secondary": "#565e74", "inverse-primary": "#4ae176", "on-background": "#0b1c30", "on-surface": "#0b1c30" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "stack-sm": "8px", "stack-md": "16px", "stack-lg": "32px", "unit": "4px", "container-padding-mobile": "20px", "container-padding-desktop": "48px", "gutter": "16px" }, "fontFamily": { "body-lg": ["Geist"], "headline-lg-mobile": ["Geist"], "title-md": ["Geist"], "headline-lg": ["Geist"], "label-caps": ["Geist"], "body-sm": ["Geist"], "display-lg": ["Geist"] }, "fontSize": { "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.04em", "fontWeight": "700" }] } } }
  </script>
  <style>
    @layer base {
      body { -webkit-tap-highlight-color: transparent; }
      .pt-safe { padding-top: env(safe-area-inset-top); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    }
    .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/scripts/supabase.js"></script>
  <script>
    requireAuth();
  </script>
</head>
<body class="bg-background font-body-lg text-on-background min-h-screen flex flex-col pb-safe">

  <!-- Header -->
  <header class="fixed top-0 w-full z-50 glass pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
    <div class="h-14 px-4 flex items-center justify-between">
      <button class="w-10 h-10 flex items-center justify-center -ml-2 text-on-surface" onclick="history.back()">
        <span class="material-symbols-outlined">arrow_back_ios_new</span>
      </button>
      <div id="platform-switcher-slot"></div>
      <a href="/core/profile.html" class="w-8 h-8 rounded-full overflow-hidden ring-2 ring-primary-container/20">
        <img id="header-avatar" alt="Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDP-dstOC5bgHNI3kEMkDDK4pN1_X0ipnzd1h5RGxwu7hftKs8Kh5iHhMrKREQrYRocawgw4ncImHVSVM9nNl55CV_SKMEvsWI_9y6iW078Y7gw8libWMPW2_i5tRLJEGolQG5FA04ciktp2pKFsrktqmnmwPDWXKxRxDiT2yLONHYwcfhstR74y7ZDaCN6qn2jddOMv5koe_xRFxvwKO1HISMW-uIgzD-ohsoRNtsY2H-23fOyKF3BK2RG3S6zd5O3EOcj6luIuoEA" />
      </a>
    </div>
    <!-- Tabs -->
    <div class="flex px-4 gap-6 overflow-x-auto hide-scrollbar pt-2 pb-1">
      <button id="tab-buyer" class="pb-2 font-title-md text-[16px] text-primary border-b-2 border-primary whitespace-nowrap px-1" onclick="switchTab('buyer')">Buying</button>
      <button id="tab-seller" class="pb-2 font-title-md text-[16px] text-on-surface-variant border-b-2 border-transparent whitespace-nowrap px-1 transition-colors" onclick="switchTab('seller')">Selling</button>
    </div>
  </header>

  <main class="flex-1 pt-28 px-4 md:px-8 max-w-3xl mx-auto w-full flex flex-col gap-4">
    <!-- Content Area -->
    <div id="reservations-container" class="flex flex-col gap-4 pb-12">
      <!-- Loading State -->
      <div class="animate-pulse bg-surface-container rounded-3xl h-40"></div>
      <div class="animate-pulse bg-surface-container rounded-3xl h-40"></div>
    </div>
  </main>

  <script>
    let currentRole = 'buyer'; // 'buyer' or 'seller'

    function switchTab(role) {
      currentRole = role;
      
      const tabBuyer = document.getElementById('tab-buyer');
      const tabSeller = document.getElementById('tab-seller');
      
      if (role === 'buyer') {
        tabBuyer.classList.replace('text-on-surface-variant', 'text-primary');
        tabBuyer.classList.replace('border-transparent', 'border-primary');
        tabSeller.classList.replace('text-primary', 'text-on-surface-variant');
        tabSeller.classList.replace('border-primary', 'border-transparent');
      } else {
        tabSeller.classList.replace('text-on-surface-variant', 'text-primary');
        tabSeller.classList.replace('border-transparent', 'border-primary');
        tabBuyer.classList.replace('text-primary', 'text-on-surface-variant');
        tabBuyer.classList.replace('border-primary', 'border-transparent');
      }

      loadReservations();
    }

    async function loadReservations() {
      const container = document.getElementById('reservations-container');
      container.innerHTML = `
        <div class="animate-pulse bg-surface-container rounded-3xl h-40"></div>
        <div class="animate-pulse bg-surface-container rounded-3xl h-40"></div>
      `;

      try {
        let reservations = [];
        if (currentRole === 'buyer') {
          reservations = await getReservationsAsBuyer();
        } else {
          reservations = await getReservationsAsSeller();
        }

        if (reservations.length === 0) {
          container.innerHTML = `
            <div class="flex flex-col items-center justify-center py-16 text-center">
              <div class="w-16 h-16 bg-surface-container rounded-full flex items-center justify-center text-on-surface-variant mb-4">
                <span class="material-symbols-outlined text-[32px]">inventory_2</span>
              </div>
              <h3 class="font-title-md text-title-md text-on-background">No active reservations</h3>
              <p class="font-body-sm text-body-sm text-on-surface-variant mt-2 max-w-[250px]">
                ${currentRole === 'buyer' ? 'Items you reserve will appear here.' : 'When someone reserves your items, they will appear here.'}
              </p>
            </div>
          `;
          return;
        }

        container.innerHTML = '';
        reservations.forEach(res => {
          // Status styling
          let statusBadge = '';
          if (res.status === 'Reserved') {
            statusBadge = `<span class="bg-primary-container text-on-primary-container text-[10px] font-label-caps px-2 py-0.5 rounded-full">Active</span>`;
          } else if (res.status === 'Completed') {
            statusBadge = `<span class="bg-surface-variant text-on-surface-variant text-[10px] font-label-caps px-2 py-0.5 rounded-full">Completed</span>`;
          } else {
            statusBadge = `<span class="bg-error-container text-error text-[10px] font-label-caps px-2 py-0.5 rounded-full">${res.status}</span>`;
          }

          const otherPartyName = res.profiles ? res.profiles.full_name : 'Unknown';
          const otherPartyAvatar = res.profiles?.avatar_url || 'https://api.dicebear.com/7.x/avataaars/svg?seed=fallback';
          
          let actionButton = '';
          if (res.status === 'Reserved') {
            actionButton = `
              <button onclick="window.location.href='/core/chat.html?id=${res.id}'" class="flex-1 bg-primary text-on-primary font-title-md text-[14px] py-3 rounded-xl hover:opacity-90 transition-opacity active:scale-[0.98] flex items-center justify-center gap-2">
                <span>Open Chat</span>
                <span class="material-symbols-outlined text-[18px]">chat_bubble</span>
              </button>
            `;
          } else if (res.status === 'Completed') {
            actionButton = `
              <button onclick="window.location.href='/core/chat.html?id=${res.id}'" class="flex-1 bg-surface-container text-on-surface-variant font-title-md text-[14px] py-3 rounded-xl hover:bg-surface-variant transition-opacity active:scale-[0.98]">
                View Details
              </button>
            `;
          }

          const card = document.createElement('div');
          card.className = "bg-surface-container-lowest border border-outline-variant/30 rounded-3xl p-5 shadow-sm flex flex-col gap-4";
          
          card.innerHTML = `
            <div class="flex justify-between items-start gap-4">
              <div class="flex gap-4">
                <div class="w-16 h-16 rounded-2xl bg-surface-container overflow-hidden shrink-0">
                  ${res.products.image_url ? `<img src="${res.products.image_url}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-on-surface-variant/40"><span class="material-symbols-outlined text-[24px]">image</span></div>`}
                </div>
                <div class="flex flex-col">
                  <div class="flex items-center gap-2 mb-0.5">
                    <h3 class="font-title-md text-[16px] text-on-background line-clamp-1">${res.products.title}</h3>
                    ${statusBadge}
                  </div>
                  <p class="font-body-sm text-[12px] text-on-surface-variant line-clamp-1">
                    ${currentRole === 'buyer' ? 'Purchasing from' : 'Selling to'}: <strong>${otherPartyName}</strong>
                  </p>
                  <p class="font-title-md text-[14px] text-primary mt-1">₹${res.products.price}</p>
                </div>
              </div>
            </div>
            
            <div class="bg-surface-container/50 rounded-xl p-3 flex justify-between items-center">
              <div class="flex flex-col">
                <span class="font-label-caps text-[10px] text-on-surface-variant">Remaining Balance</span>
                <span class="font-title-md text-[16px] text-on-background">₹${res.remaining_amount}</span>
              </div>
              <div class="text-right flex flex-col">
                <span class="font-label-caps text-[10px] text-on-surface-variant">Deposit Paid</span>
                <span class="font-body-sm text-[12px] text-primary">₹${res.deposit_amount}</span>
              </div>
            </div>
            
            <div class="flex gap-2">
              ${actionButton}
            </div>
          `;
          
          container.appendChild(card);
        });
      } catch(e) {
        console.error(e);
        container.innerHTML = `<div class="text-error p-4 text-center">Failed to load reservations.</div>`;
      }
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', () => {
      loadReservations();
    });
  </script>
  <nav class="fixed bottom-0 w-full z-50 pb-safe glass shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary-container">
    <div class="flex justify-around items-center h-16 px-4">
      <a aria-current="page" class="flex flex-col items-center gap-1 transition-colors text-primary-container" data-path="dashboard" href="/core/dashboard.html">
        <span class="material-symbols-outlined">dashboard</span>
        <span class="font-label-caps text-label-caps">Home</span>
      </a>
      <a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary-container transition-colors" data-path="marketplace" href="/marketplace/marketplace.html">
        <span class="material-symbols-outlined">shopping_bag</span>
        <span class="font-label-caps text-label-caps">Market</span>
      </a>
      <a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary-container transition-colors" data-path="flatmates" href="/roommates/flatmates.html">
        <span class="material-symbols-outlined">group</span>
        <span class="font-label-caps text-label-caps">Mates</span>
      </a>
      <a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary-container transition-colors" data-path="hostel-hub" href="/pghostels/pghostels.html">
        <span class="material-symbols-outlined">apartment</span>
        <span class="font-label-caps text-label-caps">PG/Hostel</span>
      </a>
      <a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary-container transition-colors" href="/core/activity.html">
        <span class="material-symbols-outlined">notifications</span>
        <span class="font-label-caps text-label-caps">Activity</span>
      </a>
    </div>
  </nav>
</body>
</html>
