  <link rel=stylesheet href=/styles/site-theme.css><link rel=stylesheet href=/styles/site-motion.css><script src=/scripts/site-motion.js defer></script></head><body class="bg-background font-body-lg text-on-background"><header class="fixed top-0 w-full z-50 glass pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-container-padding-mobile md:px-6 md:max-w-5xl md:mx-auto flex items-center justify-between"><div class="flex items-center gap-stack-sm"><button class="w-10 h-10 flex items-center justify-center -ml-2 text-on-surface" onclick="history.back()"><span class="material-symbols-outlined">arrow_back_ios_new</span></button><span class="font-title-md text-title-md text-on-surface">Offers Dashboard</span></div><a href="/core/profile.html" class="block w-8 h-8 rounded-full overflow-hidden ring-2 ring-primary-container/20 hover:scale-105 transition-transform cursor-pointer"><img id="header-avatar" alt="Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDP-dstOC5bgHNI3kEMkDDK4pN1_X0ipnzd1h5RGxwu7hftKs8Kh5iHhMrKREQrYRocawgw4ncImHVSVM9nNl55CV_SKMEvsWI_9y6iW078Y7gw8libWMPW2_i5tRLJEGolQG5FA04ciktp2pKFsrktqmnmwPDWXKxRxDiT2yLONHYwcfhstR74y7ZDaCN6qn2jddOMv5koe_xRFxvwKO1HISMW-uIgzD-ohsoRNtsY2H-23fOyKF3BK2RG3S6zd5O3EOcj6luIuoEA"/></a></div></header><main class="pt-20 pb-[120px] md:pb-8 bg-background min-h-screen"><div class="flex flex-col w-full px-container-padding-mobile md:px-6 md:max-w-5xl md:mx-auto gap-stack-md">

  <!-- Tab Toggle -->
  <div class="flex bg-surface-container-low p-1 rounded-2xl w-full max-w-md mx-auto relative shadow-[0_2px_8px_rgba(0,0,0,0.02)]">
    <!-- Active Background Pill -->
    <div id="tab-pill" class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-surface-container-lowest rounded-[12px] shadow-sm transition-transform duration-300"></div>
    
    <button onclick="switchTab(0)" id="tab-received-btn" class="flex-1 text-center py-2.5 z-10 font-body-sm text-body-sm font-semibold transition-colors text-on-surface text-primary" type="button">
      Offers Received
    </button>
    <button onclick="switchTab(1)" id="tab-sent-btn" class="flex-1 text-center py-2.5 z-10 font-body-sm text-body-sm font-semibold transition-colors text-on-surface/60" type="button">
      Offers Sent
    </button>
  </div>

  <!-- Offers Container -->
  <div class="flex flex-col gap-4 mt-2" id="offers-list">
    <!-- Offers will be dynamically loaded here -->
    <div class="flex flex-col items-center justify-center py-12 text-center gap-3" id="offers-placeholder">
      <div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant animate-pulse"></div>
      <p class="font-body-sm text-body-sm text-on-surface-variant">Loading offers...</p>
    </div>
  </div>

</div>
<script>
  let activeTab = 0; // 0 = Received, 1 = Sent
  let receivedOffers = [];
  let sentOffers = [];

  document.addEventListener('DOMContentLoaded', async () => {
    // Header avatar
    const profile = await getProfile();
    if (profile && profile.avatar_url) {
      document.getElementById('header-avatar').src = profile.avatar_url;
    }

    // Load data
    await loadOffers();
  });

  async function loadOffers() {
    receivedOffers = await getReceivedOffers();
    sentOffers = await getSentOffers();
    renderOffers();
  }

  function switchTab(index) {
    activeTab = index;
    const pill = document.getElementById('tab-pill');
    const recBtn = document.getElementById('tab-received-btn');
    const sentBtn = document.getElementById('tab-sent-btn');

    if (index === 0) {
      pill.style.transform = 'translateX(0)';
      recBtn.classList.add('text-primary');
      recBtn.classList.remove('text-on-surface/60');
      sentBtn.classList.remove('text-primary');
      sentBtn.classList.add('text-on-surface/60');
    } else {
      pill.style.transform = 'translateX(100%)';
      sentBtn.classList.add('text-primary');
      sentBtn.classList.remove('text-on-surface/60');
      recBtn.classList.remove('text-primary');
      recBtn.classList.add('text-on-surface/60');
    }

    renderOffers();
  }

  function renderOffers() {
    const listContainer = document.getElementById('offers-list');
    const currentList = activeTab === 0 ? receivedOffers : sentOffers;

    if (currentList.length === 0) {
      const typeText = activeTab === 0 ? "received any offers yet." : "sent any offers yet.";
      listContainer.innerHTML = `
        <div class="flex flex-col items-center justify-center py-16 text-center gap-3">
          <div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
            <span class="material-symbols-outlined text-[32px]">local_offer</span>
          </div>
          <p class="font-body-sm text-body-sm text-on-surface-variant">You haven't ${typeText}</p>
        </div>
      `;
      return;
    }

    listContainer.innerHTML = '';

    currentList.forEach(offer => {
      const product = offer.products;
      if (!product) return;

      const price = offer.offer_amount ? '₹' + offer.offer_amount : '₹0';
      const imgStyle = product.image_url ? `background-image: url('${product.image_url}')` : 'background-color: var(--color-surface-container)';
      const imagePlaceholder = !product.image_url ? `<span class="material-symbols-outlined text-[24px] text-on-surface-variant/40">image_not_supported</span>` : '';

      // Status Badge
      let statusColor = 'bg-surface-container text-on-surface-variant';
      if (offer.status === 'Accepted') statusColor = 'bg-primary-container text-on-primary';
      if (offer.status === 'Rejected') statusColor = 'bg-error-container/20 text-error';
      if (offer.status === 'Countered') statusColor = 'bg-secondary-container text-on-secondary-container';

      // Card action
      const cardAction = activeTab === 0 
        ? `onclick="window.location.href='/marketplace/offer_received.html?id=${offer.id}'"`
        : (offer.status === 'Countered'
            ? `onclick="window.location.href='/marketplace/counter_offer.html?id=${offer.id}'"`
            : `onclick="window.location.href='/marketplace/item.html?id=${product.id}'"`);

      const cardHtml = `
        <div ${cardAction} class="cursor-pointer bg-surface-container-lowest rounded-2xl p-4 flex gap-4 shadow-sm hover:shadow-md transition-shadow active:scale-[0.99] transition-transform">
          <div class="w-16 h-16 rounded-xl bg-cover bg-center flex items-center justify-center overflow-hidden shrink-0 border border-outline-variant/10" style="${imgStyle}">
            ${imagePlaceholder}
          </div>
          <div class="flex-1 flex flex-col justify-between min-w-0">
            <div>
              <div class="flex justify-between items-start gap-2">
                <h4 class="font-body-lg text-body-lg text-on-surface font-semibold truncate">${product.title}</h4>
                <span class="font-label-caps text-label-caps px-2 py-0.5 rounded-full ${statusColor}">${offer.status}</span>
              </div>
              <p class="font-body-sm text-body-sm text-on-surface-variant">
                ${activeTab === 0 ? `From: ${offer.profiles?.full_name || 'Buyer'}` : `To: seller`}
              </p>
            </div>
            <div class="flex justify-between items-baseline mt-2">
              <span class="font-label-caps text-label-caps text-on-surface-variant">Offer Amount</span>
              <span class="font-title-md text-title-md text-primary font-bold">${price}</span>
            </div>
          </div>
        </div>
      `;

      listContainer.insertAdjacentHTML('beforeend', cardHtml);
    });
  }
</script></main></body></html>
