<script>
    document.addEventListener('DOMContentLoaded', () => {
        const priceInput = document.getElementById('priceInput');
        const offerToggle = document.getElementById('offerToggle');
        const offerKnob = document.getElementById('offerKnob');
        const offerArea = document.getElementById('offerArea');
        const offerSlider = document.getElementById('offerSlider');
        const sliderFill = document.getElementById('sliderFill');
        const sliderThumb = document.getElementById('sliderThumb');
        const minOfferDisplay = document.getElementById('minOfferDisplay');
        const summaryPrice = document.getElementById('summaryPrice');
        const summaryFee = document.getElementById('summaryFee');
        const summaryTotal = document.getElementById('summaryTotal');
        const suggestions = document.querySelectorAll('.price-suggestion');
        const priceCard = document.getElementById('priceCard');

        let isOfferEnabled = true;
        let currentPrice = 0;

        // Auto-resize input width based on length
        function updateInputWidth() {
            const val = priceInput.value || '0';
            // Rough estimation, works well for monospaced/numeric
            const charWidth = 24; 
            const newWidth = Math.max(32, val.length * charWidth + 20);
            priceInput.style.width = `${newWidth}px`;
            
            // Subtle lift effect on type
            priceCard.style.transform = 'scale(1.02)';
            priceCard.style.boxShadow = '0 12px 30px rgba(0,0,0,0.08)';
            setTimeout(() => {
                priceCard.style.transform = 'scale(1)';
                priceCard.style.boxShadow = '0 4px 20px rgba(0,0,0,0.04)';
            }, 150);
        }

        function updateCalculations() {
            const val = parseFloat(priceInput.value) || 0;
            currentPrice = val;
            
            // Format to 2 decimal places if needed, but keep integers clean if possible
            const formatMoney = (num) => {
                return num % 1 === 0 ? `$${num}` : `$${num.toFixed(2)}`;
            };

            const fee = val * 0.05;
            const total = val - fee;

            summaryPrice.textContent = formatMoney(val);
            summaryFee.textContent = `-${formatMoney(fee)}`;
            summaryTotal.textContent = formatMoney(total);

            updateSliderDisplay();
        }

        // Slider Logic
        function updateSliderDisplay() {
            const percentage = offerSlider.value;
            // Min offer is based on percentage of current price
            const minOfferVal = (currentPrice * (percentage / 100));
            minOfferDisplay.textContent = `$${Math.round(minOfferVal)}`;
            
            sliderFill.style.width = `${percentage}%`;
            sliderThumb.style.left = `calc(${percentage}% - 12px)`;
        }

        priceInput.addEventListener('input', () => {
            // Remove non-numeric
            priceInput.value = priceInput.value.replace(/[^0-9.]/g, '');
            // Prevent multiple decimals
            if((priceInput.value.match(/\./g) || []).length > 1) {
                priceInput.value = priceInput.value.replace(/\.$/, "");
            }
            updateInputWidth();
            updateCalculations();
        });

        // Price Suggestions
        suggestions.forEach(btn => {
            btn.addEventListener('click', () => {
                priceInput.value = btn.dataset.price;
                updateInputWidth();
                updateCalculations();
                
                // Visual feedback on chips
                suggestions.forEach(b => {
                    b.classList.remove('bg-primary-container', 'text-on-primary-container');
                    b.classList.add('bg-surface-container', 'text-on-surface');
                });
                btn.classList.remove('bg-surface-container', 'text-on-surface');
                btn.classList.add('bg-primary-container', 'text-on-primary-container');
            });
        });

        // Offer Toggle
        offerToggle.addEventListener('click', () => {
            isOfferEnabled = !isOfferEnabled;
            if(isOfferEnabled) {
                offerToggle.classList.replace('bg-surface-variant', 'bg-primary');
                offerKnob.style.transform = 'translateX(0)';
                offerArea.style.maxHeight = '200px';
                offerArea.style.opacity = '1';
                offerArea.style.marginTop = '16px';
            } else {
                offerToggle.classList.replace('bg-primary', 'bg-surface-variant');
                offerKnob.style.transform = 'translateX(-24px)';
                offerArea.style.maxHeight = '0px';
                offerArea.style.opacity = '0';
                offerArea.style.marginTop = '0px';
            }
        });

        offerSlider.addEventListener('input', updateSliderDisplay);

        // Initialize
        updateCalculations();
        updateInputWidth();
        // Set initial toggle state if needed, here it starts ON
        offerArea.style.maxHeight = '200px';
    });
</script></main></body></html>
