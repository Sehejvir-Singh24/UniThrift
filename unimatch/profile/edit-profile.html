<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Profile - UniMatch</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "on-error": "#ffffff", "surface-tint": "#9f3c59", "tertiary": "#2e2c25",
          "error-container": "#ffdad6", "on-surface-variant": "#554245", "surface": "#faf9f7",
          "surface-container-low": "#f4f3f1", "on-background": "#1a1c1b", "secondary": "#7d562d",
          "surface-container": "#efeeec", "secondary-container": "#ffca98", "primary-container": "#7a1f3d",
          "on-surface": "#1a1c1b", "primary": "#5c0427", "background": "#faf9f7", "on-primary": "#ffffff",
          "surface-container-lowest": "#ffffff", "error": "#ba1a1a", "outline-variant": "#dac0c4",
          "outline": "#887275", "surface-variant": "#e3e2e0"
        },
        borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
        spacing: { "stack-gap-lg": "32px", "section-margin": "48px", "stack-gap-md": "20px", "stack-gap-sm": "12px", "container-padding": "24px", "unit": "4px" },
        fontFamily: { "label-caps": ["Inter"], "button": ["Inter"], "body-lg": ["Inter"], "display": ["Inter"], "body-md": ["Inter"], "headline-lg": ["Inter"], "headline-lg-mobile": ["Inter"], "title-md": ["Inter"] },
        fontSize: {
          "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
          "button": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
          "body-lg": ["17px", { "lineHeight": "26px", "fontWeight": "400" }],
          "display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
          "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "400" }],
          "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
          "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "500" }]
        }
      }
    }
  }
</script>
<style>
  body { background-color: #faf9f7; color: #1a1c1b; min-height: max(884px, 100dvh); }
  .shadow-ambient { box-shadow: 0 12px 36px -4px rgba(0, 0, 0, 0.06), 0 4px 12px -2px rgba(0, 0, 0, 0.04); }
  .btn-transition { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
  .btn-transition:active { transform: scale(0.98); }
</style>
<link rel=stylesheet href=/styles/site-motion.css><script src=/scripts/site-motion.js defer></script></head>
<body class="bg-background text-on-surface min-h-screen flex flex-col antialiased">

<header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl border-b border-surface-variant/30 px-container-padding h-16 flex items-center justify-between">
  <a class="flex items-center text-on-surface-variant hover:text-on-surface transition-colors" href="/unimatch/profile/my-profile.html">
    <span class="material-symbols-outlined mr-2">arrow_back</span>
    <span class="font-button text-button">Cancel</span>
  </a>
  <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold">Edit Profile</h1>
  <button onclick="handleSave(event)" class="font-button text-button text-primary hover:text-primary-container transition-colors font-semibold">
    Save
  </button>
</header>

<main class="flex-grow pt-24 pb-32 px-container-padding max-w-3xl mx-auto w-full">
  <!-- Profile Photo Section -->
  <section class="flex flex-col items-center mb-section-margin">
    <div class="relative w-32 h-32 rounded-full mb-4 group cursor-pointer" onclick="document.getElementById('edit-photo-input').click()">
      <img id="edit-photo-preview" alt="Profile Photo" class="w-full h-full object-cover rounded-full shadow-ambient" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=780&q=80"/>
      <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
        <span class="material-symbols-outlined text-white text-3xl">photo_camera</span>
      </div>
    </div>
    <button onclick="document.getElementById('edit-photo-input').click()" class="font-button text-button text-secondary border border-secondary rounded-full px-6 py-2 hover:bg-secondary/5 transition-colors">
      Change Photo
    </button>
    <input type="file" id="edit-photo-input" accept="image/*" class="hidden" onchange="handlePhotoChange(event)"/>
  </section>

  <!-- Form Fields -->
  <form class="space-y-stack-gap-lg" onsubmit="handleSave(event)">
    <!-- Basic Info Card -->
    <div class="bg-surface-container-lowest rounded-[24px] p-container-padding shadow-ambient space-y-stack-gap-md">
      <h2 class="font-title-md text-title-md text-on-surface mb-4 font-semibold">Basic Information</h2>
      <!-- Name -->
      <div class="space-y-unit">
        <label class="font-label-caps text-label-caps text-on-surface-variant block uppercase tracking-wider">Full Name</label>
        <input id="edit-fullName" class="w-full bg-background border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" type="text" placeholder="Enter your full name" value=""/>
      </div>
      <!-- Gender & Feed Preference -->
      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-unit">
          <label class="font-label-caps text-label-caps text-on-surface-variant block uppercase tracking-wider">Your Gender</label>
          <select id="edit-gender" class="w-full bg-background border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary appearance-none transition-colors">
            <option value="Male">Man / Male</option>
            <option value="Female">Woman / Female</option>
            <option value="Non-binary">Non-binary</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="space-y-unit">
          <label class="font-label-caps text-label-caps text-on-surface-variant block uppercase tracking-wider">Show Me In Feed</label>
          <select id="edit-preferred_gender" class="w-full bg-background border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary appearance-none transition-colors">
            <option value="Women">Women</option>
            <option value="Men">Men</option>
            <option value="Everyone">Everyone</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Academic Details -->
    <div class="bg-surface-container-lowest rounded-[24px] p-container-padding shadow-ambient space-y-stack-gap-md">
      <h2 class="font-title-md text-title-md text-on-surface mb-4 font-semibold">Academic Details</h2>
      <div class="space-y-unit">
        <label class="font-label-caps text-label-caps text-on-surface-variant block uppercase tracking-wider">Major / Field of Study</label>
        <input id="edit-major" class="w-full bg-background border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" type="text" placeholder="e.g. Computer Science or GTB4CEC" value=""/>
      </div>
      <div class="space-y-unit">
        <div class="flex justify-between font-label-caps text-label-caps text-on-surface-variant">
          <span class="uppercase tracking-wider">Biography</span>
          <span id="edit-bio-count" class="text-outline">0 / 300</span>
        </div>
        <textarea id="edit-bio" class="w-full bg-background border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none" rows="4" maxlength="300" placeholder="Share a bit about your academic interests or what you're looking for..." oninput="document.getElementById('edit-bio-count').textContent = `${this.value.length} / 300`"></textarea>
      </div>
    </div>

    <!-- Interests -->
    <div class="bg-surface-container-lowest rounded-[24px] p-container-padding shadow-ambient space-y-stack-gap-md">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-title-md text-title-md text-on-surface font-semibold">Interests</h2>
        <button type="button" onclick="location.href='/unimatch/profile-setup/interests.html'" class="text-primary hover:text-primary-container transition-colors flex items-center">
          <span class="material-symbols-outlined text-sm mr-1">add</span>
          <span class="font-button text-sm font-semibold">Add / Edit</span>
        </button>
      </div>
      <div id="edit-interests-chips" class="flex flex-wrap gap-3">
        <span class="text-sm text-on-surface-variant">No interests added yet</span>
      </div>
    </div>

    <!-- Submit Action -->
    <div class="pt-section-margin flex flex-col gap-4">
      <button id="save-btn" type="submit" class="w-full bg-primary text-on-primary rounded-full py-4 font-button text-button shadow-ambient btn-transition font-semibold">
        Save Changes
      </button>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/scripts/supabase.js"></script>
<script>
  let _pendingPhotoFile = null;   // holds the File object the user picked
  let _currentPhotos   = [];      // holds the existing profile_photos array

  (async () => {
    const profile = await requireUniMatchAuth();
    if (!profile) return;
    if (profile) {
      if (profile.full_name) document.getElementById('edit-fullName').value = profile.full_name;
      const majorVal = profile.major || profile.college || profile.university || '';
      document.getElementById('edit-major').value = majorVal;

      if (profile.gender && document.getElementById('edit-gender')) document.getElementById('edit-gender').value = profile.gender;
      if (profile.preferred_gender && document.getElementById('edit-preferred_gender')) document.getElementById('edit-preferred_gender').value = profile.preferred_gender;
      if (profile.bio) {
        document.getElementById('edit-bio').value = profile.bio;
        document.getElementById('edit-bio-count').textContent = `${profile.bio.length} / 300`;
      }
      if (profile.interests) {
        try {
          const list = typeof profile.interests === 'string' ? JSON.parse(profile.interests) : profile.interests;
          if (Array.isArray(list) && list.length > 0) {
            document.getElementById('edit-interests-chips').innerHTML = list.map(i => `
              <div class="bg-primary/10 text-primary border border-primary/20 rounded-full px-4 py-2 flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px]">auto_awesome</span>
                <span class="font-body-md text-body-md">${escapeHTML(i)}</span>
              </div>
            `).join('');
          }
        } catch(e) {}
      }

      // Load existing photos
      if (profile.profile_photos) {
        try {
          _currentPhotos = typeof profile.profile_photos === 'string'
            ? JSON.parse(profile.profile_photos)
            : profile.profile_photos;
          if (!Array.isArray(_currentPhotos)) _currentPhotos = [];
        } catch (e) { _currentPhotos = []; }
      }
      if (_currentPhotos.length === 0 && profile.avatar_url) _currentPhotos = [profile.avatar_url];

      // Show current photo in preview
      if (_currentPhotos.length > 0 && document.getElementById('edit-photo-preview')) {
        document.getElementById('edit-photo-preview').src = _currentPhotos[0];
      }
    }
  })();

  // Called when user picks a new photo file
  function handlePhotoChange(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    _pendingPhotoFile = file;
    // Show local preview immediately
    const reader = new FileReader();
    reader.onload = (e) => {
      const preview = document.getElementById('edit-photo-preview');
      if (preview) preview.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function handleSave(e) {
    if (e) e.preventDefault();
    const btn = document.getElementById('save-btn');
    btn.textContent = 'Saving...';
    btn.disabled = true;

    try {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { alert('Session expired. Please log in again.'); return; }

      const userId = session.user.id;
      let updatedPhotos = [..._currentPhotos];

      // ── Upload new photo if the user picked one ──────────────────────
      if (_pendingPhotoFile) {
        btn.textContent = 'Uploading photo...';
        const ext  = _pendingPhotoFile.name.split('.').pop() || 'jpg';
        const path = `${userId}/profile_${Date.now()}.${ext}`;

        const { error: uploadErr } = await supabase.storage
          .from('profile-photos')
          .upload(path, _pendingPhotoFile, { upsert: true, contentType: _pendingPhotoFile.type });

        if (uploadErr) {
          // Storage bucket may not be set up — fallback: store base64 data URL is too large,
          // so we just alert and skip photo update.
          console.error('Photo upload error:', uploadErr);
          alert(`Photo upload failed: ${uploadErr.message}\n\nOther profile details will still be saved.`);
        } else {
          const { data: urlData } = supabase.storage
            .from('profile-photos')
            .getPublicUrl(path);
          const publicUrl = urlData?.publicUrl;
          if (publicUrl) {
            // Replace the first photo (main photo), keep the rest
            updatedPhotos[0] = publicUrl;
          }
        }
      }

      // ── Save all profile fields ──────────────────────────────────────
      btn.textContent = 'Saving...';
      const { error: updateErr } = await supabase.from('profiles').update({
        full_name:       document.getElementById('edit-fullName').value.trim(),
        major:           document.getElementById('edit-major').value.trim(),
        gender:          document.getElementById('edit-gender')?.value || null,
        preferred_gender: document.getElementById('edit-preferred_gender')?.value || null,
        bio:             document.getElementById('edit-bio').value.trim(),
        profile_photos:  JSON.stringify(updatedPhotos),
        avatar_url:      updatedPhotos[0] || null,
        updated_at:      new Date().toISOString(),
      }).eq('id', userId);

      if (updateErr) {
        console.error('Profile update error:', updateErr);
        alert(`Save failed: ${updateErr.message}`);
        btn.textContent = 'Save Changes';
        btn.disabled = false;
        return;
      }

      window.location.href = '/unimatch/profile/my-profile.html';
    } catch (err) {
      console.error('handleSave error:', err);
      alert('Something went wrong. Please try again.');
      btn.textContent = 'Save Changes';
      btn.disabled = false;
    }
  }
</script>
</body></html>
