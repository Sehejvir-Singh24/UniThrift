<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>UniMatch - Upload Photos</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <!-- Cropper.js CSS & JS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-surface": "#1a1c1b", "surface-container": "#efeeec", "on-surface-variant": "#554245",
            "primary": "#5c0427", "outline-variant": "#dac0c4", "on-background": "#1a1c1b",
            "on-primary": "#ffffff", "surface": "#faf9f7", "background": "#faf9f7",
            "primary-container": "#7a1f3d", "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f4f3f1", "outline": "#887275",
          },
          borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
          fontFamily: { "sans": ["Inter", "sans-serif"] }
        }
      }
    }
  </script>
  <style>
    body { background-color: #faf9f7; color: #1a1c1b; min-height: 100vh; font-family: 'Inter', sans-serif; overscroll-behavior: none; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .cropper-view-box, .cropper-face { border-radius: 1.5rem; }
    .cropper-line, .cropper-point { background-color: #5c0427; }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-between pt-20 pb-24">

<!-- Top Header -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/30 flex justify-between items-center px-4 sm:px-6 py-3 max-w-md mx-auto">
  <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container active:scale-95 transition-all text-primary">
    <span class="material-symbols-outlined text-[22px]">arrow_back</span>
  </button>
  <h1 class="font-bold text-xl text-primary text-center tracking-tight">UniMatch</h1>
  <div class="w-10"></div>
</header>

<main class="w-full max-w-md px-4 sm:px-6 flex flex-col flex-grow">
  <div class="my-6">
    <h2 class="text-[26px] font-bold text-on-surface leading-tight tracking-tight">Show your personality</h2>
    <p class="text-[14px] text-on-surface-variant mt-1">Upload & frame 4-6 photos to show your community who you are.</p>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6" id="photo-grid">
    <!-- Slots 1-6 generated dynamically -->
  </div>

  <div id="error-msg" class="hidden bg-red-100 border border-red-300 text-red-700 text-xs font-semibold px-4 py-3 rounded-2xl mb-4"></div>

  <div class="mt-auto">
    <button id="continue-btn" onclick="handleContinue()" class="w-full py-4 rounded-full bg-primary text-on-primary font-bold text-[16px] text-center shadow-lg hover:bg-primary/90 active:scale-[0.98] transition-all">
      Continue
    </button>
  </div>
</main>

<input type="file" id="photo-file-input" accept="image/*" class="hidden" multiple/>

<!-- CROP MODAL OVERLAY -->
<div id="crop-modal" class="fixed inset-0 z-50 hidden flex flex-col items-center justify-between bg-black/90 backdrop-blur-md p-4 transition-all duration-300">
  <div class="w-full max-w-md flex items-center justify-between py-2 text-white">
    <span class="font-bold text-[16px] flex items-center gap-1.5"><span class="material-symbols-outlined text-[20px] text-pink-400">crop</span> Frame Your Photo</span>
    <button onclick="cancelCrop()" class="w-9 h-9 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center text-white transition-colors">
      <span class="material-symbols-outlined text-[20px]">close</span>
    </button>
  </div>

  <!-- Crop Box Container -->
  <div class="w-full max-w-md flex-1 max-h-[65vh] flex items-center justify-center my-auto overflow-hidden rounded-2xl bg-black">
    <img id="crop-image" class="max-w-full max-h-full block" alt="Source for crop"/>
  </div>

  <!-- Modal Controls -->
  <div class="w-full max-w-md flex items-center gap-3 pt-3">
    <button onclick="cancelCrop()" type="button" class="flex-1 py-3.5 rounded-full bg-white/20 hover:bg-white/30 text-white font-semibold text-[14px] transition-colors">
      Cancel
    </button>
    <button id="confirm-crop-btn" onclick="confirmCrop()" type="button" class="flex-1 py-3.5 rounded-full bg-primary text-on-primary font-bold text-[14px] shadow-lg flex items-center justify-center gap-2 hover:bg-primary/90 active:scale-95 transition-all">
      <span class="material-symbols-outlined text-[18px]">check</span>
      Save Cropped Photo
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/scripts/supabase.js"></script>
<script>
  const MAX_PHOTOS = 6;
  let photos = []; // { file, previewUrl, blob, isCropped }
  let pendingFilesQueue = [];
  let cropper = null;
  let editingPhotoIndex = -1;

  (async () => {
    const ok = await requireAuth();
    if (!ok) { window.location.href = '/unimatch/auth/login.html'; return; }
    renderGrid();
  })();

  function renderGrid() {
    const grid = document.getElementById('photo-grid');
    grid.innerHTML = '';

    // Filled slots
    photos.forEach((photo, i) => {
      const slot = document.createElement('div');
      slot.className = 'relative aspect-[3/4] rounded-2xl overflow-hidden bg-surface-container shadow-md group border border-outline-variant/40';
      slot.innerHTML = `
        <img class="absolute inset-0 w-full h-full object-cover transition-transform duration-300 group-hover:scale-105 cursor-pointer" src="${photo.previewUrl}" onclick="reCropPhoto(${i})" alt="Photo ${i+1}"/>
        <div class="absolute top-2 left-2 bg-black/50 backdrop-blur-md rounded-full px-2 py-0.5 text-[10px] text-white font-medium flex items-center gap-1 cursor-pointer" onclick="reCropPhoto(${i})">
          <span class="material-symbols-outlined text-[12px]">crop</span> Crop
        </div>
        <button onclick="removePhoto(${i})" class="absolute bottom-2 right-2 w-8 h-8 rounded-full bg-black/60 hover:bg-red-600 backdrop-blur-md flex items-center justify-center text-white shadow-md hover:scale-110 transition-all">
          <span class="material-symbols-outlined text-[18px]">close</span>
        </button>
      `;
      grid.appendChild(slot);
    });

    // Empty slots (up to 6)
    const remaining = MAX_PHOTOS - photos.length;
    for (let i = 0; i < remaining; i++) {
      const slot = document.createElement('button');
      slot.className = 'relative aspect-[3/4] rounded-2xl border-2 border-dashed border-outline-variant hover:border-primary transition-colors flex flex-col items-center justify-center bg-surface-container-low group active:scale-[0.98] duration-200';
      slot.onclick = () => document.getElementById('photo-file-input').click();
      slot.innerHTML = `
        <div class="w-10 h-10 rounded-full bg-surface flex items-center justify-center text-primary shadow-sm group-hover:bg-primary group-hover:text-on-primary transition-colors mb-2">
          <span class="material-symbols-outlined text-[24px]">add</span>
        </div>
        <span class="text-[11px] font-semibold text-on-surface-variant group-hover:text-primary">Add Photo</span>
      `;
      grid.appendChild(slot);
    }
  }

  document.getElementById('photo-file-input').addEventListener('change', (e) => {
    const files = [...e.target.files];
    const available = MAX_PHOTOS - photos.length;
    pendingFilesQueue = files.slice(0, available);
    e.target.value = '';
    processNextFileInQueue();
  });

  function processNextFileInQueue() {
    if (pendingFilesQueue.length === 0) return;
    const file = pendingFilesQueue.shift();
    editingPhotoIndex = -1; // New photo mode
    openCropModal(file);
  }

  function reCropPhoto(index) {
    if (index < 0 || index >= photos.length) return;
    editingPhotoIndex = index;
    const photo = photos[index];
    openCropModal(photo.file || photo.blob || photo.previewUrl);
  }

  function openCropModal(fileSource) {
    const modal = document.getElementById('crop-modal');
    const image = document.getElementById('crop-image');

    const src = (typeof fileSource === 'string') ? fileSource : URL.createObjectURL(fileSource);
    image.src = src;
    modal.classList.remove('hidden');

    if (cropper) {
      cropper.destroy();
      cropper = null;
    }

    cropper = new Cropper(image, {
      aspectRatio: 3 / 4, // Ideal portrait aspect ratio for UniMatch card photos
      viewMode: 1,
      dragMode: 'move',
      autoCropArea: 0.95,
      restore: false,
      guides: true,
      center: true,
      highlight: false,
      cropBoxMovable: true,
      cropBoxResizable: true,
      toggleDragModeOnDblclick: false
    });
  }

  function cancelCrop() {
    const modal = document.getElementById('crop-modal');
    modal.classList.add('hidden');
    if (cropper) {
      cropper.destroy();
      cropper = null;
    }
    // Continue processing queue if adding multiple
    if (pendingFilesQueue.length > 0) {
      processNextFileInQueue();
    }
  }

  async function confirmCrop() {
    if (!cropper) return;
    const btn = document.getElementById('confirm-crop-btn');
    btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> Processing...`;
    btn.disabled = true;

    try {
      const canvas = cropper.getCroppedCanvas({
        width: 900,
        height: 1200,
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'high',
      });

      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
      const previewUrl = URL.createObjectURL(blob);
      const file = new File([blob], `photo_${Date.now()}.jpg`, { type: 'image/jpeg' });

      if (editingPhotoIndex >= 0) {
        // Update existing photo
        photos[editingPhotoIndex] = { file, previewUrl, blob, isCropped: true };
      } else {
        // Push new cropped photo
        photos.push({ file, previewUrl, blob, isCropped: true });
      }

      renderGrid();
      cancelCrop();
    } catch (err) {
      console.error("Crop error:", err);
      alert("Error cropping image: " + err.message);
    } finally {
      btn.innerHTML = `<span class="material-symbols-outlined text-[18px]">check</span> Save Cropped Photo`;
      btn.disabled = false;
    }
  }

  function removePhoto(index) {
    photos.splice(index, 1);
    renderGrid();
  }

  async function handleContinue() {
    if (photos.length < 1) {
      document.getElementById('error-msg').textContent = 'Please upload at least one photo.';
      document.getElementById('error-msg').classList.remove('hidden');
      return;
    }

    const btn = document.getElementById('continue-btn');
    btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> Uploading Photos...`;
    btn.disabled = true;

    try {
      const { data: { session } } = await supabase.auth.getSession();
      const userId = session.user.id;
      const urls = [];

      for (let i = 0; i < photos.length; i++) {
        const photo = photos[i];
        const path = `unimatch_photos/${userId}/photo_${i+1}.jpg`;
        const { error } = await supabase.storage.from('profile_photos').upload(path, photo.file, {
          upsert: true,
          contentType: 'image/jpeg'
        });
        if (!error) {
          const { data } = supabase.storage.from('profile_photos').getPublicUrl(path);
          urls.push(data.publicUrl);
        } else {
          console.warn("Storage upload error, using DataURL fallback:", error.message);
          const dataUrl = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (ev) => resolve(ev.target.result);
            reader.readAsDataURL(photo.file);
          });
          urls.push(dataUrl);
        }
      }

      await updateProfile({ profile_photos: JSON.stringify(urls) });
      window.location.href = '/unimatch/profile-setup/review.html';
    } catch (err) {
      console.error("Upload error:", err);
      alert("Error uploading photos: " + err.message);
      btn.textContent = 'Continue';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
