<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>UniMatch - Upload Photos</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "on-surface": "#1a1c1b", "surface-container": "#efeeec", "on-surface-variant": "#554245",
          "primary": "#5c0427", "outline-variant": "#dac0c4", "on-background": "#1a1c1b",
          "on-primary": "#ffffff", "surface": "#faf9f7", "background": "#faf9f7",
          "primary-container": "#7a1f3d", "surface-container-lowest": "#ffffff",
          "surface-container-low": "#f4f3f1", "outline": "#887275",
        },
        "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
        "spacing": { "stack-gap-md": "20px", "unit": "4px", "section-margin": "48px", "stack-gap-sm": "12px", "stack-gap-lg": "32px", "container-padding": "24px" },
        "fontFamily": { "button": ["Inter"], "body-lg": ["Inter"], "headline-lg-mobile": ["Inter"], "display": ["Inter"], "headline-lg": ["Inter"], "body-md": ["Inter"] },
        "fontSize": {
          "button": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
          "body-lg": ["17px", { "lineHeight": "26px", "fontWeight": "400" }],
          "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
          "display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
          "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
          "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "400" }]
        }
      }
    }
  }
</script>
<style>
  body { background-color: #faf9f7; color: #1a1c1b; min-height: max(884px, 100dvh); }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .icon-fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center pt-24 pb-32">

<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl flex justify-between items-center px-container-padding py-stack-gap-sm">
  <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center rounded-full hover:opacity-80 transition-opacity text-primary active:scale-95 duration-200 ease-in-out">
    <span class="material-symbols-outlined">arrow_back</span>
  </button>
  <h1 class="font-display text-display text-primary">UniMatch</h1>
  <button class="text-primary font-semibold font-button text-button hover:opacity-80 transition-opacity active:scale-95 duration-200 ease-in-out">Help</button>
</header>

<main class="w-full max-w-md px-container-padding flex flex-col flex-grow">
  <div class="mb-section-margin mt-stack-gap-lg">
    <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-gap-sm md:font-headline-lg md:text-headline-lg">Show your personality</h2>
    <p class="font-body-lg text-body-lg text-on-surface-variant">Upload 4-6 photos to show your community who you are.</p>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-3 gap-unit mb-section-margin" id="photo-grid">
    <!-- Slots 1-6 generated by JS -->
  </div>

  <div id="error-msg" class="hidden text-red-500 text-sm mb-4"></div>

  <div class="mt-auto">
    <button id="continue-btn" onclick="handleContinue()" class="w-full py-4 rounded-full bg-primary text-on-primary font-button text-button text-center hover:opacity-90 active:scale-[0.98] transition-all duration-200">
      Continue
    </button>
  </div>
</main>

<input type="file" id="photo-file-input" accept="image/*" class="hidden" multiple/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/scripts/supabase.js"></script>
<script>
  const MAX_PHOTOS = 6;
  let photos = []; // { file, previewUrl, uploaded: false }

  (async () => {
    const ok = await requireAuth();
    if (!ok) { window.location.href = '/unimatch/auth/login.html'; return; }
    renderGrid();
  })();

  function renderGrid() {
    const grid = document.getElementById('photo-grid');
    grid.innerHTML = '';

    // Filled slots
    photos.forEach((photo, i) => {
      const slot = document.createElement('div');
      slot.className = 'relative aspect-[3/4] rounded-lg overflow-hidden bg-surface-container shadow-[0_4px_30px_rgba(0,0,0,0.04)] group';
      slot.innerHTML = `
        <img class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" src="${photo.previewUrl}" alt="Photo ${i+1}"/>
        <button onclick="removePhoto(${i})" class="absolute bottom-2 right-2 w-8 h-8 rounded-full bg-surface/90 backdrop-blur-md flex items-center justify-center text-primary shadow-sm hover:scale-110 transition-transform">
          <span class="material-symbols-outlined text-[18px]">close</span>
        </button>
      `;
      grid.appendChild(slot);
    });

    // Empty slots (up to 6)
    const remaining = MAX_PHOTOS - photos.length;
    for (let i = 0; i < remaining; i++) {
      const slot = document.createElement('button');
      slot.className = 'relative aspect-[3/4] rounded-lg border-2 border-dashed border-outline-variant hover:border-primary transition-colors flex flex-col items-center justify-center bg-surface-container-low group active:scale-[0.98] duration-200';
      slot.onclick = () => document.getElementById('photo-file-input').click();
      slot.innerHTML = `
        <div class="w-10 h-10 rounded-full bg-surface flex items-center justify-center text-primary shadow-sm group-hover:bg-primary group-hover:text-on-primary transition-colors mb-2">
          <span class="material-symbols-outlined">add</span>
        </div>
      `;
      grid.appendChild(slot);
    }
  }

  document.getElementById('photo-file-input').addEventListener('change', (e) => {
    const files = [...e.target.files];
    const available = MAX_PHOTOS - photos.length;
    const toAdd = files.slice(0, available);
    toAdd.forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        photos.push({ file, previewUrl: ev.target.result, uploaded: false });
        renderGrid();
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  });

  function removePhoto(index) {
    photos.splice(index, 1);
    renderGrid();
  }

  async function handleContinue() {
    if (photos.length < 1) {
      document.getElementById('error-msg').textContent = 'Please upload at least one photo.';
      document.getElementById('error-msg').classList.remove('hidden');
      return;
    }

    const btn = document.getElementById('continue-btn');
    btn.textContent = 'Uploading...';
    btn.disabled = true;

    const { data: { session } } = await supabase.auth.getSession();
    const userId = session.user.id;
    const urls = [];

    for (let i = 0; i < photos.length; i++) {
      const photo = photos[i];
      const ext = photo.file.name.split('.').pop();
      const path = `unimatch_photos/${userId}/photo_${i+1}.${ext}`;
      const { error } = await supabase.storage.from('profile_photos').upload(path, photo.file, { upsert: true });
      if (!error) {
        const { data } = supabase.storage.from('profile_photos').getPublicUrl(path);
        urls.push(data.publicUrl);
      }
    }

    await supabase.from('profiles').update({ profile_photos: JSON.stringify(urls) }).eq('id', userId);
    window.location.href = '/unimatch/profile-setup/review.html';
  }
</script>
</body></html>
