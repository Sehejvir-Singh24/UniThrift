<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>UniMatch - Select Interests</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "on-surface": "#1a1c1b", "surface-container": "#efeeec", "on-surface-variant": "#554245",
          "primary": "#5c0427", "outline-variant": "#dac0c4", "on-background": "#1a1c1b",
          "on-primary": "#ffffff", "surface": "#faf9f7", "background": "#faf9f7",
          "primary-container": "#7a1f3d", "surface-container-lowest": "#ffffff", "outline": "#887275",
        },
        "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
        "spacing": { "stack-gap-md": "20px", "unit": "4px", "section-margin": "48px", "stack-gap-sm": "12px", "stack-gap-lg": "32px", "container-padding": "24px" },
        "fontFamily": { "button": ["Inter"], "label-caps": ["Inter"], "body-lg": ["Inter"], "title-md": ["Inter"], "headline-lg-mobile": ["Inter"], "display": ["Inter"], "headline-lg": ["Inter"], "body-md": ["Inter"] },
        "fontSize": {
          "button": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
          "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
          "body-lg": ["17px", { "lineHeight": "26px", "fontWeight": "400" }],
          "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "500" }],
          "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
          "display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
          "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
          "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "400" }]
        }
      }
    }
  }
</script>
<style>
  body { background-color: #faf9f7; color: #1a1c1b; min-height: max(884px, 100dvh); }
  .chip { transition: all 0.2s ease-in-out; cursor: pointer; }
  .chip:active { transform: scale(0.98); }
  .chip.selected { background-color: #7a1f3d; color: #ff8ba8; border-color: #7a1f3d; }
  .chip.unselected { background-color: transparent; color: #1a1c1b; border: 1px solid #dac0c4; }
  .chip.unselected:hover { border-color: #5c0427; }
  .search-input:focus { border-color: #5c0427; outline: none; box-shadow: 0 0 0 1px #5c0427; }
</style>
</head>
<body class="min-h-screen flex flex-col font-body-lg text-body-lg antialiased">

<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl">
  <div class="flex justify-between items-center px-container-padding py-stack-gap-sm">
    <button aria-label="Go back" onclick="history.back()" class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 duration-200 ease-in-out flex items-center justify-center p-2 -ml-2">
      <span class="material-symbols-outlined text-2xl">arrow_back</span>
    </button>
    <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary text-center flex-1">UniMatch</h1>
    <button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 font-button text-button p-2 -mr-2">Help</button>
  </div>
</header>

<main class="flex-grow pt-24 px-container-padding pb-32 md:pb-48 md:max-w-3xl md:mx-auto md:w-full">
  <div class="mb-section-margin">
    <h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-unit text-center md:text-left">What do you love?</h2>
    <p class="text-on-surface-variant text-center md:text-left">Select a few interests to help us find better connections for you.</p>
  </div>

  <!-- Search -->
  <div class="relative mb-section-margin">
    <span class="material-symbols-outlined absolute left-4 top-1/2 transform -translate-y-1/2 text-on-surface-variant">search</span>
    <input id="search-input" class="search-input w-full bg-surface-container-lowest border border-outline-variant rounded-full py-3 pl-12 pr-4 text-on-surface placeholder-on-surface-variant transition-colors" placeholder="Search interests..." type="text" oninput="filterInterests()"/>
  </div>

  <!-- Categories -->
  <div class="space-y-stack-gap-lg" id="categories-container">
    <!-- Academic -->
    <div class="category-block">
      <h3 class="font-title-md text-title-md text-on-surface mb-stack-gap-sm">Academic</h3>
      <div class="flex flex-wrap gap-3">
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Computer Science</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Literature</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Philosophy</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Engineering</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Mathematics</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">History</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Biology</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Psychology</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Economics</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Law</button>
      </div>
    </div>

    <!-- Lifestyle -->
    <div class="category-block">
      <h3 class="font-title-md text-title-md text-on-surface mb-stack-gap-sm">Lifestyle</h3>
      <div class="flex flex-wrap gap-3">
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Coffee Shops</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Yoga</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Minimalism</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Travel</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Museums</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Thrifting</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Cooking</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Fitness</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Meditation</button>
      </div>
    </div>

    <!-- Hobbies -->
    <div class="category-block">
      <h3 class="font-title-md text-title-md text-on-surface mb-stack-gap-sm">Hobbies</h3>
      <div class="flex flex-wrap gap-3">
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Photography</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Reading</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Creative Writing</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Chess</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Painting</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Film</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Podcasts</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Music</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Gaming</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Dance</button>
      </div>
    </div>

    <!-- Tech -->
    <div class="category-block">
      <h3 class="font-title-md text-title-md text-on-surface mb-stack-gap-sm">Tech & Culture</h3>
      <div class="flex flex-wrap gap-3">
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Startups</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">AI / ML</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Design</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Open Source</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Debate</button>
        <button class="chip unselected rounded-full px-5 py-2 font-button text-button" onclick="toggleChip(this)">Hackathons</button>
      </div>
    </div>
  </div>
</main>

<div class="fixed bottom-0 w-full bg-surface/90 backdrop-blur-2xl shadow-[0_-4px_30px_rgba(0,0,0,0.04)] px-container-padding py-stack-gap-md z-40">
  <div class="md:max-w-3xl md:mx-auto">
    <button id="continueBtn" onclick="handleContinue()" class="w-full md:w-auto bg-primary text-on-primary rounded-full py-4 px-8 font-button text-button shadow-[0_8px_30px_rgba(92,4,39,0.15)] hover:bg-primary/90 transition-colors active:scale-95 duration-200 ease-in-out">
      Continue
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/scripts/supabase.js"></script>
<script>
  (async () => {
    const ok = await requireAuth();
    if (!ok) { window.location.href = '/unimatch/auth/login.html'; return; }

    const profile = await getProfile();
    if (profile && profile.interests) {
      const saved = JSON.parse(profile.interests || '[]');
      document.querySelectorAll('.chip').forEach(chip => {
        if (saved.includes(chip.textContent.trim())) {
          chip.classList.remove('unselected');
          chip.classList.add('selected');
        }
      });
    }
  })();

  function toggleChip(chip) {
    if (chip.classList.contains('selected')) {
      chip.classList.remove('selected');
      chip.classList.add('unselected');
    } else {
      chip.classList.remove('unselected');
      chip.classList.add('selected');
    }
  }

  function filterInterests() {
    const query = document.getElementById('search-input').value.toLowerCase();
    document.querySelectorAll('.chip').forEach(chip => {
      const match = chip.textContent.toLowerCase().includes(query);
      chip.style.display = match ? '' : 'none';
    });
    document.querySelectorAll('.category-block').forEach(block => {
      const visibleChips = [...block.querySelectorAll('.chip')].some(c => c.style.display !== 'none');
      block.style.display = visibleChips ? '' : 'none';
    });
  }

  async function handleContinue() {
    const selected = [...document.querySelectorAll('.chip.selected')].map(c => c.textContent.trim());
    if (selected.length === 0) return;

    const btn = document.getElementById('continueBtn');
    btn.textContent = 'Saving...';
    btn.disabled = true;

    const { data: { session } } = await supabase.auth.getSession();
    await supabase.from('profiles').update({ interests: JSON.stringify(selected) }).eq('id', session.user.id);
    window.location.href = '/unimatch/profile-setup/photos.html';
  }
</script>
</body></html>
