<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>UniMatch – Verification Pending</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "um-primary": "#5c0427",
            "um-on-primary": "#ffffff",
            "um-surface": "#faf9f7",
            "um-surface-container": "#efeeec",
            "um-surface-container-lowest": "#ffffff",
            "um-on-surface": "#1a1c1b",
            "um-on-surface-variant": "#554245",
            "um-outline": "#887275",
            "um-outline-variant": "#dac0c4",
          },
        }
      }
    }
  </script>
  <style>
    body { overscroll-behavior: none; font-family: 'Inter', sans-serif; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 24px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    @keyframes pulse-ring {
      0%   { transform: scale(1); opacity: 0.4; }
      70%  { transform: scale(1.3); opacity: 0; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .pulse-ring {
      animation: pulse-ring 2s ease-out infinite;
    }
  </style>
<link rel=stylesheet href=/styles/site-motion.css><script src=/scripts/site-motion.js defer></script></head>
<body class="bg-um-surface min-h-screen flex flex-col items-center justify-center pt-safe pb-safe px-6 text-center gap-8">

  <!-- Animated hourglass icon -->
  <div class="relative flex items-center justify-center">
    <div class="absolute w-24 h-24 rounded-full border-2 border-um-primary/30 pulse-ring"></div>
    <div class="w-20 h-20 rounded-full bg-um-surface-container flex items-center justify-center">
      <span class="material-symbols-outlined text-um-primary text-[40px]">hourglass_empty</span>
    </div>
  </div>

  <!-- Text -->
  <div class="flex flex-col gap-3 max-w-xs">
    <h1 class="text-[32px] font-semibold text-um-on-surface leading-tight tracking-tight">Under Review</h1>
    <p class="text-[15px] text-um-on-surface-variant leading-relaxed">
      Your student ID is being reviewed by our team. This usually takes under <strong class="text-um-on-surface">24 hours</strong>.
    </p>
  </div>

  <!-- Status card -->
  <div class="w-full max-w-sm bg-um-surface-container-lowest rounded-3xl p-5 border border-um-outline-variant/40 flex flex-col gap-3 text-left">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-um-primary/10 flex items-center justify-center">
        <span class="material-symbols-outlined text-um-primary text-[18px]" style="font-variation-settings:'FILL' 1;">check_circle</span>
      </div>
      <div>
        <p class="font-semibold text-um-on-surface text-[14px]">Signed in</p>
        <p class="text-[12px] text-um-on-surface-variant">Account created</p>
      </div>
    </div>
    <div class="ml-4 w-px h-4 bg-um-outline-variant"></div>
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-um-primary/10 flex items-center justify-center">
        <span class="material-symbols-outlined text-um-primary text-[18px]" style="font-variation-settings:'FILL' 1;">upload_file</span>
      </div>
      <div>
        <p class="font-semibold text-um-on-surface text-[14px]">ID submitted</p>
        <p class="text-[12px] text-um-on-surface-variant">Awaiting review</p>
      </div>
    </div>
    <div class="ml-4 w-px h-4 bg-um-outline-variant"></div>
    <div class="flex items-center gap-3 opacity-40">
      <div class="w-8 h-8 rounded-full bg-um-surface-container flex items-center justify-center">
        <span class="material-symbols-outlined text-um-outline text-[18px]">verified</span>
      </div>
      <div>
        <p class="font-semibold text-um-on-surface-variant text-[14px]">Verified</p>
        <p class="text-[12px] text-um-on-surface-variant">Pending approval</p>
      </div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="w-full max-w-sm flex flex-col gap-3">
    <button
      id="check-btn"
      onclick="checkStatus()"
      class="w-full h-[56px] bg-um-primary text-um-on-primary text-[16px] font-semibold rounded-full flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
      style="box-shadow: 0 4px 16px rgba(92,4,39,0.2);"
    >
      <span id="check-btn-text">Check Status</span>
      <span id="check-btn-icon" class="material-symbols-outlined text-[20px]">refresh</span>
    </button>

    <button
      onclick="window.location.href='/index.html'"
      class="w-full h-[52px] bg-um-surface-container text-um-on-surface-variant text-[15px] font-medium rounded-full flex items-center justify-center active:scale-[0.98] transition-transform"
    >
      Browse UniThrift while you wait
    </button>

    <button onclick="signOut()" class="text-[13px] text-um-outline font-medium py-2">Sign out</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/scripts/supabase.js"></script>
  <script>
    async function checkStatus() {
      const btn = document.getElementById('check-btn');
      const btnText = document.getElementById('check-btn-text');
      const btnIcon = document.getElementById('check-btn-icon');

      btn.classList.add('opacity-60', 'pointer-events-none');
      btnText.textContent = 'Checking...';
      btnIcon.classList.add('animate-spin');

      if (typeof clearProfileCache === 'function') clearProfileCache();
      let profile = await getProfile(true);

      setTimeout(() => {
        btnIcon.classList.remove('animate-spin');
        btn.classList.remove('opacity-60', 'pointer-events-none');

        const isApproved = profile && (profile.is_verified || profile.unimatch_verification_status === 'verified' || profile.verification_status === 'verified' || profile.role === 'admin');
        const isRejected = profile && (profile.unimatch_verification_status === 'rejected' || profile.verification_status === 'rejected');

        if (isApproved) {
          window.location.href = '/unimatch/auth/verified.html';
        } else if (isRejected) {
          window.location.href = '/unimatch/auth/verify.html?rejected=true';
        } else {
          btnText.textContent = 'Still Pending';
          setTimeout(() => { btnText.textContent = 'Check Status'; }, 2500);
        }
      }, 1200);
    }

    async function signOut() {
      await supabase.auth.signOut();
      window.location.href = '/unimatch/welcome.html';
    }

    // Auto-check on load
    (async () => {
      const ok = await requireAuth();
      if (!ok) { window.location.href = '/unimatch/auth/login.html'; return; }

      const profile = await getProfile(true);
      if (profile && profile.is_verified) {
        window.location.href = '/unimatch/auth/verified.html';
      }
    })();
  </script>
</body>
</html>
