<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>UniMatch – Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "um-primary": "#5c0427",
            "um-primary-container": "#7a1f3d",
            "um-on-primary": "#ffffff",
            "um-surface": "#faf9f7",
            "um-surface-container": "#efeeec",
            "um-surface-container-low": "#f4f3f1",
            "um-surface-container-lowest": "#ffffff",
            "um-on-surface": "#1a1c1b",
            "um-on-surface-variant": "#554245",
            "um-outline": "#887275",
            "um-outline-variant": "#dac0c4",
            "um-error": "#ba1a1a",
            "um-error-container": "#ffdad6",
          },
        }
      }
    }
  </script>
  <style>
    body { overscroll-behavior: none; font-family: 'Inter', sans-serif; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 24px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
  </style>
</head>
<body class="bg-um-surface min-h-screen flex flex-col pt-safe">

  <!-- Back Button -->
  <div class="px-4 pt-4 pb-2">
    <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center rounded-full bg-um-surface-container active:scale-95 transition-transform">
      <span class="material-symbols-outlined text-um-on-surface-variant text-[22px]">arrow_back</span>
    </button>
  </div>

  <!-- Main content -->
  <div class="flex flex-col flex-1 px-6 justify-center gap-10 pb-safe" style="padding-bottom: max(env(safe-area-inset-bottom), 32px);">

    <!-- Brand -->
    <div class="flex flex-col gap-3">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-um-primary text-[28px]" style="font-variation-settings:'FILL' 1;">school</span>
        <span class="font-semibold text-um-primary text-[20px] tracking-tight">UniMatch</span>
      </div>
      <div>
        <h1 id="page-title" class="text-[34px] font-semibold text-um-on-surface leading-tight tracking-tight">Welcome back.</h1>
        <p id="page-subtitle" class="text-[15px] text-um-on-surface-variant mt-1 leading-relaxed">Sign in to continue your journey with UniMatch.</p>
      </div>
    </div>

    <!-- Auth Card -->
    <div class="flex flex-col gap-4">

      <!-- Error banner -->
      <div id="auth-error" class="hidden bg-um-error-container text-um-error text-[13px] font-medium px-4 py-3 rounded-2xl"></div>

      <!-- Google Button (primary) -->
      <button
        id="google-btn"
        onclick="handleGoogleSignIn()"
        class="w-full h-[56px] bg-um-surface-container-lowest border border-um-outline-variant rounded-full flex items-center justify-center gap-3 text-um-on-surface font-semibold text-[16px] active:scale-[0.98] transition-transform shadow-sm"
      >
        <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        <span id="google-btn-text">Continue with Google</span>
      </button>

      <!-- Divider -->
      <div class="flex items-center gap-3">
        <div class="flex-1 h-px bg-um-outline-variant"></div>
        <span class="text-[12px] text-um-outline font-medium">or sign in with email</span>
        <div class="flex-1 h-px bg-um-outline-variant"></div>
      </div>

      <!-- Email/Password form -->
      <div id="email-form" class="flex flex-col gap-3">
        <div class="relative">
          <input
            id="email-input"
            type="email"
            placeholder="your@email.com"
            autocomplete="email"
            class="w-full h-[52px] px-4 pr-12 rounded-2xl bg-um-surface-container border border-um-outline-variant text-um-on-surface text-[15px] focus:outline-none focus:border-um-primary transition-colors placeholder:text-um-outline"
          />
          <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-um-outline text-[20px]">mail</span>
        </div>
        <div class="relative">
          <input
            id="password-input"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            class="w-full h-[52px] px-4 pr-12 rounded-2xl bg-um-surface-container border border-um-outline-variant text-um-on-surface text-[15px] focus:outline-none focus:border-um-primary transition-colors placeholder:text-um-outline"
          />
          <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-um-outline text-[20px]">lock</span>
        </div>
        <button
          id="email-btn"
          onclick="handleEmailLogin()"
          class="w-full h-[52px] bg-um-primary text-um-on-primary text-[16px] font-semibold rounded-full flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
          style="box-shadow: 0 4px 16px rgba(92,4,39,0.2);"
        >
          <span id="email-btn-text">Sign In</span>
          <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
        </button>
      </div>

      <!-- OTP verify form -->
      <div id="otp-form" class="hidden flex flex-col gap-3">
        <p id="otp-subtitle-um" class="text-[13px] text-um-on-surface-variant text-center">We sent a 6-digit verification code to your email.</p>
        <div class="relative">
          <input
            id="otp-input-um"
            type="text"
            placeholder="000000"
            maxlength="6"
            class="w-full h-[52px] px-4 text-center font-bold tracking-[0.5em] rounded-2xl bg-um-surface-container border border-um-outline-variant text-um-on-surface text-[18px] focus:outline-none focus:border-um-primary transition-colors"
          />
        </div>
        <button
          id="otp-btn-um"
          onclick="handleOtpVerifyUniMatch()"
          class="w-full h-[52px] bg-um-primary text-um-on-primary text-[16px] font-semibold rounded-full flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
          style="box-shadow: 0 4px 16px rgba(92,4,39,0.2);"
        >
          <span id="otp-btn-text-um">Verify &amp; Continue</span>
          <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
        </button>
        <button type="button" onclick="cancelOtpUniMatch()" class="text-[13px] text-um-primary font-semibold text-center mt-1 hover:underline">
          Back to sign in
        </button>
      </div>

    </div>

    <!-- Footer -->
    <p class="text-center text-[11px] text-um-outline leading-relaxed">
      By continuing, you agree to UniMatch's
      <a href="#" class="underline underline-offset-2">Terms of Service</a> &amp;
      <a href="#" class="underline underline-offset-2">Privacy Policy</a>
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/scripts/supabase.js"></script>
  <script src="/scripts/auth-client.js"></script>
  <script>
    // Read ?mode param
    let isSignUp = false;
    let pendingEmail = '';
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'signup') {
      isSignUp = true;
      document.getElementById('page-title').textContent = 'Create account.';
      document.getElementById('page-subtitle').textContent = 'Join the exclusive student community.';
      document.getElementById('email-btn-text').textContent = 'Sign Up';
    }

    // On load: if already authenticated, route accordingly
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session && !AuthClient.getToken()) return;
      await routeAfterAuth();
    })();

    // Listen for OAuth callback
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN' && session) {
        await routeAfterAuth();
      }
    });

    async function routeAfterAuth() {
      if (typeof clearProfileCache === 'function') clearProfileCache();
      const user = AuthClient.getUser();
      const profile = user || (typeof getProfile === 'function' ? await getProfile(false) : null);
      if (!profile) return;

      if (!profile.is_verified) {
        window.location.href = '/unimatch/auth/verify.html';
        return;
      }
      if (!profile.instagram_username) {
        window.location.href = '/unimatch/auth/instagram.html';
        return;
      }
      if (!profile.unimatch_profile_complete) {
        window.location.href = '/unimatch/profile-setup/basic-info.html';
        return;
      }
      window.location.href = '/unimatch/discover.html';
    }

    async function handleGoogleSignIn() {
      const btn = document.getElementById('google-btn');
      const btnText = document.getElementById('google-btn-text');
      btn.classList.add('opacity-60', 'pointer-events-none');
      btnText.textContent = 'Redirecting to Google...';

      try {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + '/unimatch/auth/login.html' }
        });
        if (error) throw error;
      } catch (err) {
        showError('Google sign-in failed. Please try again.');
        btn.classList.remove('opacity-60', 'pointer-events-none');
        btnText.textContent = 'Continue with Google';
      }
    }

    let pendingPassword = '';

    async function handleEmailLogin() {
      clearError();
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      if (!email || !email.includes('@')) {
        showError('Please enter a valid email address.');
        return;
      }

      const btn = document.getElementById('email-btn');
      const btnText = document.getElementById('email-btn-text');
      const originalText = btnText.textContent;
      
      btn.classList.add('opacity-60', 'pointer-events-none');
      btnText.textContent = 'Sending OTP code...';

      try {
        await AuthClient.sendOtp(email);
        pendingEmail = email;
        pendingPassword = password;

        document.getElementById('email-form').classList.add('hidden');
        document.getElementById('otp-form').classList.remove('hidden');
        document.getElementById('otp-subtitle-um').textContent = `We sent a 6-digit verification code to ${email}`;
        document.getElementById('otp-input-um').value = '';
        document.getElementById('otp-input-um').focus();
      } catch (err) {
        showError('Failed to send OTP code: ' + (err.message || 'Server error.'));
      } finally {
        btn.classList.remove('opacity-60', 'pointer-events-none');
        btnText.textContent = originalText;
      }
    }

    async function handleOtpVerifyUniMatch() {
      clearError();
      const otpCode = document.getElementById('otp-input-um').value.trim();
      if (!otpCode || otpCode.length !== 6) {
        showError('Please enter the 6-digit verification code.');
        return;
      }

      const btn = document.getElementById('otp-btn-um');
      const btnText = document.getElementById('otp-btn-text-um');
      const originalText = btnText.textContent;
      btn.classList.add('opacity-60', 'pointer-events-none');
      btnText.textContent = 'Verifying...';

      try {
        const data = await AuthClient.verifyOtp(pendingEmail || document.getElementById('email-input').value.trim(), otpCode);
        console.log('UniMatch OTP Verified:', data);

        if (pendingPassword) {
          try {
            if (isSignUp) {
              await supabase.auth.signUp({ email: pendingEmail, password: pendingPassword });
            } else {
              await supabase.auth.signInWithPassword({ email: pendingEmail, password: pendingPassword });
            }
          } catch (sErr) { console.log('Supabase auth note:', sErr); }
        }

        await routeAfterAuth();
      } catch (err) {
        showError(err.message || 'Invalid or expired OTP code.');
        btn.classList.remove('opacity-60', 'pointer-events-none');
        btnText.textContent = originalText;
      }
    }

    function cancelOtpUniMatch() {
      document.getElementById('otp-form').classList.add('hidden');
      document.getElementById('email-form').classList.remove('hidden');
      clearError();
    }

    function showError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function clearError() {
      document.getElementById('auth-error').classList.add('hidden');
    }
  </script>
  <script src="/scripts/support-widget.js" defer></script>
</body>
</html>
