<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Chat - UniMatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preconnect" href="https://bwhvbynmqubjwgonsywd.supabase.co"/>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@400,0..1&display=swap" rel="stylesheet"/>
<link href="/unimatch/unimatch-theme.css" rel="stylesheet"/>
<style>
  body {
    font-family: var(--um-font-body);
    background: var(--um-bg);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-header {
    height: 68px;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--um-border);
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    padding: 0 16px;
    justify-content: space-between;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 84px 16px 90px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
    -webkit-overflow-scrolling: touch;
  }

  .chat-input-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--um-border);
    padding: 10px 16px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 680px;
    margin: 0 auto;
  }

  .msg-bubble-sent {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--um-primary), #8B6B8A);
    color: white;
    border-radius: 20px 20px 4px 20px;
    padding: 12px 16px;
    max-width: 78%;
    box-shadow: 0 4px 14px rgba(176, 80, 112, 0.25);
    word-break: break-word;
    position: relative;
    animation: pop-in 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .msg-bubble-recv {
    align-self: flex-start;
    background: rgba(255, 255, 255, 0.92);
    color: var(--um-text);
    border-radius: 20px 20px 20px 4px;
    padding: 12px 16px;
    max-width: 78%;
    border: 1px solid var(--um-border);
    box-shadow: 0 4px 14px var(--um-shadow-card);
    word-break: break-word;
    position: relative;
    animation: pop-in 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes pop-in {
    0% { opacity: 0; transform: scale(0.95) translateY(6px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .msg-time {
    font-size: 10px;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 3px;
    opacity: 0.8;
  }

  .msg-bubble-sent .msg-time {
    justify-content: flex-end;
    color: rgba(255, 255, 255, 0.85);
  }

  .msg-bubble-recv .msg-time {
    justify-content: flex-start;
    color: var(--um-text-muted);
  }

  .icebreaker-chip {
    background: rgba(176, 80, 112, 0.08);
    border: 1px solid rgba(176, 80, 112, 0.2);
    color: var(--um-primary);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .icebreaker-chip:hover {
    background: var(--um-primary);
    color: white;
  }
</style>
</head>
<body>

<!-- Chat Header -->
<header class="chat-header">
  <div style="display:flex;align-items:center;gap:12px;">
    <button onclick="history.back()" style="background:transparent;border:none;color:var(--um-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px;margin-left:-6px;">
      <span class="material-symbols-outlined" style="font-size:24px;">arrow_back</span>
    </button>
    
    <div style="position:relative;width:42px;height:42px;border-radius:50%;overflow:hidden;border:2px solid var(--um-primary);flex-shrink:0;">
      <img id="partner-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&q=80" alt="Partner" style="width:100%;height:100%;object-fit:cover;"/>
      <div style="position:absolute;bottom:0;right:0;width:10px;height:10px;background:#22c55e;border-radius:50%;border:2px solid white;"></div>
    </div>

    <div>
      <div style="display:flex;align-items:center;gap:4px;">
        <h3 id="partner-name" style="font-size:16px;font-weight:700;color:var(--um-text);margin:0;">Student Partner</h3>
        <span class="material-symbols-outlined" style="font-size:15px;color:var(--um-primary);font-variation-settings:'FILL' 1;">verified</span>
      </div>
      <p id="partner-subtext" style="font-size:11px;color:var(--um-text-muted);margin:1px 0 0;">GGSIPU Campus</p>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:6px;">
    <span style="font-size:10px;font-weight:700;letter-spacing:0.04em;background:rgba(34,197,94,0.12);color:#16a34a;padding:4px 10px;border-radius:12px;display:flex;align-items:center;gap:4px;">
      <span class="material-symbols-outlined" style="font-size:13px;">lock</span>
      Private & Verified
    </span>
  </div>
</header>

<!-- Chat Messages Scroll Area -->
<main class="chat-messages" id="chat-messages-container">
  
  <!-- Match Welcome Header Banner -->
  <div style="background:linear-gradient(135deg, rgba(176,80,112,0.12), rgba(139,107,138,0.12));border:1px solid rgba(176,80,112,0.25);border-radius:24px;padding:18px 20px;text-align:center;margin-bottom:8px;display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:48px;height:48px;border-radius:50%;background:var(--um-primary-dim);display:flex;align-items:center;justify-content:center;color:var(--um-primary);border:2px solid var(--um-primary);">
      <span class="material-symbols-outlined" style="font-size:24px;font-variation-settings:'FILL' 1;">favorite</span>
    </div>
    <h4 style="font-size:16px;font-weight:700;color:var(--um-primary);margin:0;">You & <span id="welcome-partner-name">Partner</span> Matched! 💕</h4>
    <p style="font-size:12px;color:var(--um-text-muted);margin:0;max-width:340px;">
      Start chatting on UniMatch! All chat connections are private, student-verified, and secure.
    </p>
  </div>

  <!-- Icebreaker Suggestions Horizontal Bar -->
  <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;" class="hide-scrollbar">
    <div onclick="sendIcebreaker('Skipping lectures today, where on campus would we hide out? ☕')" class="icebreaker-chip">
      <span class="material-symbols-outlined" style="font-size:14px;">forum</span> Skipping lectures spot?
    </div>
    <div onclick="sendIcebreaker('Best coffee or canteen spot on campus? 🥐')" class="icebreaker-chip">
      <span class="material-symbols-outlined" style="font-size:14px;">local_cafe</span> Best coffee spot?
    </div>
    <div onclick="sendIcebreaker('What\'s your favorite music playlist while studying? 🎧')" class="icebreaker-chip">
      <span class="material-symbols-outlined" style="font-size:14px;">headphones</span> Study playlist?
    </div>
  </div>

  <!-- Dynamic Chat Messages Loop -->
  <div id="messages-list" style="display:flex;flex-direction:column;gap:10px;">
    <!-- Rendered via JS -->
  </div>

</main>

<!-- Bottom Input Bar -->
<div class="chat-input-bar">
  <input type="text" id="chat-input" placeholder="Type a message..." style="flex:1;background:var(--um-bg-alt);border:1px solid var(--um-border);border-radius:24px;padding:12px 18px;font-size:14px;outline:none;color:var(--um-text);font-family:var(--um-font-body);" onkeydown="if(event.key==='Enter') handleSendMessage()"/>
  
  <button onclick="handleSendMessage()" id="send-btn" style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg, var(--um-primary), #8B6B8A);border:none;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(176,80,112,0.3);transition:transform 0.18s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
    <span class="material-symbols-outlined" style="font-size:20px;">send</span>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/scripts/supabase.js"></script>
<script src="/unimatch/chat-engine.js"></script>
<script>
  let _currentUserId = null;
  let _partnerId = null;
  let _partnerProfile = null;
  let _messages = [];
  let _pollingTimer = null;

  const DEFAULT_AVATAR = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&q=80";

  (async () => {
    // 1. Check Auth & Params
    const urlParams = new URLSearchParams(window.location.search);
    _partnerId = urlParams.get('partner_id') || urlParams.get('user_id');

    let profile = null;
    try {
      profile = await requireUniMatchAuth();
    } catch(e) {}

    if (!profile) {
      profile = (() => {
        try {
          const stored = localStorage.getItem('unithrift_user') || sessionStorage.getItem('unimatch_cached_profile');
          if (stored) return JSON.parse(stored);
        } catch(e) {}
        return {
          id: 'demo-current-user',
          full_name: 'Campus Student',
          university: 'GGSIPU'
        };
      })();
    }

    _currentUserId = profile.id;

    if (!_partnerId) {
      // Default to demo partner if none provided in URL
      _partnerId = 'demo-aarav-001';
    }

    // 2. Fetch Partner Profile
    await loadPartnerProfile();

    // 3. Load Chat Messages
    await loadChatMessages();

    // 4. Start polling every 2 seconds for new messages
    _pollingTimer = setInterval(loadChatMessages, 2000);
  })();

  async function loadPartnerProfile() {
    if (!_partnerId) return;

    // Check fallback demo profiles map first
    const FALLBACK_MAP = {
      'demo-aarav-001': { full_name: 'Aarav Sharma', major: 'Computer Science', year_of_study: '3rd Year', avatar_url: 'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=400&q=80' },
      'demo-ananya-002': { full_name: 'Ananya Verma', major: 'Business Admin', year_of_study: '2nd Year', avatar_url: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&q=80' },
      'demo-rohan-003': { full_name: 'Rohan Mehta', major: 'Electronics & Comm', year_of_study: '4th Year', avatar_url: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400&q=80' },
      'demo-priya-004': { full_name: 'Priya Nair', major: 'Journalism', year_of_study: '3rd Year', avatar_url: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400&q=80' },
      'demo-kabir-005': { full_name: 'Kabir Malhotra', major: 'Mechanical Eng', year_of_study: '2nd Year', avatar_url: 'https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=400&q=80' }
    };

    if (FALLBACK_MAP[_partnerId]) {
      _partnerProfile = FALLBACK_MAP[_partnerId];
    } else if (window.supabase) {
      try {
        const { data } = await supabase.from('profiles').select('*').eq('id', _partnerId).single();
        if (data) _partnerProfile = data;
      } catch(e) {}
    }

    if (!_partnerProfile) {
      _partnerProfile = {
        full_name: 'Matched Student',
        major: 'GGSIPU Campus',
        avatar_url: DEFAULT_AVATAR
      };
    }

    // Update Header DOM
    document.getElementById('partner-name').textContent = _partnerProfile.full_name || 'Matched Student';
    if (document.getElementById('welcome-partner-name')) {
      document.getElementById('welcome-partner-name').textContent = _partnerProfile.full_name || 'Partner';
    }
    const subtext = [_partnerProfile.major, _partnerProfile.year_of_study || _partnerProfile.university].filter(Boolean).join(' • ');
    document.getElementById('partner-subtext').textContent = subtext || 'GGSIPU Student';

    let avatar = _partnerProfile.avatar_url;
    if (!avatar && _partnerProfile.profile_photos) {
      try {
        const photos = typeof _partnerProfile.profile_photos === 'string' ? JSON.parse(_partnerProfile.profile_photos) : _partnerProfile.profile_photos;
        if (photos && photos.length > 0) avatar = photos[0];
      } catch(e) {}
    }
    document.getElementById('partner-avatar').src = avatar || DEFAULT_AVATAR;
    document.getElementById('chat-input').placeholder = `Message ${(_partnerProfile.full_name || 'Student').split(' ')[0]}...`;
  }

  async function loadChatMessages() {
    if (!_currentUserId || !_partnerId) return;

    _messages = await UniMatchChatEngine.getMessages(_currentUserId, _partnerId);

    // If no messages exist yet, send default greeting seed message if in demo mode
    if (_messages.length === 0 && _partnerId.startsWith('demo-')) {
      const demoGreets = {
        'demo-aarav-001': "Hey! Saw we matched. Building any cool projects or skipping lectures today? ☕",
        'demo-ananya-002': "Hey there! Happy we matched 😊 What's your favorite coffee spot around campus?",
        'demo-rohan-003': "Hey! Awesome to connect. Up for a campus study session or gym hit?",
        'demo-priya-004': "Hi! Excited we matched 💕 Have you checked out the campus library recently?",
        'demo-kabir-005': "Hey! What's up? Ready to skip lectures for some street food? 🎸"
      };
      const greetText = demoGreets[_partnerId] || "Hey! Happy we matched on UniMatch 💕";
      
      const seedMsg = await UniMatchChatEngine.sendMessage(_partnerId, _currentUserId, greetText);
      _messages = [seedMsg];
    }

    renderMessages();
  }

  function renderMessages() {
    const container = document.getElementById('messages-list');
    if (!container) return;

    if (_messages.length === 0) {
      container.innerHTML = `
        <div style="text-align:center;padding:20px;font-size:13px;color:var(--um-text-muted);">
          No messages yet. Say hi to start the conversation! 👋
        </div>
      `;
      return;
    }

    let totalOrigBytes = 0;
    let totalCompBytes = 0;

    container.innerHTML = _messages.map(m => {
      const isMine = m.sender_id === _currentUserId;
      const timeStr = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      
      return `
        <div class="${isMine ? 'msg-bubble-sent' : 'msg-bubble-recv'}">
          <div style="font-size:14px;line-height:1.45;">${escapeHTML(m.text)}</div>
          <div class="msg-time">
            <span>${timeStr}</span>
          </div>
        </div>
      `;
    }).join('');

    scrollToBottom();
  }

  function scrollToBottom() {
    const c = document.getElementById('chat-messages-container');
    if (c) {
      c.scrollTop = c.scrollHeight;
    }
  }

  async function handleSendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';

    const newMsg = await UniMatchChatEngine.sendMessage(_currentUserId, _partnerId, text);
    if (newMsg) {
      _messages.push(newMsg);
      renderMessages();
    }
  }

  async function sendIcebreaker(text) {
    const newMsg = await UniMatchChatEngine.sendMessage(_currentUserId, _partnerId, text);
    if (newMsg) {
      _messages.push(newMsg);
      renderMessages();
    }
  }

  function escapeHTML(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  window.addEventListener('beforeunload', () => {
    if (_pollingTimer) clearInterval(_pollingTimer);
  });
</script>
<script src="/unimatch/clouds-init.js"></script>
</body>
</html>
