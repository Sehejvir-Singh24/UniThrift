<style>
  @keyframes fade-in-up { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes scale-in { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
  .animate-fade-in-up { animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
  .animate-scale-in { animation: scale-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
  .delay-100 { animation-delay: 100ms; }
  .delay-200 { animation-delay: 200ms; }
  .delay-300 { animation-delay: 300ms; }

<body class="bg-background text-on-background h-full overflow-hidden flex flex-col relative">

<!-- WebGL Shader Background Canvas -->
<div class="fixed inset-0 w-full h-full z-0 opacity-50 pointer-events-none">
  <canvas id="shader-canvas" class="w-full h-full block"></canvas>
</div>

<!-- Main Content Container -->
<main class="flex-1 flex flex-col items-center justify-center px-container-padding relative z-10 w-full max-w-md mx-auto h-full">

  <!-- Overlapping Profile Photos -->
  <div class="flex items-center justify-center mb-stack-gap-lg relative animate-scale-in">
    <div class="w-28 h-28 md:w-32 md:h-32 rounded-full border-4 border-surface overflow-hidden shadow-[0_10px_40px_rgba(0,0,0,0.08)] z-10 -mr-6">
      <img id="user-photo" class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=780&q=80" alt="Your profile photo"/>
    </div>
    <div class="w-28 h-28 md:w-32 md:h-32 rounded-full border-4 border-surface overflow-hidden shadow-[0_10px_40px_rgba(0,0,0,0.08)] z-0 relative">
      <img id="match-photo" class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=780&q=80" alt="Eleanor's photo"/>
    </div>
    <div class="absolute bg-surface rounded-full p-2 shadow-[0_4px_20px_rgba(0,0,0,0.06)] z-20 animate-scale-in delay-200">
      <span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">favorite</span>
    </div>
  </div>

  <!-- Typography -->
  <div class="text-center mb-section-margin flex flex-col gap-stack-gap-sm w-full">
    <h1 class="font-display text-display text-primary animate-fade-in-up delay-100">It's a Connection!</h1>
    <p class="font-body-lg text-body-lg text-on-surface-variant animate-fade-in-up delay-200 px-4" id="connection-subtitle">
      You and Eleanor both want to be Study Partners.
    </p>
  </div>

  <!-- Action Buttons -->
  <div class="w-full flex flex-col gap-stack-gap-md animate-fade-in-up delay-400">
    <button onclick="location.href='/unimatch/icebreaker.html'" class="w-full bg-primary text-on-primary font-button text-button py-4 px-6 rounded-full hover:scale-[0.98] transition-transform duration-200 ease-in-out shadow-[0_8px_30px_rgba(92,4,39,0.2)] flex items-center justify-center gap-2">
      <span class="material-symbols-outlined">chat_bubble</span>
      Pick an Icebreaker
    </button>
    <button onclick="location.href='/unimatch/discover.html'" class="w-full bg-transparent border-2 border-outline-variant text-on-surface font-button text-button py-4 px-6 rounded-full hover:bg-surface-container-low hover:scale-[0.98] transition-all duration-200 ease-in-out">
      Message Later
    </button>
  </div>
</main>

<button onclick="location.href='/unimatch/discover.html'" class="absolute top-6 right-6 z-20 text-on-surface-variant hover:text-on-surface p-2 rounded-full hover:bg-surface-container transition-colors">
  <span class="material-symbols-outlined">close</span>
</button>

<script>
  // WebGL Shader Animation
  (function() {
    const canvas = document.getElementById('shader-canvas');
    function syncSize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
    }
    window.addEventListener('resize', syncSize);
    syncSize();

    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (!gl) return;

    const vs = `attribute vec2 a_position; varying vec2 v_texCoord; void main() { v_texCoord = a_position * 0.5 + 0.5; gl_Position = vec4(a_position, 0.0, 1.0); }`;
    const fs = `precision highp float; uniform float u_time; uniform vec2 u_resolution; varying vec2 v_texCoord;
    void main() {
      vec2 uv = v_texCoord;
      vec3 color1 = vec3(0.36, 0.015, 0.152); // Burgundy
      vec3 color2 = vec3(0.98, 0.976, 0.969); // Warm White
      float pulse = 0.5 + 0.5 * sin(u_time * 0.5);
      vec3 bgColor = mix(color2, color2 * 0.98, pulse);
      float sparkle = 0.0;
      for(float i = 0.0; i < 5.0; i++) {
        vec2 pos = vec2(sin(u_time * 0.2 + i * 1.5) * 0.4 + 0.5, cos(u_time * 0.3 + i * 2.0) * 0.4 + 0.5);
        float dist = distance(uv, pos);
        sparkle += smoothstep(0.02, 0.0, dist) * 0.3;
      }
      gl_FragColor = vec4(bgColor + vec3(0.831, 0.639, 0.451) * sparkle, 1.0);
    }`;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      return s;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const pos = gl.getAttribLocation(prog, 'a_position');
    gl.enableVertexAttribArray(pos);
    gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

    const uTime = gl.getUniformLocation(prog, 'u_time');
    function render(t) {
      gl.viewport(0, 0, canvas.width, canvas.height);
      if (uTime) gl.uniform1f(uTime, t * 0.001);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }
    render(0);
  })();
</script>
</body></html>
