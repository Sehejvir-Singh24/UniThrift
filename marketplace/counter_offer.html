<script>
    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('counter-input');
      const btnText = document.getElementById('btn-text');
      const textarea = document.getElementById('message-textarea');
      const chips = document.querySelectorAll('.message-chip');
      const sendBtn = document.getElementById('send-btn');
      const btnIcon = document.getElementById('btn-icon');
      const btnRipple = document.getElementById('btn-ripple');

      // Update button text on input change
      input.addEventListener('input', (e) => {
        const val = e.target.value;
        btnText.textContent = val ? `Send Counter: $${val}` : 'Send Counter';
      });

      // Handle chip selection
      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          // Toggle active state
          const isActive = chip.classList.contains('bg-primary-container');
          
          if (isActive) {
            chip.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-md');
            chip.classList.add('bg-surface-container-low', 'text-on-surface-variant');
            textarea.value = textarea.value.replace(chip.dataset.message + ' ', '');
          } else {
            chip.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
            chip.classList.add('bg-primary-container', 'text-on-primary', 'shadow-md');
            if(!textarea.value.includes(chip.dataset.message)) {
                textarea.value += (textarea.value ? ' ' : '') + chip.dataset.message + ' ';
            }
          }
        });
      });

      // Send Button Animation
      sendBtn.addEventListener('click', () => {
        if(sendBtn.classList.contains('sent')) return;
        
        btnText.style.transform = 'translateY(-30px)';
        btnIcon.style.transform = 'translateY(-30px) scale(0)';
        btnText.style.opacity = '0';
        
        setTimeout(() => {
          btnText.textContent = 'Sent!';
          btnIcon.textContent = 'check_circle';
          btnText.style.transform = 'translateY(0)';
          btnIcon.style.transform = 'translateY(0) scale(1)';
          btnText.style.opacity = '1';
          btnRipple.classList.remove('opacity-0');
          btnRipple.classList.add('opacity-20');
          sendBtn.classList.add('sent', 'bg-primary');
          sendBtn.classList.remove('bg-primary-container');
        }, 300);
      });
    });
  </script>
