<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    name="viewport" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script
    id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-container-high": "#dce9ff", "primary-fixed": "#6bff8f", "secondary-fixed": "#dae2fd", "on-surface": "#0b1c30", "inverse-surface": "#213145", "surface-container": "#e5eeff", "primary-container": "#22c55e", "on-primary-fixed-variant": "#005321", "surface-variant": "#d3e4fe", "on-secondary": "#ffffff", "on-error": "#ffffff", "on-tertiary-fixed-variant": "#3e4943", "tertiary": "#55615a", "on-surface-variant": "#3d4a3d", "surface-container-lowest": "#ffffff", "surface": "#f8f9ff", "on-background": "#0b1c30", "on-secondary-fixed": "#131b2e", "on-primary": "#ffffff", "tertiary-fixed-dim": "#bdcac1", "on-secondary-container": "#5c647a", "error-container": "#ffdad6", "secondary-container": "#dae2fd", "on-primary-container": "#004b1e", "surface-dim": "#cbdbf5", "primary-fixed-dim": "#4ae176", "on-error-container": "#93000a", "inverse-primary": "#4ae176", "on-tertiary-container": "#37433c", "outline": "#6d7b6c", "surface-container-low": "#eff4ff", "primary": "#006e2f", "on-primary-fixed": "#002109", "tertiary-container": "#a2afa7", "background": "#f8f9ff", "on-tertiary": "#ffffff", "surface-tint": "#006e2f", "secondary-fixed-dim": "#bec6e0", "error": "#ba1a1a", "surface-container-highest": "#d3e4fe", "outline-variant": "#bccbb9", "secondary": "#565e74", "on-tertiary-fixed": "#131e19", "tertiary-fixed": "#d9e6dd", "inverse-on-surface": "#eaf1ff", "on-secondary-fixed-variant": "#3f465c", "surface-bright": "#f8f9ff" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "container-padding-desktop": "48px", "unit": "4px", "stack-sm": "8px", "container-padding-mobile": "20px", "stack-lg": "32px", "stack-md": "16px", "gutter": "16px" }, "fontFamily": { "headline-lg": ["Geist"], "title-md": ["Geist"], "label-caps": ["Geist"], "display-lg": ["Geist"], "body-sm": ["Geist"], "body-lg": ["Geist"], "headline-lg-mobile": ["Geist"] }, "fontSize": { "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }], "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.04em", "fontWeight": "700" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }] } } } };</script>
  <style>
    @layer base {
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }

      .pt-safe {
        padding-top: env(safe-area-inset-top);
      }
    }

    body {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/scripts/supabase.js"></script>
  <script>
    requireVerifiedSeller();
  </script>
</head>

<body class="bg-background text-on-surface font-body-lg md:flex md:justify-center md:items-start md:p-8">
  <header
    class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)] md:max-w-2xl md:left-1/2 md:-translate-x-1/2 md:rounded-b-2xl md:top-8">
    <div class="h-16 px-container-padding-mobile flex items-center gap-stack-md"><button
        class="w-10 h-10 flex items-center justify-center rounded-full active:bg-surface-variant transition-colors"
        onclick="history.back()"><span class="material-symbols-outlined text-primary">arrow_back</span></button>
      <h1 class="font-title-md text-title-md">Sell Item</h1>
      <div class="ml-auto flex items-center gap-stack-md"><img alt="UniThrift" class="h-6 w-auto opacity-50"
          src="https://lh3.googleusercontent.com/aida/AP1WRLtH4uYEmLByi1jW_bpwvfQ8lgafnrniPPxttkhpfAwQXnXw8NaT9mQkRksWXfo__XRM7d6Uvzm0Bwjn88BhIvEQONJqhM_exCVjyMuVo8JaM-QqfvxIedY9mpAB77aRx5NxpRDH4hHcAAK7XMuCqkpVLNDZbNaily1mDj9Sbn9wd4mk9nYQUiTqK5HOyLhdELnPMf9ECCHmvv5qA3vlmUb534EmdqX2-JyWeljbHwVMV0I03d9DZCZGd0vM" /><img
          alt="Profile" class="w-8 h-8 rounded-full object-cover"
          src="https://lh3.googleusercontent.com/aida/AP1WRLvatbxVzqsSywC_1vHoSqI_wdlArM_evdqze8PEDCD-A2XFALYwvef1wSgnp5xF3MlRZrRJQKlKjsbmjk_vu-XyOCC_GpbCe2nbLWOxEfdhuZRav0Fi0gAet6qMx6U0G8O2kjfJ46p53GfneosMnR2eStPNUcL1QPBh78yyvfvmcw4p1oN0OQ4OJQNb3502Nj1Eh9lB0EcKXd3AxA6D1S0ILao1di_7DsVR-Ve0ptmRbkvPOwVR-IUakakA" />
      </div>
    </div>
  </header>
  <main
    class="pt-16 bg-background min-h-screen w-full md:max-w-2xl md:min-h-0 md:bg-surface-container-lowest md:shadow-xl md:rounded-3xl md:mt-24 md:pb-12">
    <div class="flex flex-col w-full pb-safe">
      <!-- Progress Bar -->
      <div class="px-container-padding-mobile py-stack-md flex items-center justify-between gap-stack-sm relative">
        <div
          class="absolute left-container-padding-mobile right-container-padding-mobile h-1 bg-surface-variant rounded-full top-1/2 -translate-y-1/2 z-0">
        </div>
        <div
          class="absolute left-container-padding-mobile w-[40%] h-1 bg-primary rounded-full top-1/2 -translate-y-1/2 z-0 transition-all duration-500">
        </div>
        <div
          class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-caps text-[10px] z-10 shadow-[0_2px_8px_rgba(34,197,94,0.3)]">
          <span class="material-symbols-outlined text-[14px]">check</span>
        </div>
        <div
          class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-caps text-[10px] z-10 shadow-[0_2px_8px_rgba(34,197,94,0.3)] ring-4 ring-background">
          2</div>
        <div
          class="w-6 h-6 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-label-caps text-[10px] z-10 ring-4 ring-background">
          3</div>
        <div
          class="w-6 h-6 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-label-caps text-[10px] z-10 ring-4 ring-background">
          4</div>
      </div>
      <div class="px-container-padding-mobile pb-stack-sm">
        <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Item Details</h2>
        <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Tell buyers what you're selling.</p>
      </div>
      <form class="flex flex-col gap-stack-lg px-container-padding-mobile mt-stack-sm">
        <!-- Title Input -->
        <div class="flex flex-col gap-stack-sm relative group">
          <label
            class="font-label-caps text-label-caps text-on-surface-variant ml-1 transition-colors group-focus-within:text-primary"
            for="item-title">Title</label>
          <div
            class="relative flex items-center bg-surface-container rounded-xl overflow-hidden shadow-[0_2px_10px_rgba(0,0,0,0.02)] transition-shadow focus-within:shadow-[0_4px_20px_rgba(34,197,94,0.1)]">
            <input
              class="w-full bg-transparent py-4 px-4 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none"
              id="item-title" placeholder="e.g. Calculus Early Transcendentals 8th Ed." required="" type="text" />
          </div>
        </div>
        <!-- Description Input -->
        <div class="flex flex-col gap-stack-sm relative group">
          <label
            class="font-label-caps text-label-caps text-on-surface-variant ml-1 transition-colors group-focus-within:text-primary"
            for="item-desc">Description</label>
          <div
            class="relative flex items-start bg-surface-container rounded-xl overflow-hidden shadow-[0_2px_10px_rgba(0,0,0,0.02)] transition-shadow focus-within:shadow-[0_4px_20px_rgba(34,197,94,0.1)]">
            <textarea
              class="w-full bg-transparent py-4 px-4 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none resize-none"
              id="item-desc" placeholder="Mention any highlights, flaws, or why you're selling..." rows="4"></textarea>
          </div>
        </div>
        <!-- Category -->
        <div class="flex flex-col gap-stack-sm">
          <label class="font-label-caps text-label-caps text-on-surface-variant ml-1">Category</label>
          <div class="flex flex-wrap gap-stack-sm" id="category-container">
            <!-- Javascript will handle the single-select logic -->
            <button
              class="cat-btn px-4 py-3 rounded-xl bg-surface-container text-on-surface font-body-sm text-body-sm flex items-center gap-2 transition-all active:scale-95 selected"
              onclick="selectCategory(this)" type="button">
              <span class="material-symbols-outlined text-[18px]">menu_book</span>
              Textbooks
            </button>
            <button
              class="cat-btn px-4 py-3 rounded-xl bg-surface-container text-on-surface font-body-sm text-body-sm flex items-center gap-2 transition-all active:scale-95"
              onclick="selectCategory(this)" type="button">
              <span class="material-symbols-outlined text-[18px]">chair</span>
              Furniture
            </button>
            <button
              class="cat-btn px-4 py-3 rounded-xl bg-surface-container text-on-surface font-body-sm text-body-sm flex items-center gap-2 transition-all active:scale-95"
              onclick="selectCategory(this)" type="button">
              <span class="material-symbols-outlined text-[18px]">devices</span>
              Electronics
            </button>
            <button
              class="cat-btn px-4 py-3 rounded-xl bg-surface-container text-on-surface font-body-sm text-body-sm flex items-center gap-2 transition-all active:scale-95"
              onclick="selectCategory(this)" type="button">
              <span class="material-symbols-outlined text-[18px]">checkroom</span>
              Clothing
            </button>
          </div>
        </div>
        <!-- Condition -->
        <div class="flex flex-col gap-stack-sm mb-stack-lg">
          <label class="font-label-caps text-label-caps text-on-surface-variant ml-1">Condition</label>
          <div
            class="flex bg-surface-container p-1 rounded-xl shadow-[0_2px_10px_rgba(0,0,0,0.02)] relative isolation-auto">
            <!-- Active Background Pill -->
            <div
              class="absolute top-1 bottom-1 w-[25%] bg-white rounded-lg shadow-sm transition-transform duration-300 ease-out z-0 left-1"
              id="condition-pill"></div>
            <button
              class="cond-btn flex-1 py-2 font-body-sm text-body-sm text-on-surface text-center z-10 transition-colors font-medium"
              onclick="selectCondition(this, 0)" type="button">New</button>
            <button
              class="cond-btn flex-1 py-2 font-body-sm text-body-sm text-on-surface/60 text-center z-10 transition-colors"
              onclick="selectCondition(this, 1)" type="button">Like New</button>
            <button
              class="cond-btn flex-1 py-2 font-body-sm text-body-sm text-on-surface/60 text-center z-10 transition-colors"
              onclick="selectCondition(this, 2)" type="button">Good</button>
            <button
              class="cond-btn flex-1 py-2 font-body-sm text-body-sm text-on-surface/60 text-center z-10 transition-colors"
              onclick="selectCondition(this, 3)" type="button">Fair</button>
          </div>
        </div>
        <!-- Pricing -->
        <div class="flex gap-stack-md">
          <div class="flex flex-col gap-stack-sm relative group flex-1">
            <label
              class="font-label-caps text-label-caps text-on-surface-variant ml-1 transition-colors group-focus-within:text-primary"
              for="item-price">Your Price (₹)</label>
            <div
              class="relative flex items-center bg-surface-container rounded-xl overflow-hidden shadow-[0_2px_10px_rgba(0,0,0,0.02)] transition-shadow focus-within:shadow-[0_4px_20px_rgba(34,197,94,0.1)]">
              <input
                class="w-full bg-transparent py-4 px-4 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none"
                id="item-price" placeholder="e.g. 450" required type="number" min="1" />
            </div>
          </div>
          <div class="flex flex-col gap-stack-sm relative group flex-1">
            <label
              class="font-label-caps text-label-caps text-on-surface-variant ml-1 transition-colors group-focus-within:text-primary"
              for="item-original-price">Original Price (₹)</label>
            <div
              class="relative flex items-center bg-surface-container rounded-xl overflow-hidden shadow-[0_2px_10px_rgba(0,0,0,0.02)] transition-shadow focus-within:shadow-[0_4px_20px_rgba(34,197,94,0.1)]">
              <input
                class="w-full bg-transparent py-4 px-4 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none"
                id="item-original-price" placeholder="e.g. 900" type="number" min="1" />
            </div>
          </div>
        </div>
      </form>
      <!-- Sticky Bottom Bar -->
      <div
        class="mt-auto sticky bottom-0 left-0 right-0 p-container-padding-mobile bg-background/80 md:bg-surface-container-lowest/80 backdrop-blur-xl z-20 md:rounded-b-3xl">
        <button id="publish-btn" onclick="publishListing()"
          class="w-full bg-primary text-on-primary py-4 rounded-xl font-title-md text-title-md shadow-[0_8px_20px_rgba(34,197,94,0.25)] transition-transform active:scale-[0.98] flex items-center justify-center gap-2"
          type="button">
          Publish Listing
          <span class="material-symbols-outlined text-[20px]">rocket_launch</span>
        </button>
      </div>
    </div>
    <script>
      // Category selection
      const catSelectedClasses = ['bg-primary-container', 'text-on-primary-container', 'shadow-[0_4px_12px_rgba(34,197,94,0.2)]'];
      const catUnselectedClasses = ['bg-surface-container', 'text-on-surface'];
      document.querySelector('.cat-btn.selected').classList.add(...catSelectedClasses);
      document.querySelector('.cat-btn.selected').classList.remove(...catUnselectedClasses);

      function selectCategory(btn) {
        document.querySelectorAll('.cat-btn').forEach(b => {
          b.classList.remove('selected', ...catSelectedClasses);
          b.classList.add(...catUnselectedClasses);
          const icon = b.querySelector('.material-symbols-outlined');
          if (icon) icon.removeAttribute('style');
        });
        btn.classList.add('selected', ...catSelectedClasses);
        btn.classList.remove(...catUnselectedClasses);
        const selectedIcon = btn.querySelector('.material-symbols-outlined');
        if (selectedIcon) selectedIcon.style.fontVariationSettings = "'FILL' 1";
        btn.style.transform = 'scale(0.95)';
        setTimeout(() => { btn.style.transform = 'scale(1)'; }, 150);
      }

      // Condition selection
      let selectedCondition = 'Good'; // default
      function selectCondition(btn, index) {
        const pill = document.getElementById('condition-pill');
        pill.style.transform = `translateX(${index * 100}%)`;
        document.querySelectorAll('.cond-btn').forEach(b => {
          b.classList.remove('text-on-surface', 'font-medium');
          b.classList.add('text-on-surface/60');
        });
        btn.classList.remove('text-on-surface/60');
        btn.classList.add('text-on-surface', 'font-medium');
        selectedCondition = btn.textContent.trim();
      }

      // Publish listing to Supabase
      async function publishListing() {
        const title = document.getElementById('item-title').value.trim();
        const desc = document.getElementById('item-desc').value.trim();
        const price = parseFloat(document.getElementById('item-price').value);
        const originalPrice = parseFloat(document.getElementById('item-original-price').value) || null;
        const category = document.querySelector('.cat-btn.selected')?.textContent.trim() || null;

        if (!title || !price) {
          alert('Please fill in at least the Title and Your Price.');
          return;
        }

        const publishBtn = document.getElementById('publish-btn');
        publishBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Uploading photos...`;
        publishBtn.classList.add('pointer-events-none');

        try {
          const { data: { session } } = await supabase.auth.getSession();
          if (!session) throw new Error('Not authenticated');
          const userId = session.user.id;

          // Upload photos from sessionStorage
          let imageUrl = null;
          const pendingPhotosRaw = sessionStorage.getItem('pendingPhotos');
          if (pendingPhotosRaw) {
            const pendingPhotos = JSON.parse(pendingPhotosRaw);
            if (pendingPhotos.length > 0) {
              const photo = pendingPhotos[0]; // cover photo
              // Convert base64 back to File
              const res = await fetch(photo.base64);
              const blob = await res.blob();
              const ext = photo.name.split('.').pop();
              const filePath = `${userId}/${Date.now()}_cover.${ext}`;

              const { error: uploadError } = await supabase.storage
                .from('product_images')
                .upload(filePath, blob, { contentType: photo.type, upsert: true });

              if (uploadError) throw uploadError;

              const { data: urlData } = supabase.storage
                .from('product_images')
                .getPublicUrl(filePath);
              imageUrl = urlData.publicUrl;
            }
          }

          publishBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Publishing...`;

          // Insert product into the database
          const { error: insertError } = await supabase.from('products').insert({
            seller_id: userId,
            title,
            description: desc || null,
            price,
            original_price: originalPrice,
            category,
            condition: selectedCondition,
            image_url: imageUrl
          });

          if (insertError) throw insertError;

          // Clear pending photos
          sessionStorage.removeItem('pendingPhotos');

          // Success! Go to dashboard
          publishBtn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Listed Successfully!`;
          publishBtn.classList.add('bg-green-600');
          setTimeout(() => { window.location.href = '/index.html'; }, 1200);

        } catch (err) {
          console.error('Publish error:', err);
          alert('Failed to publish: ' + err.message);
          publishBtn.innerHTML = `Publish Listing <span class="material-symbols-outlined text-[20px]">rocket_launch</span>`;
          publishBtn.classList.remove('pointer-events-none');
        }
      }
    </script>
  </main>
</body>

</html>
