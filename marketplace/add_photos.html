  </button>
  <button id="continue-btn" onclick="goToDetails()" class="px-8 py-4 rounded-xl font-title-md text-on-primary bg-primary flex items-center gap-2 active:scale-[0.98] transition-transform shadow-md opacity-50 pointer-events-none" type="button">
    Continue
    <span class="material-symbols-outlined">arrow_forward</span>
  </button>

<script>
  const MAX_PHOTOS = 6;
  let selectedFiles = []; // {file, objectUrl}

  const photoInput = document.getElementById('photo-input');
  const photoGrid = document.getElementById('photo-grid');
  const addPhotoBtn = document.getElementById('add-photo-btn');
  const continueBtn = document.getElementById('continue-btn');
  const photoCountLabel = document.getElementById('photo-count-label');

  addPhotoBtn.addEventListener('click', () => {
    if (selectedFiles.length < MAX_PHOTOS) photoInput.click();
  });

  photoInput.addEventListener('change', async (e) => {
    const newFiles = Array.from(e.target.files);
    const slotsLeft = MAX_PHOTOS - selectedFiles.length;
    const filesToProcess = newFiles.slice(0, slotsLeft);

    for (const file of filesToProcess) {
      const compressed = await compressImage(file, 1200, 0.8);
      const objectUrl = URL.createObjectURL(compressed);
      selectedFiles.push({ file: compressed, objectUrl, name: file.name });
    }
    photoInput.value = '';
    renderGrid();
  });

  function renderGrid() {
    // Remove all photo cards, keep only the add button
    const existingCards = photoGrid.querySelectorAll('.photo-card');
    existingCards.forEach(c => c.remove());

    selectedFiles.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'photo-card relative w-full aspect-square rounded-[20px] bg-surface-container overflow-hidden shadow-[0_4px_20px_rgba(0,0,0,0.04)] group';
      card.innerHTML = `
        <img src="${item.objectUrl}" class="w-full h-full object-cover" />
        <button onclick="removePhoto(${index})" class="absolute top-2 right-2 w-8 h-8 bg-surface-container-highest/80 backdrop-blur-md rounded-full flex items-center justify-center text-on-surface hover:bg-error hover:text-on-error transition-colors" type="button">
          <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
        ${index === 0 ? '<div class="absolute bottom-2 left-2 bg-primary/90 backdrop-blur-sm text-on-primary font-label-caps px-3 py-1 rounded-full">COVER</div>' : ''}
      `;
      photoGrid.appendChild(card);
    });

    // Update label and continue button
    const remaining = MAX_PHOTOS - selectedFiles.length;
    photoCountLabel.textContent = remaining > 0 ? `${remaining} slot${remaining !== 1 ? 's' : ''} left` : 'Max reached';

    if (selectedFiles.length >= MAX_PHOTOS) {
      addPhotoBtn.classList.add('opacity-40', 'pointer-events-none');
    } else {
      addPhotoBtn.classList.remove('opacity-40', 'pointer-events-none');
    }

    if (selectedFiles.length > 0) {
      continueBtn.classList.remove('opacity-50', 'pointer-events-none');
    } else {
      continueBtn.classList.add('opacity-50', 'pointer-events-none');
    }
  }

  function removePhoto(index) {
    URL.revokeObjectURL(selectedFiles[index].objectUrl);
    selectedFiles.splice(index, 1);
    renderGrid();
  }

  async function goToDetails() {
    // Store file names and object URLs in sessionStorage to retrieve on next page
    // We can't store File objects in sessionStorage, so we re-read them as base64
    continueBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Processing...`;
    continueBtn.classList.add('pointer-events-none');

    try {
      const filesData = [];
      for (const item of selectedFiles) {
        const base64 = await fileToBase64(item.file);
        filesData.push({ name: item.name, type: item.file.type, base64 });
      }
      sessionStorage.setItem('pendingPhotos', JSON.stringify(filesData));
      window.location.href = '/marketplace/sell_item_details.html';
    } catch(err) {
      alert('Error processing photos: ' + err.message);
      continueBtn.innerHTML = `Continue <span class="material-symbols-outlined">arrow_forward</span>`;
      continueBtn.classList.remove('pointer-events-none');
    }
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  function compressImage(file, maxSize, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = event => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width, height = img.height;
          if (width > height) {
            if (width > maxSize) { height = Math.round(height * maxSize / width); width = maxSize; }
          } else {
            if (height > maxSize) { width = Math.round(width * maxSize / height); height = maxSize; }
          }
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          canvas.toBlob(blob => resolve(new File([blob], file.name, { type: file.type || 'image/jpeg', lastModified: Date.now() })), file.type || 'image/jpeg', quality);
        };
        img.onerror = reject;
      };
      reader.onerror = reject;
    });
  }
</script>
