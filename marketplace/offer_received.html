<!-- Status Banner -->
<div class="bg-surface-container-low rounded-xl p-stack-md flex items-start gap-stack-sm shadow-[0_4px_20px_rgba(0,0,0,0.04)] relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-primary-container/5 via-transparent to-transparent opacity-50 pointer-events-none"></div>
<span class="material-symbols-outlined text-primary-container text-[20px] shrink-0 pt-unit">verified</span>
<div class="flex flex-col min-w-0 flex-1 relative z-10">
<h2 id="status-title" class="font-title-md text-title-md text-on-surface">Offer Received</h2>
<p id="status-subtitle" class="font-body-sm text-body-sm text-on-surface-variant line-clamp-1">Pending response</p>
</div>
</div>
<!-- Main Offer Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.04)] overflow-hidden flex flex-col">
<!-- Product Snapshot (Header of Card) -->
<div class="p-stack-md bg-surface-container-low flex gap-stack-md items-center relative">
<div id="product-img" class="bg-cover bg-center w-16 h-16 rounded-lg shrink-0 shadow-sm" style="background-color: var(--color-surface-container)"></div>
<div class="flex flex-col min-w-0">
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Item Details</p>
<h3 id="product-title" class="font-body-lg text-body-lg text-on-surface font-semibold truncate">--</h3>
<p id="product-original-price" class="font-body-sm text-body-sm text-secondary line-through">Listed: ₹--</p>
</div>
</div>
<!-- Offer Amount Display -->
<div class="p-stack-lg flex flex-col items-center justify-center bg-surface-container-lowest relative">
<p class="font-label-caps text-label-caps text-on-surface-variant mb-stack-sm">Current Offer</p>
<div class="flex items-baseline gap-unit">
<span id="offer-amount-display" class="font-display-lg text-display-lg text-primary">₹--</span>
</div>
<!-- Buyer Trust Indicator -->
<div class="mt-stack-md flex items-center gap-stack-sm bg-surface-container-high px-stack-sm py-unit rounded-full">
<span class="material-symbols-outlined text-secondary text-[16px]">person</span>
<span id="buyer-name" class="font-body-sm text-body-sm text-on-surface-variant font-medium">Verified Buyer</span>
<div class="flex items-center gap-[2px] ml-unit">
<span class="material-symbols-outlined text-primary-container text-[14px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-label-caps text-label-caps text-on-surface">4.8</span>
</div>
</div>
</div>
</div>
<!-- Action Grid -->
<div id="action-grid" class="flex flex-col gap-stack-sm mt-stack-sm">
<button onclick="respondToOffer('Accepted')" class="w-full bg-primary-container text-on-primary font-title-md text-title-md py-stack-md rounded-xl shadow-sm hover:scale-[0.99] active:scale-[0.98] transition-transform duration-200 flex items-center justify-center gap-stack-sm">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
      Accept Offer</button>
<div class="grid grid-cols-2 gap-stack-sm">
<button id="counter-btn" class="bg-surface-container text-on-surface-variant font-title-md text-title-md py-stack-md rounded-xl hover:scale-[0.99] active:scale-[0.98] transition-transform duration-200 flex flex-col items-center justify-center gap-unit">
<span class="material-symbols-outlined text-[20px]">sync_alt</span>
         Counter</button>
<button onclick="respondToOffer('Rejected')" class="bg-error-container/50 text-error font-title-md text-title-md py-stack-md rounded-xl hover:scale-[0.99] active:scale-[0.98] transition-transform duration-200 flex flex-col items-center justify-center gap-unit">
<span class="material-symbols-outlined text-[20px]">close</span>
         Reject
       </button>
</div>
</div>
<!-- Hidden Counter Offer Input Area (Revealed on click) -->
<div class="hidden mt-stack-md bg-surface-container-low rounded-xl p-stack-md shadow-inner transition-all duration-300 opacity-0 transform translate-y-4" id="counter-area">
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-stack-sm" for="counter-price">Your Counter Price</label>
<div class="relative flex items-center">
<span class="absolute left-stack-md font-title-md text-title-md text-on-surface-variant">₹</span>
<input class="w-full bg-surface-container-lowest font-title-md text-title-md text-on-surface py-stack-sm pl-[40px] pr-stack-md rounded-lg outline-none focus:ring-2 focus:ring-primary-container shadow-sm" id="counter-price" min="1" placeholder="110" type="number"/>
</div>
<button onclick="submitCounterOffer()" class="mt-stack-md w-full bg-surface-tint text-on-primary font-body-lg text-body-lg font-semibold py-stack-sm rounded-lg shadow-sm active:scale-[0.98] transition-transform">
        Send Counter Offer
     </button>
</div>
</div>
<script>
  let currentOffer = null;

  document.addEventListener('DOMContentLoaded', async () => {
    // Header avatar
    const profile = await getProfile();
    if (profile && profile.avatar_url) {
      document.getElementById('header-avatar').src = profile.avatar_url;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const offerId = urlParams.get('id');

    if (!offerId) {
      alert("Offer ID is required.");
      history.back();
      return;
    }

    currentOffer = await getOfferById(offerId);
    if (!currentOffer) {
      alert("Offer not found.");
      history.back();
      return;
    }

    // Populate data
    const product = currentOffer.products;
    document.getElementById('product-title').textContent = product.title;
    document.getElementById('product-original-price').textContent = `Listed: ₹${product.price}`;
    
    // Status text/banner
    document.getElementById('status-title').textContent = `Offer ${currentOffer.status}`;
    document.getElementById('status-subtitle').textContent = `From ${currentOffer.profiles?.full_name || 'Verified Student'}`;

    // Image
    if (product.image_url) {
      document.getElementById('product-img').style.backgroundImage = `url('${product.image_url}')`;
    }

    // Offer amount
    document.getElementById('offer-amount-display').textContent = `₹${currentOffer.offer_amount}`;

    // Buyer name
    document.getElementById('buyer-name').textContent = currentOffer.profiles?.full_name || 'Verified Buyer';

    // If offer is not pending, hide action buttons
    if (currentOffer.status !== 'Pending') {
      document.getElementById('action-grid').classList.add('hidden');
    }
  });

  // Toggle Counter offer form
  document.getElementById('counter-btn').addEventListener('click', function() {
    const area = document.getElementById('counter-area');
    if (area.classList.contains('hidden')) {
        area.classList.remove('hidden');
        setTimeout(() => {
            area.classList.remove('opacity-0', 'translate-y-4');
            area.classList.add('opacity-100', 'translate-y-0');
        }, 10);
    } else {
        area.classList.remove('opacity-100', 'translate-y-0');
        area.classList.add('opacity-0', 'translate-y-4');
        setTimeout(() => {
            area.classList.add('hidden');
        }, 300);
    }
  });

  async function respondToOffer(status) {
    if (!confirm(`Are you sure you want to ${status.toLowerCase()} this offer?`)) return;

    try {
      await updateOfferStatus(currentOffer.id, status);
      alert(`Offer ${status.toLowerCase()} successfully!`);
      window.location.href = '/core/offers.html';
    } catch (err) {
      alert("Error: " + err.message);
    }
  }

  async function submitCounterOffer() {
    const amount = parseFloat(document.getElementById('counter-price').value);
    if (!amount || amount <= 0) {
      alert("Please enter a valid counter amount.");
      return;
    }

    try {
      await updateOfferStatus(currentOffer.id, 'Countered', amount);
      alert("Counter offer sent successfully!");
      window.location.href = '/core/offers.html';
    } catch (err) {
      alert("Error sending counter offer: " + err.message);
    }
  }
</script></main></body></html>
