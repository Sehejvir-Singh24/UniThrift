name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier instance from sleeping (spins down after 15 min)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping UniThrift Render Health Endpoint
        run: |
          echo "Pinging UniThrift Render backend..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://unithrift-n2my.onrender.com/api/health)
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Render service is awake and healthy!"
          else
            echo "Warning: Received HTTP status $HTTP_STATUS"
          fi
