<script>
  document.addEventListener('DOMContentLoaded', () => {
    const splashContent = document.getElementById('splash-content');
    const loadingDots = document.getElementById('loading-dots');
    
    setTimeout(() => {
      splashContent.classList.remove('opacity-0', 'translate-y-4');
      splashContent.classList.add('opacity-100', 'translate-y-0');
      splashContent.style.transition = 'all 1s cubic-bezier(0.16, 1, 0.3, 1)';
    }, 100);

    setTimeout(() => {
      Array.from(loadingDots.children).forEach(dot => {
        dot.classList.remove('opacity-0');
      });
    }, 800);
    
    // Automatically proceed to Home screen after 3 seconds
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 3000);
    
    // Allow manual click to proceed immediately
    document.body.addEventListener('click', () => {
      window.location.href = 'index.html';
    });
  });
