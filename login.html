<svg class="w-6 h-6" fill="currentColor" viewbox="0 0 24 24"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"></path></svg>

<div class="w-full flex justify-center pb-8 mt-auto">
<p class="font-body-sm text-body-sm text-on-surface-variant">
            Don't have an account? <a class="text-primary font-semibold hover:underline" href="javascript:void(0)">Sign up</a>
</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
    function selectRole(role) {
        document.getElementById('selected-role').value = role;
        const btnCustomer = document.getElementById('role-customer');
        const btnSeller = document.getElementById('role-seller');
        if(role === 'customer') {
            btnCustomer.className = 'flex-1 py-2 rounded-full font-title-md text-sm bg-primary text-on-primary shadow-sm transition-all';
            btnSeller.className = 'flex-1 py-2 rounded-full font-title-md text-sm text-on-surface transition-all';
        } else {
            btnSeller.className = 'flex-1 py-2 rounded-full font-title-md text-sm bg-primary text-on-primary shadow-sm transition-all';
            btnCustomer.className = 'flex-1 py-2 rounded-full font-title-md text-sm text-on-surface transition-all';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const emailInput = document.getElementById('email-input');
        const continueBtn = document.getElementById('continue-btn');
        const errorDiv = document.getElementById('auth-error');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');

        // Basic email validation
        emailInput.addEventListener('input', function (e) {
            const email = e.target.value;
            const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            if(isValid) {
                 continueBtn.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                 continueBtn.classList.add('opacity-50', 'pointer-events-none');
            }
        });
        
        continueBtn.addEventListener('click', async () => {
            const email = emailInput.value;
            const role = document.getElementById('selected-role').value;
            
            errorDiv.classList.add('hidden');
            continueBtn.classList.add('pointer-events-none');
            btnText.innerText = 'Sending...';
            btnIcon.innerText = 'progress_activity';
            btnIcon.classList.add('animate-spin');

            const { error } = await supabase.auth.signInWithOtp({
                email,
                options: {
                    data: {
                        role: role
                    }
                }
            });

            if (error) {
                errorDiv.innerText = error.message;
                errorDiv.classList.remove('hidden');
                continueBtn.classList.remove('pointer-events-none');
                btnText.innerText = 'Continue';
                btnIcon.innerText = 'arrow_forward';
                btnIcon.classList.remove('animate-spin');
            } else {
                // Save email to sessionStorage so otp_verification can use it
                sessionStorage.setItem('auth_email', email);
                window.location.href = 'otp_verification.html';
            }
        });
    });
</script></main></body></html>
