<script>
  const amenities = [
    { icon: 'wifi', label: 'High-Speed WiFi' },
    { icon: 'ac_unit', label: 'Air Conditioning' },
    { icon: 'restaurant', label: 'Meals Included' },
    { icon: 'local_laundry_service', label: 'Laundry' },
    { icon: 'bathtub', label: 'Attached Bath' },
    { icon: 'security', label: '24/7 Security' },
    { icon: 'kitchen', label: 'Shared Kitchen' },
    { icon: 'fitness_center', label: 'Gym Access' },
    { icon: 'cleaning_services', label: 'Housekeeping' },
    { icon: 'directions_bus', label: 'Near Transit' }
  ];

  const container = document.getElementById('amenities-container');
  const selectedAmenities = [];
  
  amenities.forEach(item => {
    const chip = document.createElement('button');
    chip.className = 'flex items-center gap-unit px-4 py-2 rounded-full bg-surface-container text-on-surface transition-all active:scale-95 border border-transparent';
    
    chip.innerHTML = `
      <span class="material-symbols-outlined text-[18px] opacity-70 transition-opacity">${item.icon}</span>
      <span class="font-body-sm text-body-sm whitespace-nowrap">${item.label}</span>
    `;

    let isSelected = false;
    chip.addEventListener('click', () => {
      isSelected = !isSelected;
      if (isSelected) {
        chip.classList.remove('bg-surface-container', 'text-on-surface');
        chip.classList.add('bg-primary', 'text-on-primary', 'shadow-md');
        chip.querySelector('.material-symbols-outlined').classList.remove('opacity-70');
        selectedAmenities.push(item.label);
      } else {
        chip.classList.remove('bg-primary', 'text-on-primary', 'shadow-md');
        chip.classList.add('bg-surface-container', 'text-on-surface');
        chip.querySelector('.material-symbols-outlined').classList.add('opacity-70');
        const idx = selectedAmenities.indexOf(item.label);
        if (idx > -1) selectedAmenities.splice(idx, 1);
      }
    });

    container.appendChild(chip);
  });

  function saveMediaAmenitiesAndContinue() {
      const description = document.querySelector('textarea').value.trim();
      const draftStr = sessionStorage.getItem('pg_draft');
      if (!draftStr) {
          alert("Session expired. Please restart the listing flow.");
          window.location.href = '/pghostels/pg_property_basics.html';
          return;
      }
      
      const pgDraft = JSON.parse(draftStr);
      pgDraft.description = description || "Beautiful student hostel / PG accommodating all student needs. Located near campus.";
      pgDraft.amenities = selectedAmenities;
      pgDraft.image_url = 'https://lh3.googleusercontent.com/aida-public/AB6AXuBxUPriTWu6eA9GhUJJM-c0bMTSrTdNLAtPpySrsIQLEIXfY93j78IYsNePK7g3zZM3Ao_hdnv0CAxTX_-1JFL2s0DTB829cwNMlTtjuCQlvXLMojwrswnbb4ySyhtQWQWUCSl9WkRLMXGqwJLK6p5-PiBlvbxMTSLPoxJdP4ETs0ZCh_FSqMK7veviZieEA8GR9mQ398E2X8q831G3KVDXYebGyW0rjgEwAe8O0ELjwXPUc2pfinLhsXtZapSwOjP8KicXTsaEje4M';
      
      sessionStorage.setItem('pg_draft', JSON.stringify(pgDraft));
      window.location.href = '/pghostels/pg_review_publish.html';
  }
</script></main></body></html>
