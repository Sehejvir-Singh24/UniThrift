<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Uni Ecosystem - Gateway to Student Community</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-container-low": "#f4f3f1", "error": "#ba1a1a", "primary-container": "#7a1f3d",
            "surface-variant": "#e3e2e0", "on-surface": "#1a1c1b", "surface-container-lowest": "#ffffff",
            "surface": "#faf9f7", "primary": "#5c0427", "on-primary": "#ffffff",
            "background": "#faf9f7", "secondary": "#7d562d"
          },
          "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
          "spacing": { "container-padding": "24px", "stack-gap-lg": "32px", "stack-gap-sm": "12px", "stack-gap-md": "20px", "section-margin": "48px", "unit": "4px" },
          "fontFamily": { "body-lg": ["Inter"], "headline-lg-mobile": ["Inter"], "button": ["Inter"], "headline-lg": ["Inter"], "label-caps": ["Inter"], "body-md": ["Inter"], "title-md": ["Inter"], "display": ["Inter"] },
          "fontSize": {
            "body-lg": ["17px", {"lineHeight": "26px", "fontWeight": "400"}],
            "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
            "button": ["16px", {"lineHeight": "20px", "fontWeight": "600"}],
            "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
            "display": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600"}]
          }
        }
      }
    };
  </script>
  <style>
    @layer base { body { overscroll-behavior: none; } }
  </style>
</head>
<body class="bg-gradient-to-b from-surface to-surface-container-low text-on-surface font-body-md min-h-screen flex flex-col">

<!-- Top Header -->
<header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl pt-safe shadow-sm">
  <div class="h-16 px-container-padding flex items-center justify-between max-w-4xl mx-auto w-full">
    <div class="flex items-center gap-3">
      <span class="font-display text-primary text-headline-lg tracking-tighter font-bold">Uni</span>
      <div id="platform-switcher-slot"></div>
    </div>
    <div id="user-status-area" class="flex items-center gap-2">
      <!-- Dynamically filled by Supabase Auth -->
    </div>
  </div>
</header>

<main class="relative pt-24 pb-24 min-h-screen flex items-center justify-center">
  <div class="flex flex-col w-full max-w-3xl justify-center gap-stack-gap-lg px-container-padding">
    
    <!-- Title Section -->
    <div class="text-center mb-4">
      <h1 class="font-display text-display text-on-surface mb-2 font-bold">Welcome to the Uni Ecosystem</h1>
      <p class="font-body-lg text-on-surface-variant opacity-90 max-w-md mx-auto">Your gateway to the exclusive student community.</p>
    </div>

    <!-- App Choice Cards -->
    <div class="flex flex-col md:flex-row gap-stack-gap-md w-full">

      <!-- UniThrift Card -->
      <a id="unithrift-card" class="group relative overflow-hidden rounded-3xl w-full flex-1 aspect-[4/3] md:aspect-[3/4] shadow-md hover:shadow-2xl transition-all duration-300 ease-in-out transform hover:-translate-y-2 active:scale-95 border border-surface-variant/50" href="/auth/login.html">
        <div class="absolute inset-0 bg-white z-0"></div>
        <div class="absolute inset-0 flex flex-col items-center justify-center p-8 z-10">
          <!-- UniThrift Icon Graphic -->
          <div class="w-24 h-24 rounded-full bg-[#1AA15C]/10 flex items-center justify-center text-[#1AA15C] mb-4 group-hover:scale-110 transition-transform">
            <span class="material-symbols-outlined text-5xl">shopping_bag</span>
          </div>
        </div>
        <div class="absolute bottom-0 left-0 w-full p-6 z-20 bg-gradient-to-t from-white via-white/95 to-transparent flex flex-col justify-end">
          <h2 class="font-display text-[#1AA15C] text-display leading-tight mb-1 text-center font-bold">UniThrift</h2>
          <p class="font-body-md text-[#1AA15C]/90 text-center font-medium">Sustainable campus marketplace</p>
        </div>
      </a>

      <!-- UniMatch Card -->
      <a id="unimatch-card" class="group relative overflow-hidden rounded-3xl w-full flex-1 aspect-[4/3] md:aspect-[3/4] bg-[#7A1F3D] shadow-md hover:shadow-2xl transition-all duration-300 ease-in-out transform hover:-translate-y-2 active:scale-95 border border-primary/20" href="/unimatch/welcome.html">
        <div class="absolute inset-0 bg-gradient-to-t from-[#5C0427] via-[#7A1F3D]/80 to-transparent z-10"></div>
        <img class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105 opacity-60" src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=780&q=80" alt="Students background"/>
        <div class="absolute inset-0 flex flex-col items-center justify-center p-8 z-20">
          <div class="w-24 h-24 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center text-white mb-4 group-hover:scale-110 transition-transform">
            <span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">favorite</span>
          </div>
        </div>
        <div class="absolute bottom-0 left-0 w-full p-6 z-20 flex flex-col justify-end">
          <h2 class="font-display text-white text-display leading-tight mb-1 text-center font-bold">UniMatch</h2>
          <p class="font-body-md text-white/90 text-center font-medium">The exclusive student community</p>
        </div>
      </a>

    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/scripts/supabase.js"></script>
<script>
  (async () => {
    const area = document.getElementById('user-status-area');
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      const profile = await getProfile();
      const name = profile?.full_name || session.user.email;
      
      // Update card links for authenticated users
      const thriftCard = document.getElementById('unithrift-card');
      const matchCard = document.getElementById('unimatch-card');
      if (thriftCard) thriftCard.href = '/marketplace/marketplace.html';
      if (matchCard) matchCard.href = '/unimatch/discover.html';

      const isAdmin = profile?.role === 'admin';
      area.innerHTML = `
        <span class="text-xs font-semibold text-on-surface-variant hidden sm:inline">Hi, ${name}</span>
        ${isAdmin ? `
          <a href="/admin/dashboard.html" class="text-xs font-bold px-3.5 py-1.5 rounded-full bg-[#5c0427] text-white hover:opacity-90 transition-all flex items-center gap-1 shadow-sm">
            <span class="material-symbols-outlined text-[15px]">admin_panel_settings</span>
            Admin Panel
          </a>
        ` : ''}
        <button onclick="logout().then(() => location.reload())" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-primary/10 text-primary hover:bg-primary/20 transition-colors">Sign Out</button>
      `;
    } else {
      area.innerHTML = `
        <a href="/unimatch/auth/login.html" class="text-xs font-semibold px-4 py-2 rounded-full bg-primary text-on-primary hover:opacity-90 transition-opacity shadow-sm">Sign In</a>
      `;
    }
  })();
</script>
</body>
</html>
