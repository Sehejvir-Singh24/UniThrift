      }
    },
    "hasPart": [

        "@type": "WebApplication",
        "name": "UniMatch",
        "alternateName": ["UniMatch app", "UniMatch Delhi", "UniMatch by UniThrift"],
        "url": "https://unithrift.co.in/unimatch/",

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/scripts/supabase.js"></script>
<script>
  (async () => {
    const area = document.getElementById('user-status-area');
    const thriftCard = document.getElementById('unithrift-card');
    const matchCard = document.getElementById('unimatch-card');

    try {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        const profile = await getProfile();
        const name = profile?.full_name || session.user.email?.split('@')[0] || 'Student';

        // Authenticated: redirect to actual home pages (not login)
        if (thriftCard) thriftCard.href = '/core/dashboard.html';
        if (matchCard) matchCard.href = '/unimatch/discover.html';

        const isAdmin = profile?.role === 'admin';
        area.innerHTML = `
          <span class="text-xs font-semibold text-on-surface/60 hidden sm:inline" style="font-family:'Geist',sans-serif;">Hi, ${name}</span>
          ${isAdmin ? `
            <a href="/admin/dashboard.html" class="text-xs font-bold px-3.5 py-1.5 rounded-full bg-primary text-white hover:opacity-90 transition-all flex items-center gap-1 shadow-sm" style="font-family:'Geist',sans-serif;">
              <span class="material-symbols-outlined text-[15px]">admin_panel_settings</span>
              Admin Panel
            </a>
          ` : ''}
          <button onclick="logout()" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-primary/10 text-primary hover:bg-primary/20 transition-colors" style="font-family:'Geist',sans-serif;">
            Sign Out
          </button>`;
      } else {
        area.innerHTML = `
          <a href="/auth/login.html" class="text-xs font-semibold px-4 py-2 rounded-full bg-primary text-white hover:opacity-90 transition-opacity shadow-sm" style="font-family:'Geist',sans-serif;">
            Sign In
          </a>`;
      }
    } catch(e) {
      console.error('Auth check error:', e);
    }
  })();
</script>
<script src="/scripts/support-widget.js" defer></script>
