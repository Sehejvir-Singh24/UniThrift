<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirming payment · UniThrift</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="/scripts/supabase.js"></script></head>
<body class="min-h-screen grid place-items-center bg-slate-50 font-sans p-6"><main class="max-w-sm w-full bg-white rounded-3xl shadow p-7 text-center"><div id="icon" class="text-4xl mb-3">⏳</div><h1 id="title" class="text-xl font-bold text-slate-900">Confirming your payment</h1><p id="message" class="mt-2 text-sm text-slate-600">Please wait while we securely confirm your PayU payment.</p></main>
<script>
(async () => {
  const txnid = new URLSearchParams(location.search).get('txnid');
  const title = document.getElementById('title'), message = document.getElementById('message'), icon = document.getElementById('icon');
  if (!txnid) { title.textContent = 'Payment reference missing'; message.textContent = 'Return to UniThrift and try again.'; icon.textContent = '⚠️'; return; }
  const profile = await getProfile();
  if (!profile) { location.href = '/auth/login.html'; return; }
  const { data, error } = await supabase.from('payment_transactions').select('*').eq('txnid', txnid).eq('user_id', profile.id).maybeSingle();
  if (error || !data || data.status !== 'success') { title.textContent = 'Payment was not completed'; message.textContent = data?.failure_reason || 'No money was captured. You can safely try again.'; icon.textContent = '⚠️'; return; }
  const metadata = data.metadata || {};
  if (data.purpose === 'reservation') location.replace(`/core/chat.html?id=${metadata.reservation_id}`);
  else if (data.purpose === 'flatmate_unlock') { const u = JSON.parse(localStorage.getItem('unithrift_unlocked_flatmates') || '[]'); if (!u.includes(metadata.listing_id)) { u.push(metadata.listing_id); localStorage.setItem('unithrift_unlocked_flatmates', JSON.stringify(u)); } location.replace('/roommates/flatmates.html'); }
  else if (data.purpose === 'boost') location.replace(metadata.return_path || '/core/profile.html');
  else { title.textContent = 'Payment complete'; message.textContent = 'Your payment has been confirmed.'; icon.textContent = '✓'; }
})();
</script></body></html>
