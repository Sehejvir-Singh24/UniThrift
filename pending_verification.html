<body class="bg-surface pt-safe pb-safe min-h-screen font-sans text-on-surface flex flex-col items-center justify-center">
<div class="flex flex-col items-center justify-center p-stack-lg max-w-sm text-center">
    <div class="w-24 h-24 rounded-full bg-surface-container flex items-center justify-center mb-stack-md relative overflow-hidden">
        <div class="absolute inset-0 bg-primary/10 animate-pulse"></div>
        <span class="material-symbols-outlined text-[48px] text-primary relative z-10">hourglass_empty</span>
    </div>
    <h1 class="font-display-lg text-display-lg text-on-surface mb-stack-sm">Account Under Review</h1>
    <p class="font-body-lg text-body-lg text-on-surface-variant mb-stack-lg">Your seller account and ID are currently being verified by our team. This usually takes 1-2 hours.</p>
    
    <button onclick="checkStatus()" class="w-full bg-primary text-on-primary font-title-md text-title-md py-4 rounded-full flex items-center justify-center gap-2 transition-transform duration-200 active:scale-[0.98] shadow-md" id="check-btn">
        <span id="btn-text">Check Status Again</span>
        <span id="btn-icon" class="material-symbols-outlined text-[20px]">refresh</span>
    </button>
    <button onclick="logout()" class="w-full mt-4 bg-transparent text-primary font-title-md text-title-md py-4 rounded-full flex items-center justify-center transition-transform duration-200 active:scale-[0.98]">
        Logout
    </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
    async function checkStatus() {
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        btnText.innerText = 'Checking...';
        btnIcon.classList.add('animate-spin');

        const profile = await getProfile();
        
        setTimeout(() => {
            btnIcon.classList.remove('animate-spin');
            if (profile && profile.is_verified) {
                window.location.href = 'index.html';
            } else {
                btnText.innerText = 'Still Pending';
                setTimeout(() => {
                    btnText.innerText = 'Check Status Again';
                }, 2000);
            }
        }, 1000);
    }
    
    async function logout() {
        await supabase.auth.signOut();
        window.location.href = 'login.html';
    }
</script>
</body></html>
