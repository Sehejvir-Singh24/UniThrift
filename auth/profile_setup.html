</head><body class="bg-[#FAFAFA] pt-safe pb-safe min-h-screen"><header class="h-20 px-container-padding-mobile flex items-center justify-center"><img alt="Logo" class="h-12 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtH4uYEmLByi1jW_bpwvfQ8lgafnrniPPxttkhpfAwQXnXw8NaT9mQkRksWXfo__XRM7d6Uvzm0Bwjn88BhIvEQONJqhM_exCVjyMuVo8JaM-QqfvxIedY9mpAB77aRx5NxpRDH4hHcAAK7XMuCqkpVLNDZbNaily1mDj9Sbn9wd4mk9nYQUiTqK5HOyLhdELnPMf9ECCHmvv5qA3vlmUb534EmdqX2-JyWeljbHwVMV0I03d9DZCZGd0vM"/></header><main class="flex flex-col relative w-full"><div class="flex flex-col w-full h-full relative overflow-hidden bg-background">
<!-- Ambient Background Elements -->
<div class="absolute -top-32 -right-32 w-96 h-96 bg-primary-fixed/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute top-1/2 -left-32 w-80 h-80 bg-tertiary-fixed-dim/20 rounded-full blur-[80px] pointer-events-none"></div>
<div class="flex-1 overflow-y-auto px-container-padding-mobile pb-[140px] z-10">
<!-- Progress Indicator -->
<div class="flex items-center justify-between w-full max-w-[200px] mx-auto mt-stack-md mb-stack-lg relative">
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-1 bg-surface-container-high rounded-full -z-10"></div>
<!-- Progress Line Active -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1/2 h-1 bg-primary rounded-full -z-10 origin-left scale-x-0 transition-transform duration-500 ease-out" id="progress-bar"></div>
<!-- Step 1 -->
<div class="flex flex-col items-center gap-2 relative group">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-[0_4px_12px_rgba(34,197,94,0.3)] transition-transform duration-300 group-active:scale-95">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<span class="font-label-caps text-on-surface text-[10px] absolute -bottom-6 whitespace-nowrap">Account</span>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center gap-2 relative group">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant transition-colors duration-300">
<span class="material-symbols-outlined text-[16px]">badge</span>
</div>
<span class="font-label-caps text-on-surface-variant text-[10px] absolute -bottom-6 whitespace-nowrap opacity-60">ID Upload</span>
</div>
<!-- Step 3 -->
<div class="flex flex-col items-center gap-2 relative group">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant transition-colors duration-300">
<span class="material-symbols-outlined text-[16px]">lock</span>
</div>
<span class="font-label-caps text-on-surface-variant text-[10px] absolute -bottom-6 whitespace-nowrap opacity-60">OTP</span>
</div>
</div>
<!-- Header -->
<div class="mt-stack-lg mb-stack-lg text-center">
<h1 class="font-headline-lg-mobile text-on-surface mb-2">Join the Community</h1>
<p class="font-body-sm text-on-surface-variant bg-surface-container-highest inline-block px-4 py-1.5 rounded-full backdrop-blur-md">Exclusive to GGSIPU students</p>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-[24px] p-stack-md shadow-[0_8px_30px_rgba(0,0,0,0.04)] relative overflow-hidden">
<!-- Decorative corner accent -->
<div class="absolute -top-10 -right-10 w-24 h-24 bg-primary/5 rounded-full pointer-events-none"></div>
<form class="flex flex-col gap-stack-md relative z-10" id="registration-form" onsubmit="event.preventDefault(); animateNextStep();">
<!-- Input Group: Enrollment -->
<div class="flex flex-col gap-2 mb-2">
  <label class="font-label-caps text-on-surface-variant ml-2">Year of Study</label>
  <div class="flex flex-wrap gap-2 p-1 bg-surface-container-low rounded-xl" id="year-buttons">
    <button class="flex-1 py-2 px-3 rounded-lg font-body-sm transition-all bg-primary text-on-primary shadow-sm" type="button" onclick="selectYear(this, '1st Year')">1st Year</button>
    <button class="flex-1 py-2 px-3 rounded-lg font-body-sm transition-all text-on-surface-variant hover:bg-surface-container" type="button" onclick="selectYear(this, '2nd Year')">2nd Year</button>
    <button class="flex-1 py-2 px-3 rounded-lg font-body-sm transition-all text-on-surface-variant hover:bg-surface-container" type="button" onclick="selectYear(this, '3rd Year')">3rd Year</button>
    <button class="flex-1 py-2 px-3 rounded-lg font-body-sm transition-all text-on-surface-variant hover:bg-surface-container" type="button" onclick="selectYear(this, '4th Year')">4th Year</button>
  </div>
</div>
<div class="flex flex-col gap-2 group">
<label class="font-label-caps text-on-surface-variant ml-2 transition-colors group-focus-within:text-primary" for="enrollment">GGSIPU Enrollment Number<span class="text-[10px] opacity-60 ml-2 font-normal">(Optional for 1st Year)</span></label>
<div class="relative flex items-center bg-surface-container-low rounded-xl focus-within:bg-surface-container transition-colors duration-200">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant opacity-60">pin</span>
<input class="w-full bg-transparent font-body-lg text-on-surface py-4 pl-12 pr-4 outline-none placeholder:text-on-surface-variant/40" id="enrollment" inputmode="numeric" maxlength="11" oninput="validateInput(this, 11)" pattern="[0-9]{11}" placeholder="e.g. 01216403221" type="text"/>
<!-- Validation Icon Container -->
<div class="absolute right-4 opacity-0 transition-opacity duration-300" id="enrollment-check">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="absolute right-4 px-2 py-0.5 bg-surface-container-highest rounded-full text-[10px] font-label-caps text-on-surface-variant/60">Optional</div></div>
<p class="font-body-sm text-error hidden text-xs ml-2 mt-1" id="enrollment-error">Must be exactly 11 digits</p>
</div>

<div class="flex flex-col gap-2 group mb-4">
    <label class="font-label-caps text-on-surface-variant ml-2 transition-colors group-focus-within:text-primary">College</label>
    <div class="relative flex items-center bg-surface-container-low rounded-xl focus-within:bg-surface-container transition-colors duration-200">
        <span class="material-symbols-outlined absolute left-4 text-on-surface-variant opacity-60">school</span>
        <select id="college" class="w-full bg-transparent font-body-lg text-on-surface py-4 pl-12 pr-4 outline-none appearance-none cursor-pointer" onchange="checkFormCompleteness()">
            <option value="" disabled selected>Select your GGSIPU College</option>
            <option value="USICT">USICT (University School of Info, Comm and Tech)</option>
            <option value="MAIT">MAIT (Maharaja Agrasen Institute of Technology)</option>
            <option value="MSIT">MSIT (Maharaja Surajmal Institute of Technology)</option>
            <option value="BPIT">BPIT (Bhagwan Parshuram Institute of Technology)</option>
            <option value="BVCOE">BVCOE (Bharati Vidyapeeth's College of Engineering)</option>
            <option value="GTBIT">GTBIT (Guru Tegh Bahadur Institute of Technology)</option>
            <option value="GTB4CEC">GTB4CEC (Guru Tegh Bahadur 4th Centenary Engineering College)</option>
            <option value="ADGITM">ADGITM (Akhilesh Das Gupta Institute of Tech & Mgmt)</option>
            <option value="VIPS-TC">VIPS-TC (Vivekananda Institute of Professional Studies)</option>
            <option value="HMRITM">HMRITM (HMR Institute of Technology and Management)</option>
            <option value="JIMS">JIMS Engineering Management Technical Campus</option>
            <option value="DTC">DTC (Delhi Technical Campus)</option>
        </select>
        <span class="material-symbols-outlined absolute right-4 pointer-events-none text-on-surface-variant opacity-60 group-hover:text-primary transition-colors">expand_more</span>
    </div>
</div>
<!-- Input Group: Full Name -->
<div class="flex flex-col gap-2 group">
<label class="font-label-caps text-on-surface-variant ml-2 transition-colors group-focus-within:text-primary" for="fullname">Full Name</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl focus-within:bg-surface-container transition-colors duration-200">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant opacity-60">person_outline</span>
<input class="w-full bg-transparent font-body-lg text-on-surface py-4 pl-12 pr-4 outline-none placeholder:text-on-surface-variant/40 capitalize" id="fullname" oninput="checkFormCompleteness()" placeholder="As per University ID" required="" type="text"/>
</div>
</div>
<!-- Input Group: Phone -->
<div class="flex flex-col gap-2 group">
<label class="font-label-caps text-on-surface-variant ml-2 transition-colors group-focus-within:text-primary" for="phone">Phone Number</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl focus-within:bg-surface-container transition-colors duration-200">
<span class="absolute left-4 font-body-lg text-on-surface-variant opacity-80">+91</span>
<div class="w-[1px] h-6 bg-on-surface-variant/20 absolute left-14"></div>
<input class="w-full bg-transparent font-body-lg text-on-surface py-4 pl-16 pr-4 outline-none placeholder:text-on-surface-variant/40" id="phone" inputmode="numeric" maxlength="10" oninput="validateInput(this, 10)" pattern="[0-9]{10}" placeholder="98765 43210" required="" type="tel"/>
<div class="absolute right-4 opacity-0 transition-opacity duration-300" id="phone-check">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
</form>
</div>
</div>
<!-- Fixed Bottom Action Area with Glassmorphism -->
<div class="fixed bottom-0 left-0 right-0 p-container-padding-mobile pb-safe bg-surface/80 backdrop-blur-[12px] z-50 transform translate-y-0 transition-transform duration-300" id="bottom-action">
<div class="max-w-[800px] mx-auto w-full">
<button class="w-full h-14 bg-surface-container-highest text-on-surface-variant font-title-md rounded-xl flex items-center justify-center gap-2 transition-all duration-300 disabled:opacity-70 disabled:cursor-not-allowed shadow-[0_4px_20px_rgba(0,0,0,0.04)]" disabled="" form="registration-form" id="next-btn" type="submit">
<span>Continue</span>
<span class="material-symbols-outlined transition-transform duration-300 group-hover:translate-x-1" id="next-icon">arrow_forward</span>
</button>
<p class="text-center font-body-sm text-on-surface-variant/60 mt-4 text-xs">
                By continuing, you agree to our Terms &amp; Privacy Policy.
            </p>
</div>
</div>
<script>
        // Progress bar initial animation
        setTimeout(() => {
            const progressBar = document.getElementById('progress-bar');
            if(progressBar) {
                progressBar.style.transform = 'scaleX(0.5)';
            }
        }, 300);

        function validateInput(input, requiredLength) {
            // Only allow numbers
            input.value = input.value.replace(/[^0-9]/g, '');
            
            const checkIcon = document.getElementById(`${input.id}-check`);
            const errorMsg = document.getElementById(`${input.id}-error`);
            
            if (input.value.length === requiredLength) {
                if(checkIcon) checkIcon.classList.remove('opacity-0');
                if(errorMsg) errorMsg.classList.add('hidden');
            } else {
                if(checkIcon) checkIcon.classList.add('opacity-0');
                if(errorMsg && input.value.length > 0 && input.id === 'enrollment') {
                   // Optional: show error while typing if needed, currently hidden until blur or manual logic
                }
            }
            
            checkFormCompleteness();
        }

        function checkFormCompleteness() {
            const enrollment = document.getElementById('enrollment').value;
            const fullname = document.getElementById('fullname').value;
            const college = document.getElementById('college').value;
            const phone = document.getElementById('phone').value;
            const btn = document.getElementById('next-btn');

            const isEnrollmentValid = (selectedYear === '1st Year' && enrollment.length === 0) || enrollment.length === 11;
            const isValid = isEnrollmentValid && fullname.length > 2 && phone.length === 10 && college;

            if (isValid) {
                btn.removeAttribute('disabled');
                btn.classList.remove('bg-surface-container-highest', 'text-on-surface-variant');
                btn.classList.add('bg-primary-container', 'text-on-primary-container');
                // Pulse animation
                btn.style.transform = 'scale(1.02)';
                setTimeout(() => btn.style.transform = 'scale(1)', 200);
            } else {
                btn.setAttribute('disabled', 'true');
                btn.classList.add('bg-surface-container-highest', 'text-on-surface-variant');
                btn.classList.remove('bg-primary-container', 'text-on-primary-container');
            }
        }

        // Add blur listener for enrollment specific error
        document.getElementById('enrollment')?.addEventListener('blur', function() {
            const errorMsg = document.getElementById('enrollment-error');
            if(this.value.length > 0 && this.value.length < 11) {
                errorMsg.classList.remove('hidden');
                this.parentElement.classList.add('ring-2', 'ring-error', 'bg-error-container/20');
            } else {
                errorMsg.classList.add('hidden');
                this.parentElement.classList.remove('ring-2', 'ring-error', 'bg-error-container/20');
            }
        });

        let selectedYear = '1st Year';

        function selectYear(btn, year) {
            selectedYear = year;
            const buttons = document.getElementById('year-buttons').querySelectorAll('button');
            buttons.forEach(b => {
                b.className = 'flex-1 py-2 px-3 rounded-lg font-body-sm transition-all text-on-surface-variant hover:bg-surface-container';
            });
            btn.className = 'flex-1 py-2 px-3 rounded-lg font-body-sm transition-all bg-primary text-on-primary shadow-sm';
            checkFormCompleteness();
        }

        async function animateNextStep() {
            const btn = document.getElementById('next-btn');
            const icon = document.getElementById('next-icon');
            const progressBar = document.getElementById('progress-bar');
            
            const enrollment = document.getElementById('enrollment').value;
            const fullname = document.getElementById('fullname').value;
            const college = document.getElementById('college').value;
            const phone = document.getElementById('phone').value;

            // Button loading state
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span><span class="ml-2">Saving...</span>`;
            
            try {
                await updateProfile({
                    full_name: fullname,
                    phone_number: phone,
                    enrollment_number: enrollment,
                    year_of_study: selectedYear,
                    college: college
                });

                // Success state
                btn.classList.replace('bg-primary-container', 'bg-primary');
                btn.classList.replace('text-on-primary-container', 'text-on-primary');
                btn.innerHTML = `<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check</span><span class="ml-2">Success</span>`;
                
                if(progressBar) progressBar.style.transform = 'scaleX(1)';
                
                setTimeout(() => {
                    window.location.href = '/auth/id_verification.html';
                }, 800);
            } catch (err) {
                alert("Error saving profile: " + err.message);
                btn.innerHTML = `<span>Continue</span><span class="material-symbols-outlined transition-transform duration-300 group-hover:translate-x-1" id="next-icon">arrow_forward</span>`;
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="/scripts/supabase.js"></script>
    <script>
        requireAuth().then(isAuth => {
            if(!isAuth) window.location.href = '/auth/login.html';
        });
    </script>
</div></main></body></html>
