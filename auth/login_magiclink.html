<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>UniThrift – Login</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  @layer base { html,body{width:100vw;margin:0;padding:0;overflow-x:hidden;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);} }
  ::-webkit-scrollbar{display:none;}

  /* Tab toggle animation */
  .auth-tab { transition: all 0.3s ease; }
  .auth-tab.active { background: #006e2f; color: #fff; box-shadow: 0 4px 12px rgba(0,110,47,0.25); }
  .auth-tab:not(.active) { background: transparent; color: #3d4a3d; }

  /* Slide animation for role section */
  #role-section {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
  }
  #role-section.visible {
    max-height: 120px;
    opacity: 1;
    margin-top: 16px;
  }
</style>
</head>
<body class="bg-background pt-safe pb-safe min-h-screen font-body-lg">

<header class="h-20 px-container-padding-mobile flex items-center justify-center">
  <img alt="UniThrift Logo" class="h-10 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtH4uYEmLByi1jW_bpwvfQ8lgafnrniPPxttkhpfAwQXnXw8NaT9mQkRksWXfo__XRM7d6Uvzm0Bwjn88BhIvEQONJqhM_exCVjyMuVo8JaM-QqfvxIedY9mpAB77aRx5NxpRDH4hHcAAK7XMuCqkpVLNDZbNaily1mDj9Sbn9wd4mk9nYQUiTqK5HOyLhdELnPMf9ECCHmvv5qA3vlmUb534EmdqX2-JyWeljbHwVMV0I03d9DZCZGd0vM"/>
</header>

<main class="flex flex-col w-full min-h-[calc(100vh-80px)] px-container-padding-mobile py-8 relative bg-background">
  <!-- Decorative blobs -->
  <div class="absolute top-0 right-0 w-72 h-72 bg-primary/5 rounded-full blur-3xl -z-10 pointer-events-none translate-x-1/2 -translate-y-1/3"></div>
  <div class="absolute bottom-0 left-0 w-72 h-72 bg-primary/5 rounded-full blur-3xl -z-10 pointer-events-none -translate-x-1/3 translate-y-1/3"></div>

  <div class="flex flex-col w-full max-w-sm mx-auto flex-1 justify-center gap-8">

    <!-- Logo + Hero -->
    <div class="flex flex-col items-center text-center gap-3">
      <div class="w-16 h-16 rounded-2xl bg-surface-container-high flex items-center justify-center shadow-sm" id="icon-container">
        <span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings:'FILL' 1" id="hero-icon">shopping_bag</span>
      </div>
      <div>
        <h1 id="page-title" class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Welcome to UniThrift</h1>
        <p id="page-subtitle" class="font-body-lg text-body-lg text-on-surface-variant mt-1">Your campus buy & sell marketplace</p>
      </div>
    </div>

    <!-- New / Returning Tab Toggle -->
    <div class="flex bg-surface-container-highest p-1 rounded-full w-full gap-1" id="tab-toggle-container">
      <button id="tab-new" class="auth-tab active flex-1 py-2.5 rounded-full font-title-md text-sm" onclick="switchTab('new')">New User</button>
      <button id="tab-returning" class="auth-tab flex-1 py-2.5 rounded-full font-title-md text-sm" onclick="switchTab('returning')">Sign In</button>
    </div>

    <!-- Form -->
    <div class="flex flex-col gap-4">
      <!-- Email -->
      <div class="flex flex-col gap-2" id="email-container">
        <label class="font-label-caps text-label-caps text-on-surface-variant ml-1" for="email-input">Email Address</label>
        <div class="flex items-center gap-2 bg-surface-container-highest rounded-full h-14 px-4 shadow-sm focus-within:shadow-md focus-within:bg-white transition-all duration-300">
          <span class="material-symbols-outlined text-[18px] text-on-surface-variant">mail</span>
          <div class="w-[1px] h-6 bg-outline-variant/50 mx-1"></div>
          <input class="flex-1 bg-transparent border-none outline-none font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/40 w-full"
            id="email-input" placeholder="student@university.ac.in" type="email" autocomplete="email"/>
        </div>
      </div>

      <!-- Role selection (only for new users) -->
      <div id="role-section" class="visible">
        <label class="font-label-caps text-label-caps text-on-surface-variant ml-1 block mb-2">I want to:</label>
        <div class="flex bg-surface-container-highest p-1 rounded-full w-full gap-1">
          <button id="role-customer" class="flex-1 py-2.5 rounded-full font-title-md text-sm bg-primary text-on-primary shadow-sm transition-all" onclick="selectRole('customer')">
            🛒 Buy
          </button>
          <button id="role-seller" class="flex-1 py-2.5 rounded-full font-title-md text-sm text-on-surface transition-all" onclick="selectRole('seller')">
            🏷️ Sell
          </button>
        </div>
        <input type="hidden" id="selected-role" value="customer"/>
      </div>

      <!-- Error -->
      <div id="auth-error" class="text-error text-sm font-medium text-center bg-error-container rounded-xl px-4 py-3 hidden"></div>

      <!-- Submit button -->
      <button id="continue-btn"
        class="w-full h-14 rounded-full bg-primary flex items-center justify-center gap-2 shadow-[0_4px_12px_rgba(0,110,47,0.2)] active:scale-[0.98] transition-all duration-200 mt-2 relative overflow-hidden group opacity-50 pointer-events-none">
        <span class="font-title-md text-title-md text-on-primary z-10" id="btn-text">Continue</span>
        <span class="material-symbols-outlined text-on-primary z-10 transition-transform duration-300 group-hover:translate-x-1" id="btn-icon">arrow_forward</span>
      </button>

      <!-- Divider -->
      <div class="flex items-center gap-4 opacity-40 mt-2" id="or-divider">
        <div class="flex-1 h-[1px] bg-outline-variant"></div>
        <span class="font-label-caps text-label-caps text-on-surface-variant">OR</span>
        <div class="flex-1 h-[1px] bg-outline-variant"></div>
      </div>

      <!-- Google -->
      <button id="google-btn" class="w-full h-14 rounded-full bg-surface-container-highest flex items-center justify-center gap-3 text-on-surface font-title-md text-sm shadow-sm active:scale-[0.98] transition-transform opacity-50 cursor-not-allowed">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/></svg>
        Continue with Google (coming soon)
      </button>
    </div>

    <!-- Footer hint -->
    <p class="font-body-sm text-body-sm text-on-surface-variant text-center mt-auto">
      <span id="footer-hint">Already have an account? <button onclick="switchTab('returning')" class="text-primary font-semibold hover:underline">Sign in</button></span>
    </p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/scripts/supabase.js"></script>
<script>
  let currentTab = 'new'; 

  function switchTab(tab) {
    currentTab = tab;
    const tabNew = document.getElementById('tab-new');
    const tabRet = document.getElementById('tab-returning');
    const roleSection = document.getElementById('role-section');
    const pageTitle = document.getElementById('page-title');
    const pageSubtitle = document.getElementById('page-subtitle');
    const footerHint = document.getElementById('footer-hint');

    if (tab === 'new') {
      tabNew.classList.add('active');
      tabRet.classList.remove('active');
      roleSection.classList.add('visible');
      pageTitle.innerText = 'Create Account';
      pageSubtitle.innerText = 'Join the campus buy & sell community';
      footerHint.innerHTML = 'Already have an account? <button onclick="switchTab(\'returning\')" class="text-primary font-semibold hover:underline">Sign in</button>';
    } else {
      tabRet.classList.add('active');
      tabNew.classList.remove('active');
      roleSection.classList.remove('visible');
      pageTitle.innerText = 'Welcome Back';
      pageSubtitle.innerText = 'Sign in to access your campus marketplace';
      footerHint.innerHTML = 'New to UniThrift? <button onclick="switchTab(\'new\')" class="text-primary font-semibold hover:underline">Create account</button>';
    }
  }

  function selectRole(role) {
    document.getElementById('selected-role').value = role;
    const btnCustomer = document.getElementById('role-customer');
    const btnSeller = document.getElementById('role-seller');
    if (role === 'customer') {
      btnCustomer.className = 'flex-1 py-2.5 rounded-full font-title-md text-sm bg-primary text-on-primary shadow-sm transition-all';
      btnSeller.className = 'flex-1 py-2.5 rounded-full font-title-md text-sm text-on-surface transition-all';
    } else {
      btnSeller.className = 'flex-1 py-2.5 rounded-full font-title-md text-sm bg-primary text-on-primary shadow-sm transition-all';
      btnCustomer.className = 'flex-1 py-2.5 rounded-full font-title-md text-sm text-on-surface transition-all';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const emailInput = document.getElementById('email-input');
    const continueBtn = document.getElementById('continue-btn');
    const errorDiv = document.getElementById('auth-error');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');

    // Auto-redirect if already logged in
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (session) {
        const profile = await getProfile();
        if(profile && profile.role === 'seller' && !profile.is_verified) {
            window.location.href = '/auth/id_verification.html';
        } else {
            window.location.href = '/index.html'; 
        }
      }
    });

    emailInput.addEventListener('input', (e) => {
      const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.target.value);
      continueBtn.classList.toggle('opacity-50', !isValid);
      continueBtn.classList.toggle('pointer-events-none', !isValid);
    });

    function setLoading(loading) {
      if (loading) {
        continueBtn.classList.add('pointer-events-none');
        btnText.innerText = 'Sending link...';
        btnIcon.innerText = 'progress_activity';
        btnIcon.classList.add('animate-spin');
      } else {
        continueBtn.classList.remove('pointer-events-none');
        btnText.innerText = 'Continue';
        btnIcon.innerText = 'arrow_forward';
        btnIcon.classList.remove('animate-spin');
      }
    }

    function showError(msg) {
      errorDiv.innerText = msg;
      errorDiv.classList.remove('hidden');
    }

    continueBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const role = currentTab === 'new' ? document.getElementById('selected-role').value : 'customer';

      errorDiv.classList.add('hidden');
      setLoading(true);

      const timeoutPromise = new Promise((_, reject) =>
        setTimeout(() => reject(new Error('Request timed out. Check your internet connection.')), 10000)
      );

      try {
        const otpPromise = supabase.auth.signInWithOtp({
          email,
          options: {
            shouldCreateUser: currentTab === 'new',
            data: currentTab === 'new' ? { role } : {}
          }
        });

        const { error } = await Promise.race([otpPromise, timeoutPromise]);

        if (error) {
          showError(error.message);
          setLoading(false);
        } else {
          // Success! Show magic link message instead of going to OTP page
          document.getElementById('page-title').innerText = 'Check your email';
          document.getElementById('page-subtitle').innerHTML = `We sent a magic link to <strong class="text-on-background">${email}</strong>`;
          
          document.getElementById('hero-icon').innerText = 'mark_email_read';
          
          // Hide form elements
          document.getElementById('email-container').style.display = 'none';
          document.getElementById('role-section').style.display = 'none';
          document.getElementById('or-divider').style.display = 'none';
          document.getElementById('google-btn').style.display = 'none';
          document.getElementById('tab-toggle-container').style.display = 'none';
          document.getElementById('footer-hint').parentElement.style.display = 'none';

          continueBtn.style.display = 'none'; // hide the continue button completely
        }
      } catch (err) {
        showError(err.message || 'Something went wrong. Please try again.');
        setLoading(false);
      }
    });
  });
</script>
</body></html>
