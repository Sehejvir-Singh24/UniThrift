</button>

<!-- Confirm Password Field -->

<input class="w-full h-[48px] px-md pt-base pb-base rounded-lg bg-surface-container border border-outline-variant font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="confirm-password" placeholder="••••••••" type="password"/>

</button>

<!-- Role selection (only for new users) -->

    <button type="button" id="role-customer" class="flex-1 py-2 rounded-md font-body-md text-sm bg-primary text-on-primary shadow-sm transition-all" onclick="selectRole('customer')">
    🛒 Buy
    </button>
    <button type="button" id="role-seller" class="flex-1 py-2 rounded-md font-body-md text-sm text-on-surface hover:bg-surface-container transition-all" onclick="selectRole('seller')">
    🏷️ Sell
    </button>
</div>
<input type="hidden" id="selected-role" value="customer"/>
</div>

<!-- Sign In Button -->
<button class="group relative h-[48px] w-full bg-primary text-on-primary rounded-lg font-headline-md text-headline-md overflow-hidden transition-all active:scale-[0.98] hover:bg-on-primary-fixed-variant opacity-50 pointer-events-none" id="signin-btn" type="submit">
<div class="relative z-10 flex items-center justify-center gap-xs">
<span id="btn-text">Sign In</span>
<span class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-x-1" id="btn-icon">arrow_forward</span>
</div>
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:animate-[shimmer_2s_infinite]"></div>
</button>

<div class="flex items-center my-4">
  <div class="flex-grow h-px bg-outline-variant/30"></div>
  <span class="mx-3 text-sm text-on-surface-variant/60 font-medium">or</span>
  <div class="flex-grow h-px bg-outline-variant/30"></div>
</div>

<!-- Google OAuth Button -->
<button type="button" id="google-btn" onclick="signInWithGoogleClick()" class="w-full h-[48px] border border-outline-variant/50 bg-surface-container-lowest text-on-surface rounded-lg font-headline-md text-headline-md flex items-center justify-center gap-2 active:scale-[0.98] transition-all hover:bg-surface-container-low shadow-sm">
  <svg id="google-icon" class="h-5 w-5 shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
  </svg>
  <span id="google-btn-text">Sign in with Google</span>
</button>

<div class="mt-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant" id="toggle-auth-text">
            Don't have an account? 
            <button class="text-primary font-headline-md font-semibold hover:underline decoration-2 underline-offset-4" onclick="toggleAuthMode()">Create account</button>
</p>
</div>

<!-- OTP Container -->
<div id="otp-container" class="hidden flex flex-col gap-lg">
  <div class="flex flex-col gap-base text-center">
    <h2 class="font-headline-md text-headline-md text-on-surface">Enter Code</h2>
    <p id="otp-subtitle" class="font-body-sm text-on-surface-variant">We sent a 6-digit code to your email.</p>
  </div>
  <div class="flex flex-col gap-xs">
    <label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="otp-code">Verification Code</label>
    <div class="relative group">
      <input class="w-full h-[48px] px-md pt-base pb-base rounded-lg bg-surface-container border border-outline-variant font-body-md text-body-md text-on-surface text-center tracking-[0.5em] font-bold focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="otp-code" placeholder="000000" type="text" maxlength="6"/>
    </div>
  </div>
  <button class="group relative h-[48px] w-full bg-primary text-on-primary rounded-lg font-headline-md text-headline-md overflow-hidden transition-all active:scale-[0.98] hover:bg-on-primary-fixed-variant" id="verify-btn" onclick="verifyOtpClick()">
    <div class="relative z-10 flex items-center justify-center gap-xs">
      <span id="verify-btn-text">Verify & Continue</span>
      <span class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-x-1" id="verify-btn-icon">arrow_forward</span>
    </div>
  </button>
  <div class="text-center">
    <button class="text-primary font-headline-md font-semibold hover:underline decoration-2 underline-offset-4" onclick="cancelOtp()">Back to sign in</button>
  </div>

</div>
</div>
<style>
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/scripts/supabase.js"></script>
<script>
    let isSignUp = false;

    async function signInWithGoogleClick() {
        const googleBtn = document.getElementById('google-btn');
        const googleBtnText = document.getElementById('google-btn-text');
        
        googleBtn.classList.add('pointer-events-none', 'opacity-50');
        googleBtnText.innerText = 'Redirecting to Google...';
        
        try {
            await signInWithGoogle();
        } catch (err) {
            const errorDiv = document.getElementById('auth-error');
            if (errorDiv) {
                errorDiv.innerText = "Google authentication failed: " + err.message;
                errorDiv.classList.remove('hidden');
            }
            googleBtn.classList.remove('pointer-events-none', 'opacity-50');
            googleBtnText.innerText = 'Sign in with Google';
        }
    }

    function toggleAuthMode() {
        isSignUp = !isSignUp;
        
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const roleSection = document.getElementById('role-section');
        const confirmPasswordContainer = document.getElementById('confirm-password-container');
        const btnText = document.getElementById('btn-text');
        const toggleText = document.getElementById('toggle-auth-text');
        const errorDiv = document.getElementById('auth-error');

        errorDiv.classList.add('hidden');

        if (isSignUp) {
            formTitle.innerText = 'Create Account';
            formSubtitle.innerText = 'Join the campus buy & sell community';
            roleSection.classList.remove('hidden');
            roleSection.classList.add('flex');
            confirmPasswordContainer.classList.remove('hidden');
            confirmPasswordContainer.classList.add('flex');
            btnText.innerText = 'Sign Up';
            toggleText.innerHTML = `Already have an account? <button class="text-primary font-headline-md font-semibold hover:underline decoration-2 underline-offset-4" onclick="toggleAuthMode()">Sign in</button>`;
        } else {
            formTitle.innerText = 'Welcome back';
            formSubtitle.innerText = 'Access your dashboard and workflow';
            roleSection.classList.add('hidden');
            roleSection.classList.remove('flex');
            confirmPasswordContainer.classList.add('hidden');
            confirmPasswordContainer.classList.remove('flex');
            btnText.innerText = 'Sign In';
            toggleText.innerHTML = `Don't have an account? <button class="text-primary font-headline-md font-semibold hover:underline decoration-2 underline-offset-4" onclick="toggleAuthMode()">Create account</button>`;
        }
        validateForm();
    }

    function selectRole(role) {
        document.getElementById('selected-role').value = role;
        const btnCustomer = document.getElementById('role-customer');
        const btnSeller = document.getElementById('role-seller');
        if (role === 'customer') {
            btnCustomer.className = 'flex-1 py-2 rounded-md font-body-md text-sm bg-primary text-on-primary shadow-sm transition-all';
            btnSeller.className = 'flex-1 py-2 rounded-md font-body-md text-sm text-on-surface hover:bg-surface-container transition-all';
        } else {
            btnSeller.className = 'flex-1 py-2 rounded-md font-body-md text-sm bg-primary text-on-primary shadow-sm transition-all';
            btnCustomer.className = 'flex-1 py-2 rounded-md font-body-md text-sm text-on-surface hover:bg-surface-container transition-all';
        }
    }

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const icon = document.getElementById('pass-icon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.innerText = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        icon.innerText = 'visibility';
      }
    }

    function toggleConfirmPassword() {
      const confirmPasswordInput = document.getElementById('confirm-password');
      const icon = document.getElementById('confirm-pass-icon');
      if (confirmPasswordInput.type === 'password') {
        confirmPasswordInput.type = 'text';
        icon.innerText = 'visibility_off';
      } else {
        confirmPasswordInput.type = 'password';
        icon.innerText = 'visibility';
      }
    }

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const signinBtn = document.getElementById('signin-btn');

    function validateForm() {
        const isEmailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value);
        const isPasswordValid = passwordInput.value.length >= 6;
        let isValid = isEmailValid && isPasswordValid;
        
        if (isSignUp) {
            const isConfirmPasswordValid = confirmPasswordInput.value === passwordInput.value;
            isValid = isValid && isConfirmPasswordValid;
        }
        
        signinBtn.classList.toggle('opacity-50', !isValid);
        signinBtn.classList.toggle('pointer-events-none', !isValid);
    }

    emailInput.addEventListener('input', validateForm);
    passwordInput.addEventListener('input', validateForm);
    confirmPasswordInput.addEventListener('input', validateForm);

    const otpInput = document.getElementById('otp-code');
    otpInput.addEventListener('input', (e) => {
        // Strip non-digits
        e.target.value = e.target.value.replace(/\D/g, '');
        if (e.target.value.length === 6) {
            verifyOtpClick();
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        // Check for signup query param to toggle auth mode on page load
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('signup') === 'true') {
            toggleAuthMode();
        }

        // Auto-redirect if already logged in
        supabase.auth.onAuthStateChange(async (event, session) => {
            if (session) {
                const profile = await getProfile();
                if(profile && !profile.full_name) {
                    window.location.href = '/auth/profile_setup.html';
                } else if(profile && !profile.is_verified && profile.verification_status !== 'pending') {
                    window.location.href = '/auth/id_verification.html';
                } else {
                    window.location.href = '/index.html'; 
                }
            }
        });

        const errorDiv = document.getElementById('auth-error');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');

        function showError(msg) {
            if (typeof msg === 'object') {
                errorDiv.innerText = JSON.stringify(msg);
            } else {
                errorDiv.innerText = msg;
            }
            errorDiv.classList.remove('hidden');
        }

        signinBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const role = isSignUp ? document.getElementById('selected-role').value : 'customer';

            errorDiv.classList.add('hidden');
            
            // UI Loading state
            const originalText = btnText.innerText;
            
            if (isSignUp && password !== confirmPasswordInput.value) {
                showError("Passwords do not match.");
                return;
            }
            
            signinBtn.classList.add('pointer-events-none');
            btnText.innerText = isSignUp ? 'Creating Account...' : 'Signing in...';
            btnIcon.innerText = 'progress_activity';
            btnIcon.classList.add('animate-spin');
            
            try {
                let authResult;
                
                if (isSignUp) {
                    authResult = await supabase.auth.signUp({
                        email,
                        password,
                        options: {
                            data: { role } 
                        }
                    });
                } else {
                    authResult = await supabase.auth.signInWithPassword({
                        email,
                        password
                    });
                }

                if (authResult.error) throw authResult.error;

                if (isSignUp && !authResult.data.session) {
                    // Transition to OTP view
                    window.pendingEmail = email;
                    document.getElementById('otp-subtitle').innerText = `We sent a 6-digit code to ${email}.`;
                    document.getElementById('auth-form-container').classList.add('hidden');
                    document.getElementById('otp-container').classList.remove('hidden');
                    
                    // Revert main signup button state in case they cancel back
                    signinBtn.classList.remove('pointer-events-none');
                    btnText.innerText = originalText;
                    btnIcon.innerText = 'arrow_forward';
                    btnIcon.classList.remove('animate-spin');
                    return;
                }
                
                // If success, onAuthStateChange takes over
            } catch (err) {
                console.error("Auth error occurred:", err);
                let errMsg = err.message || '';
                
                if (errMsg === '{}' || err.name === 'AuthRetryableFetchError' || err.status === 500) {
                    errMsg = 'Failed to send confirmation email. This is typically due to an SMTP configuration issue on the server. Please verify your custom SMTP settings.';
                } else if (!errMsg) {
                    errMsg = typeof err === 'string' ? err : JSON.stringify(err);
                }

                if (errMsg === '{}') {
                    errMsg = 'An unexpected server error occurred. Please try again or check SMTP settings.';
                }
                
                if (errMsg.includes('already registered') || errMsg.includes('already exists')) {
                    showError('Email is already registered. Please Sign In.');
                } else if (errMsg.includes('Invalid login')) {
                    showError('Invalid email or password.');
                } else {
                    showError(errMsg || 'Something went wrong. Please try again.');
                }
                
                // Revert button
                signinBtn.classList.remove('pointer-events-none');
                btnText.innerText = originalText;
                btnIcon.innerText = 'arrow_forward';
                btnIcon.classList.remove('animate-spin');
            }
        });
    });


    async function verifyOtpClick() {
        const codeInput = document.getElementById('otp-code');
        const code = codeInput.value.trim();
        const errorDiv = document.getElementById('auth-error');
        const verifyBtn = document.getElementById('verify-btn');
        const verifyBtnText = document.getElementById('verify-btn-text');
        const verifyBtnIcon = document.getElementById('verify-btn-icon');

        if (code.length !== 6) {
            errorDiv.innerText = "Please enter a valid 6-digit code.";
            errorDiv.classList.remove('hidden');
            return;
        }

        errorDiv.classList.add('hidden');
        verifyBtn.classList.add('pointer-events-none', 'opacity-80');
        verifyBtnText.innerText = 'Verifying...';

        try {
            const { data, error } = await supabase.auth.verifyOtp({
                email: window.pendingEmail,
                token: code,
                type: 'signup'
            });

            if (error) throw error;
            
            // Success! The onAuthStateChange listener will automatically trigger and redirect them.
        } catch (err) {
            let errMsg = err.message || '';
            if (errMsg === '{}' || err.name === 'AuthRetryableFetchError' || err.status === 500) {
                errMsg = "Server SMTP/connection error. Verification could not be processed.";
            } else if (!errMsg) {
                errMsg = typeof err === 'string' ? err : "Verification failed. Please check the code and try again.";
            }
            if (errMsg === '{}') errMsg = "Verification failed. Please try again.";

            errorDiv.innerText = errMsg;
            errorDiv.classList.remove('hidden');
            
            verifyBtn.classList.remove('pointer-events-none', 'opacity-80');
            verifyBtnText.innerText = 'Verify & Continue';
        }
    }

    function cancelOtp() {
        document.getElementById('otp-container').classList.add('hidden');
        document.getElementById('auth-form-container').classList.remove('hidden');
        document.getElementById('auth-error').classList.add('hidden');
    }
  </script>
</div></main></body></html>
