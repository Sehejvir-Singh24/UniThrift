</div>
<!-- Login Container -->
<div class="relative z-10 w-full max-w-[440px]">
<!-- Brand Logo / Identity -->
<div class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 rounded-xl flex items-center justify-center mb-md">
    <img alt="UniThrift Logo" class="h-16 w-auto object-contain drop-shadow-sm" src="https://lh3.googleusercontent.com/aida/AP1WRLtH4uYEmLByi1jW_bpwvfQ8lgafnrniPPxttkhpfAwQXnXw8NaT9mQkRksWXfo__XRM7d6Uvzm0Bwjn88BhIvEQONJqhM_exCVjyMuVo8JaM-QqfvxIedY9mpAB77aRx5NxpRDH4hHcAAK7XMuCqkpVLNDZbNaily1mDj9Sbn9wd4mk9nYQUiTqK5HOyLhdELnPMf9ECCHmvv5qA3vlmUb534EmdqX2-JyWeljbHwVMV0I03d9DZCZGd0vM"/>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight">UniThrift</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Your campus buy & sell marketplace.</p>
</div>
<!-- Auth Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-xl p-xl flex flex-col gap-lg transition-all duration-300 hover:shadow-2xl">
<div class="flex flex-col gap-base">
<h2 id="form-title" class="font-headline-md text-headline-md text-on-surface">Welcome back</h2>
<p id="form-subtitle" class="font-label-md text-label-md text-on-surface-variant">Access your dashboard and workflow</p>
</div>

<!-- Error -->
<div id="auth-error" class="text-error text-sm font-medium text-center bg-error-container rounded-lg px-4 py-3 hidden"></div>

<form class="flex flex-col gap-lg" onsubmit="return false;">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative group">
<input class="w-full h-[48px] px-md pt-base pb-base rounded-lg bg-surface-container border border-outline-variant font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="email" placeholder="student@university.edu" type="email"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-outline text-[20px] group-focus-within:text-primary transition-colors">
                mail
              </span>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
</div>
<div class="relative group">
<input class="w-full h-[48px] px-md pt-base pb-base rounded-lg bg-surface-container border border-outline-variant font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline text-[20px] hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="pass-icon">visibility</span>
</button>
</div>
</div>

<!-- Role selection (only for new users) -->
<div id="role-section" class="hidden flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider block">I want to:</label>
<div class="flex bg-surface-container-highest p-1 rounded-lg w-full gap-1">
    <button type="button" id="role-customer" class="flex-1 py-2 rounded-md font-body-md text-sm bg-primary text-on-primary shadow-sm transition-all" onclick="selectRole('customer')">
    🛒 Buy
    </button>
    <button type="button" id="role-seller" class="flex-1 py-2 rounded-md font-body-md text-sm text-on-surface hover:bg-surface-container transition-all" onclick="selectRole('seller')">
    🏷️ Sell
    </button>
</div>
<input type="hidden" id="selected-role" value="customer"/>
</div>

<!-- Sign In Button -->
<button class="group relative h-[48px] w-full bg-primary text-on-primary rounded-lg font-headline-md text-headline-md overflow-hidden transition-all active:scale-[0.98] hover:bg-on-primary-fixed-variant opacity-50 pointer-events-none" id="signin-btn" type="submit">
<div class="relative z-10 flex items-center justify-center gap-xs">
<span id="btn-text">Sign In</span>
<span class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-x-1" id="btn-icon">arrow_forward</span>
</div>
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:animate-[shimmer_2s_infinite]"></div>
</button>
</form>

<div class="mt-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant" id="toggle-auth-text">
            Don't have an account? 
            <button class="text-primary font-headline-md font-semibold hover:underline decoration-2 underline-offset-4" onclick="toggleAuthMode()">Create account</button>
</p>
</div>
</div>
</div>
</div>
<style>
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/scripts/supabase.js"></script>
<script>
    let isSignUp = false;

    function toggleAuthMode() {
        isSignUp = !isSignUp;
        
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const roleSection = document.getElementById('role-section');
        const btnText = document.getElementById('btn-text');
        const toggleText = document.getElementById('toggle-auth-text');
        const errorDiv = document.getElementById('auth-error');

        errorDiv.classList.add('hidden');

        if (isSignUp) {
            formTitle.innerText = 'Create Account';
            formSubtitle.innerText = 'Join the campus buy & sell community';
            roleSection.classList.remove('hidden');
            roleSection.classList.add('flex');
            btnText.innerText = 'Sign Up';
            toggleText.innerHTML = `Already have an account? <button class="text-primary font-headline-md font-semibold hover:underline decoration-2 underline-offset-4" onclick="toggleAuthMode()">Sign in</button>`;
        } else {
            formTitle.innerText = 'Welcome back';
            formSubtitle.innerText = 'Access your dashboard and workflow';
            roleSection.classList.add('hidden');
            roleSection.classList.remove('flex');
            btnText.innerText = 'Sign In';
            toggleText.innerHTML = `Don't have an account? <button class="text-primary font-headline-md font-semibold hover:underline decoration-2 underline-offset-4" onclick="toggleAuthMode()">Create account</button>`;
        }
        validateForm();
    }

    function selectRole(role) {
        document.getElementById('selected-role').value = role;
        const btnCustomer = document.getElementById('role-customer');
        const btnSeller = document.getElementById('role-seller');
        if (role === 'customer') {
            btnCustomer.className = 'flex-1 py-2 rounded-md font-body-md text-sm bg-primary text-on-primary shadow-sm transition-all';
            btnSeller.className = 'flex-1 py-2 rounded-md font-body-md text-sm text-on-surface hover:bg-surface-container transition-all';
        } else {
            btnSeller.className = 'flex-1 py-2 rounded-md font-body-md text-sm bg-primary text-on-primary shadow-sm transition-all';
            btnCustomer.className = 'flex-1 py-2 rounded-md font-body-md text-sm text-on-surface hover:bg-surface-container transition-all';
        }
    }

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const icon = document.getElementById('pass-icon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.innerText = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        icon.innerText = 'visibility';
      }
    }

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const signinBtn = document.getElementById('signin-btn');

    function validateForm() {
        const isEmailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value);
        const isPasswordValid = passwordInput.value.length >= 6;
        const isValid = isEmailValid && isPasswordValid;
        signinBtn.classList.toggle('opacity-50', !isValid);
        signinBtn.classList.toggle('pointer-events-none', !isValid);
    }

    emailInput.addEventListener('input', validateForm);
    passwordInput.addEventListener('input', validateForm);

    document.addEventListener('DOMContentLoaded', () => {
        // Auto-redirect if already logged in
        supabase.auth.onAuthStateChange(async (event, session) => {
            if (session) {
                const profile = await getProfile();
                if(profile && !profile.full_name) {
                    window.location.href = '/auth/profile_setup.html';
                } else if(profile && !profile.is_verified) {
                    window.location.href = '/auth/id_verification.html';
                } else {
                    window.location.href = '/index.html'; 
                }
            }
        });

        const errorDiv = document.getElementById('auth-error');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');

        function showError(msg) {
            errorDiv.innerText = msg;
            errorDiv.classList.remove('hidden');
        }

        signinBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const role = isSignUp ? document.getElementById('selected-role').value : 'customer';

            errorDiv.classList.add('hidden');
            
            // UI Loading state
            const originalText = btnText.innerText;
            signinBtn.classList.add('pointer-events-none');
            btnText.innerText = isSignUp ? 'Creating Account...' : 'Signing in...';
            btnIcon.innerText = 'progress_activity';
            btnIcon.classList.add('animate-spin');
            
            try {
                let authResult;
                
                if (isSignUp) {
                    authResult = await supabase.auth.signUp({
                        email,
                        password,
                        options: {
                            data: { role } 
                        }
                    });
                } else {
                    authResult = await supabase.auth.signInWithPassword({
                        email,
                        password
                    });
                }

                if (authResult.error) throw authResult.error;

                if (isSignUp && !authResult.data.session) {
                    showError("Please disable 'Confirm email' in Supabase.");
                }
                
                // If success, onAuthStateChange takes over
            } catch (err) {
                if (err.message.includes('already registered')) {
                    showError('Email is already registered. Please Sign In.');
                } else if (err.message.includes('Invalid login')) {
                    showError('Invalid email or password.');
                } else {
                    showError(err.message || 'Something went wrong. Please try again.');
                }
                
                // Revert button
                signinBtn.classList.remove('pointer-events-none');
                btnText.innerText = originalText;
                btnIcon.innerText = 'arrow_forward';
                btnIcon.classList.remove('animate-spin');
            }
        });
    });
  </script>
</div></main></body></html>
