  </head><body class="bg-[#FAFAFA] pt-safe pb-safe min-h-screen"><header class="h-20 px-container-padding-mobile flex items-center justify-center"><img alt="Logo" class="h-12 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtH4uYEmLByi1jW_bpwvfQ8lgafnrniPPxttkhpfAwQXnXw8NaT9mQkRksWXfo__XRM7d6Uvzm0Bwjn88BhIvEQONJqhM_exCVjyMuVo8JaM-QqfvxIedY9mpAB77aRx5NxpRDH4hHcAAK7XMuCqkpVLNDZbNaily1mDj9Sbn9wd4mk9nYQUiTqK5HOyLhdELnPMf9ECCHmvv5qA3vlmUb534EmdqX2-JyWeljbHwVMV0I03d9DZCZGd0vM"/></header><main class="flex flex-col relative w-full"><div class="flex flex-col w-full h-full min-h-[calc(100vh-5rem)] bg-background relative overflow-hidden" id="otp-container">
<div class="absolute inset-0 w-full h-full opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(circle at center, #006e2f 1px, transparent 1px); background-size: 24px 24px;"></div>
<div class="px-container-padding-mobile py-8 flex flex-col flex-1 relative z-10 w-full max-w-md mx-auto">
<div aria-label="Progress: Step 3 of 3" class="w-full flex gap-2 mb-8">
<div class="h-1.5 flex-1 rounded-full bg-primary"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary"></div>
</div>
<div class="flex flex-col items-center text-center mb-10 transform transition-all duration-700 translate-y-4 opacity-0" id="header-anim">
<div class="w-16 h-16 rounded-2xl bg-surface-container-high flex items-center justify-center mb-6 shadow-sm relative">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">mark_email_read</span>
<div class="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-primary animate-ping"></div>
<div class="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-primary"></div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-2">Enter Code</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px]">
                We've sent a 6-digit code to <span class="font-title-md text-title-md text-on-background block mt-1">+91 98765-XXXXX</span>
</p>
</div>
<div class="w-full mb-8 transform transition-all duration-700 delay-150 translate-y-4 opacity-0" id="inputs-anim">
<div class="flex justify-between gap-2 w-full" id="otp-inputs">
<input autofocus="" class="w-12 h-14 rounded-xl bg-surface-container text-center font-display-lg text-[28px] text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface-lowest shadow-[0_4px_20px_rgba(0,0,0,0.02)] transition-all otp-input" maxlength="1" type="tel"/>
<input class="w-12 h-14 rounded-xl bg-surface-container text-center font-display-lg text-[28px] text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface-lowest shadow-[0_4px_20px_rgba(0,0,0,0.02)] transition-all otp-input" maxlength="1" type="tel"/>
<input class="w-12 h-14 rounded-xl bg-surface-container text-center font-display-lg text-[28px] text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface-lowest shadow-[0_4px_20px_rgba(0,0,0,0.02)] transition-all otp-input" maxlength="1" type="tel"/>
<input class="w-12 h-14 rounded-xl bg-surface-container text-center font-display-lg text-[28px] text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface-lowest shadow-[0_4px_20px_rgba(0,0,0,0.02)] transition-all otp-input" maxlength="1" type="tel"/>
<input class="w-12 h-14 rounded-xl bg-surface-container text-center font-display-lg text-[28px] text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface-lowest shadow-[0_4px_20px_rgba(0,0,0,0.02)] transition-all otp-input" maxlength="1" type="tel"/>
<input class="w-12 h-14 rounded-xl bg-surface-container text-center font-display-lg text-[28px] text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface-lowest shadow-[0_4px_20px_rgba(0,0,0,0.02)] transition-all otp-input" maxlength="1" type="tel"/>
</div>
<div id="error-message" class="font-body-sm text-body-sm text-error text-center mt-2 hidden">Invalid code. Please try again.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/scripts/supabase.js"></script>
<div class="flex flex-col items-center mt-auto pb-4 transform transition-all duration-700 delay-300 translate-y-4 opacity-0" id="action-anim">
<button class="w-full h-14 rounded-xl bg-primary text-on-primary font-title-md text-title-md shadow-[0_8px_24px_rgba(0,110,47,0.2)] active:scale-[0.98] transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:active:scale-100" disabled="" id="verify-btn">
                Verify & Finish
                <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
<div class="mt-6 flex items-center gap-1">
<span class="font-body-sm text-body-sm text-on-surface-variant">Didn't receive it?</span>
<button class="font-title-md text-[14px] text-primary disabled:text-on-surface-variant/50 transition-colors" disabled="" id="resend-btn">
                    Resend code in <span id="timer">45s</span>
</button>
</div>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Entry Animations
        setTimeout(() => {
            document.getElementById('header-anim').classList.remove('translate-y-4', 'opacity-0');
        }, 50);
        setTimeout(() => {
            document.getElementById('inputs-anim').classList.remove('translate-y-4', 'opacity-0');
        }, 150);
        setTimeout(() => {
            document.getElementById('action-anim').classList.remove('translate-y-4', 'opacity-0');
        }, 250);

        const inputs = document.querySelectorAll('.otp-input');
        const verifyBtn = document.getElementById('verify-btn');
        const resendBtn = document.getElementById('resend-btn');
        const timerSpan = document.getElementById('timer');
        const errorMessage = document.getElementById('error-message');
        const container = document.getElementById('otp-container');

        // Timer Logic
        let timeLeft = 45;
        let timerInterval = setInterval(() => {
            timeLeft--;
            if(timeLeft > 0) {
                timerSpan.textContent = `${timeLeft}s`;
            } else {
                clearInterval(timerInterval);
                timerSpan.textContent = '';
                resendBtn.textContent = 'Resend now';
                resendBtn.disabled = false;
            }
        }, 1000);

        // Input Logic
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Allow only numbers
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                
                errorMessage.classList.add('hidden');
                inputs.forEach(i => i.classList.remove('ring-error', 'text-error'));

                if (e.target.value !== '') {
                    // Move to next
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
                checkComplete();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '') {
                    // Move to previous on backspace if empty
                    if (index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = '';
                    }
                }
            });

            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
                if(pastedData) {
                    [...pastedData].forEach((char, i) => {
                        if(inputs[i]) {
                            inputs[i].value = char;
                        }
                    });
                    if(pastedData.length < 6) {
                        inputs[pastedData.length].focus();
                    } else {
                        inputs[5].focus();
                    }
                    checkComplete();
                }
            });
        });

        function checkComplete() {
            const allFilled = Array.from(inputs).every(input => input.value.length === 1);
            verifyBtn.disabled = !allFilled;
            if(allFilled) {
                // Subtle pulse on button when ready
                verifyBtn.classList.add('animate-pulse');
                setTimeout(() => verifyBtn.classList.remove('animate-pulse'), 1000);
            }
        }

        // Supabase Verification
        verifyBtn.addEventListener('click', async () => {
            const code = Array.from(inputs).map(i => i.value).join('');
            verifyBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Verifying...`;
            verifyBtn.disabled = true;
            
            const email = sessionStorage.getItem('auth_email');
            if(!email) {
                alert("Session lost. Please go back and try again.");
                window.location.href = '/auth/login.html';
                return;
            }

            const { data, error } = await supabase.auth.verifyOtp({
                email,
                token: code,
                type: 'email'
            });

            if (error) { // Failure
                verifyBtn.innerHTML = `Verify & Finish <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>`;
                verifyBtn.disabled = false;
                errorMessage.classList.remove('hidden');
                errorMessage.innerText = error.message;
                inputs.forEach(i => {
                    i.classList.add('ring-2', 'ring-error', 'text-error');
                    i.value = '';
                });
                inputs[0].focus();
                
                // Shake animation
                const inputsContainer = document.getElementById('otp-inputs');
                inputsContainer.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 400, easing: 'ease-in-out' });
            } else { // Success
                verifyBtn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Success!`;
                verifyBtn.classList.replace('bg-primary', 'bg-primary-container');
                verifyBtn.classList.replace('text-on-primary', 'text-on-primary-container');
                
                createConfetti();
                
                // Fetch profile to route correctly
                const profile = await getProfile();
                
                setTimeout(() => { 
                    if(profile && profile.role === 'seller' && !profile.is_verified && profile.verification_status !== 'pending') {
                        window.location.href = '/auth/id_verification.html';
                    } else {
                        window.location.href = '/index.html'; 
                    }
                }, 1500);
            }
        });

        function createConfetti() {
            for(let i=0; i<30; i++) {
                const conf = document.createElement('div');
                conf.className = 'absolute w-2 h-2 rounded-full bg-primary pointer-events-none';
                conf.style.left = '50%';
                conf.style.bottom = '100px';
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 10 + Math.random() * 15;
                const tx = Math.cos(angle) * velocity * 10;
                const ty = -Math.sin(angle) * velocity * 10 - 50;
                
                container.appendChild(conf);
                
                conf.animate([
                    { transform: 'translate(-50%, 0) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), ${ty}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 1000,
                    easing: 'cubic-bezier(.25,.8,.25,1)'
                }).onfinish = () => conf.remove();
            }
        }
    });
</script></main></body></html>
