        Upload &amp; Continue
        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<button class="w-full bg-surface-container-lowest text-on-surface font-title-md text-title-md py-4 rounded-full flex items-center justify-center transition-transform duration-200 active:scale-[0.98] shadow-sm">
        Need help?
      </button>

<script>
    const uploadArea = document.getElementById('upload-area');
    const uploadInput = document.getElementById('id-upload-input');
    const uploadContent = document.getElementById('upload-content');
    const previewContainer = document.getElementById('preview-container');
    const removeBtn = document.getElementById('remove-btn');
    const continueBtn = document.getElementById('continue-btn');

    let selectedFile = null;

    uploadArea.addEventListener('click', (e) => {
        if(previewContainer.classList.contains('hidden') && !e.target.closest('#remove-btn')) {
            uploadInput.click();
        }
    });

    uploadInput.addEventListener('change', async (e) => {
        if (e.target.files && e.target.files[0]) {
            const file = e.target.files[0];
            
            // Show loading state
            uploadContent.innerHTML = `<div class="w-12 h-12 rounded-full border-4 border-surface-container border-t-primary animate-spin"></div>`;
            
            try {
                // Basic compression using Canvas (Max 800px, 70% quality) to save Free Tier Storage
                const compressedFile = await compressImage(file, 800, 0.7);
                selectedFile = compressedFile;

                // Show preview
                const objectUrl = URL.createObjectURL(compressedFile);
                const previewDiv = previewContainer.querySelector('div.bg-cover');
                previewDiv.style.backgroundImage = `url('${objectUrl}')`;
                
                // Update filename text
                const filenameSpan = previewContainer.querySelector('span.text-body-sm');
                filenameSpan.innerHTML = `<span class="material-symbols-outlined text-[16px]">check_circle</span> ${file.name}`;
                
                previewContainer.classList.remove('hidden');
                continueBtn.classList.remove('opacity-50', 'pointer-events-none');
                
                // Add success ripple
                const ripple = document.createElement('div');
                ripple.className = 'absolute inset-0 bg-primary/20 rounded-xl animate-[ping_0.5s_cubic-bezier(0,0,0.2,1)_forwards] pointer-events-none';
                uploadArea.appendChild(ripple);
                setTimeout(() => ripple.remove(), 500);
            } catch (err) {
                console.error("Compression error", err);
                alert("Error processing image. Please try a different one.");
                resetUploadArea();
            }
        }
    });

    function resetUploadArea() {
        selectedFile = null;
        uploadInput.value = '';
        previewContainer.classList.add('hidden');
        continueBtn.classList.add('opacity-50', 'pointer-events-none');
        uploadContent.innerHTML = `
         <div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center text-primary group-hover:scale-110 transition-transform duration-300 group-hover:bg-primary-container group-hover:text-on-primary-container">
            <span class="material-symbols-outlined text-[32px]">add_a_photo</span>
         </div>
         <div class="flex flex-col gap-1">
             <span class="font-title-md text-title-md text-on-surface">Tap to capture or upload</span>
             <span class="font-body-sm text-body-sm text-on-surface-variant">JPG, PNG, HEIC up to 5MB</span>
         </div>
        `;
    }

    removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        resetUploadArea();
    });

    continueBtn.addEventListener('click', async () => {
        if (!selectedFile) return;
        
        continueBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Uploading...`;
        continueBtn.classList.add('pointer-events-none');
        try {
            const { data: { session }, error: sessionError } = await supabase.auth.getSession();
            if (sessionError || !session) throw new Error("Not authenticated");
            
            const userId = session.user.id;
            const fileExt = selectedFile.name.split('.').pop();
            const filePath = `${userId}/id_card_${Date.now()}.${fileExt}`;
            
            // Upload to Supabase Storage
            const { data: uploadData, error: uploadError } = await supabase.storage
                .from('id_cards')
                .upload(filePath, selectedFile, { upsert: true });
                
            if (uploadError) throw uploadError;
            
            const { data: publicUrlData } = supabase.storage
                .from('id_cards')
                .getPublicUrl(filePath);
                
            const idUrl = publicUrlData.publicUrl;

            // Update user's profile with the URL and set status to pending review
            await updateProfile({ 
                is_verified: false, 
                id_url: idUrl,
                verification_status: 'pending',
                verification_feedback: null
            });
            window.location.href = '/index.html';
        } catch(err) {
            console.error("Upload error:", err);
            alert("Upload failed: " + err.message);
            continueBtn.innerHTML = `Upload & Continue <span class="material-symbols-outlined text-[20px]">arrow_forward</span>`;
            continueBtn.classList.remove('pointer-events-none');
        }
    });

    // Image compression helper function
    function compressImage(file, maxSize, quality) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height) {
                        if (width > maxSize) {
                            height = Math.round(height *= maxSize / width);
                            width = maxSize;
                        }
                    } else {
                        if (height > maxSize) {
                            width = Math.round(width *= maxSize / height);
                            height = maxSize;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    canvas.toBlob(blob => {
                        const newFile = new File([blob], file.name, {
                            type: file.type || 'image/jpeg',
                            lastModified: Date.now()
                        });
                        resolve(newFile);
                    }, file.type || 'image/jpeg', quality);
                };
                img.onerror = error => reject(error);
            };
            reader.onerror = error => reject(error);
        });
    }
</script>
