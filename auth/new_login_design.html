<form class="flex flex-col gap-lg" onsubmit="return false;">

<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-outline text-[20px] group-focus-within:text-primary transition-colors">
                mail
              </span>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Forgot Password?</a>
</div>

<input class="w-full h-[48px] px-md pt-base pb-base rounded-lg bg-surface-container border border-outline-variant font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline text-[20px] hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="pass-icon">visibility</span>
</button>
</div>
</div>
<!-- Sign In Button -->
<button class="group relative h-[48px] w-full bg-primary text-on-primary rounded-lg font-headline-md text-headline-md overflow-hidden transition-all active:scale-[0.98] hover:bg-on-primary-fixed-variant" id="signin-btn" type="submit">

</div>

<div class="h-[1px] flex-1 bg-outline-variant"></div>

<button class="flex items-center justify-center gap-xs h-[44px] rounded-lg border border-outline-variant bg-surface hover:bg-surface-container transition-colors group">

<path d="M1.5 1.5h8v8h-8z" fill="#f25022"></path><path d="M13.5 1.5h8v8h-8z" fill="#7fbb00"></path><path d="M1.5 13.5h8v8h-8z" fill="#00a4ef"></path><path d="M13.5 13.5h8v8h-8z" fill="#ffb900"></path>
</svg>

</button>

            Don't have an account?

</p>
</div>

<style>
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
<script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const icon = document.getElementById('pass-icon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.innerText = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        icon.innerText = 'visibility';
      }
    }

    // Micro-interaction for submit
    const btn = document.getElementById('signin-btn');
    btn.addEventListener('click', () => {
      const originalContent = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
      
      setTimeout(() => {
        btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span>';
        btn.classList.replace('bg-primary', 'bg-green-600');
        setTimeout(() => {
          btn.innerHTML = originalContent;
          btn.classList.replace('bg-green-600', 'bg-primary');
          btn.disabled = false;
        }, 2000);
      }, 1500);
    });
  </script>
